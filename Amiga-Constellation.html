houtcast and Icecast streaming with recording, for 68k and AmigaOS 4.","why":"Still updated in 2026 — twenty-eight years of releases, and the main reason a classic Amiga can be a music player.","version":"3.35 (10 Aug 2026)","url":"https://www.amigaamp.de","related":["ahi","mhi"],"tags":["audio"]},{"id":"vbcc","name":"vbcc","year":1996,"category":"dev","kind":"tool","status":"active","arch":["68k","ppc","x86"],"weight":4,"by":"Volker Barthelmann & Frank Wille","what":"A portable ISO-C compiler suite and the reference for OS-friendly 68k C, targeting AmigaOS 1.2 through 3.x, Kickstart 1.x, AmigaOS 4, MorphOS, WarpOS and more.","why":"The compiler that keeps producing binaries that run on a stock 1985 machine — a discipline modern toolchains rarely maintain.","version":"0.9h patch 1 (2022)","url":"http://sun.hasenbraten.de/vbcc/","tags":["compiler"]},{"id":"vasm","name":"vasm / vlink","year":1998,"category":"dev","kind":"tool","status":"active","arch":["68k","ppc"],"weight":4,"by":"Frank Wille","what":"A retargetable assembler supporting Devpac and Motorola syntaxes across M68k, PowerPC, Z80 and 6502, with the matching vlink linker.","why":"The assembler of choice for the demoscene and modern game development — and half the reason cross-development from a PC became practical.","url":"http://sun.hasenbraten.de/vasm/","tags":["assembler"]},{"id":"asmone","name":"ASM-One, AsmPro & Devpac","year":1990,"category":"dev","kind":"tool","status":"historic","arch":["68k"],"weight":2,"by":"various","what":"The native on-Amiga assemblers of the 1990s — integrated editor, assembler, debugger and monitor in one program. AsmPro survives as freeware on Aminet.","why":"Generations of demos and games were written entirely inside these, on the machine itself, with no cross-compiler in sight.","tags":["assembler"]},{"id":"amigagcc","name":"Bebbo's amiga-gcc","year":2017,"category":"dev","kind":"tool","status":"active","arch":["68k"],"weight":4,"by":"Stefan \"Bebbo\" Franke","what":"A GCC-for-AmigaOS toolchain, defaulting to GCC 6.5.0 with extensive m68k optimisation work and experimental GCC 13.x branches.","why":"The standard \"modern C on 68k\" toolchain, and the foundation nearly every current Amiga C project builds on.","url":"https://github.com/bebbo/amiga-gcc","tags":["compiler","open"]},{"id":"amigadebug","name":"amiga-debug (VS Code)","year":2019,"category":"dev","kind":"tool","status":"active","arch":["68k"],"weight":5,"by":"Bartman^Abyss","what":"A one-click VS Code extension that builds C and C++ with a bundled GCC 15.2, launches a bundled WinUAE or FS-UAE, and provides full source-level debugging, a cycle-accurate profiler, Copper and Blitter visualisers and size-profiled Shrinkler output.","why":"The tool that transformed modern Amiga development: the platform now has better debugging and profiling than it ever did commercially.","version":"1.8.2 (Apr 2026)","url":"https://github.com/BartmanAbyss/vscode-amiga-debug","related":["winuae","amigagcc"],"tags":["ide","open"]},{"id":"amigaasm","name":"Amiga Assembly (VS Code)","year":2018,"category":"dev","kind":"tool","status":"active","arch":["68k"],"weight":3,"by":"prb28","what":"A VS Code extension for 68k assembly with vasm and vlink integration, WinUAE and FS-UAE debugging, and documentation hovers.","why":"It brought modern editor tooling — completion, hovers, breakpoints — to hand-written 68k assembly.","version":"1.8.13 (2024)","url":"https://github.com/prb28/vscode-amiga-assembly","related":["vasm"],"tags":["ide","open"]},{"id":"amiblitz","name":"AmiBlitz 3","year":2010,"category":"dev","kind":"tool","status":"active","arch":["68k"],"weight":3,"by":"Sven Droll & community","what":"An open-source (Apache-2.0) continuation of Blitz Basic 2 with a modern IDE, FPU support and updated includes.","why":"It keeps alive the BASIC dialect that produced a remarkable share of 1990s Amiga games, and it still gets releases.","url":"https://github.com/AmiBlitz/AmiBlitz3","tags":["language","open"]},{"id":"amos","name":"AMOS & AOZ Studio","year":1990,"category":"dev","kind":"tool","status":"limited","arch":["68k","web"],"weight":2,"by":"François Lionet","what":"AMOS Professional, whose source was released by its author, who now builds AOZ Studio — a transpiling modern AMOS targeting web and PC. New AMOS games still appear.","why":"AMOS taught a generation to program games, and its author is still working on the idea thirty-five years later.","url":"https://aoz.studio","tags":["language"]},{"id":"hollywood","name":"Hollywood","year":2002,"category":"dev","kind":"tool","status":"shipping","arch":["68k","ppc","x86","arm"],"weight":4,"by":"Andreas Falkenhahn / Airsoft Softwair","what":"A cross-platform multimedia and application language: one codebase compiles to 68k AmigaOS, AmigaOS 4, MorphOS, AROS, WarpOS, Windows, macOS, Linux, Android APKs and iOS, with an extensive plugin system and the Hollywood Designer visual tool.","why":"It inverts the usual relationship — an Amiga-native language that exports to modern platforms — and is the most commercially sustained Amiga development product still selling.","version":"Hollywood 11 \"Coderise\" (Jan 2026)","url":"https://www.hollywood-mal.com","tags":["language"]},{"id":"redpill","name":"REDPILL","year":2020,"category":"dev","kind":"tool","status":"active","arch":["68k"],"weight":4,"by":"Carlos Peris","what":"A free visual game creator that runs *on the Amiga itself*, covering OCS and AGA with sprites, tilemaps and simple physics — no cross-development required.","why":"Extremely active, and responsible for a large share of new freeware Amiga games: it lets people make games on the machine they love without learning assembly.","version":"0.9.72 (Jul 2026)","tags":["gamedev"]},{"id":"scorpion","name":"Scorpion Engine","year":2019,"category":"dev","kind":"tool","status":"active","arch":["68k"],"weight":5,"by":"Erik \"earok\" Hogan","what":"A free (closed-source) game engine and Windows IDE targeting the Amiga from an A500 upward, plus the Mega Drive and Neo Geo, from a single project.","why":"Behind a very large share of modern commercial Amiga releases — Metro Siege, Creeping Me Out and many others. Arguably the most productive single tool in the current scene.","version":"Scorpion 2025.0","url":"https://github.com/earok/scorpion-editor-demos","tags":["gamedev"]},{"id":"ace","name":"ACE (Amiga C Engine)","year":2018,"category":"dev","kind":"tool","status":"active","arch":["68k"],"weight":3,"by":"AmigaPorts community","what":"An open-source (MPL-2.0) C framework for bare-metal Amiga game development, abstracting the Blitter and Copper while staying Kickstart 1.3-compatible.","why":"The middle path between assembly and an engine: modern C structure with direct hardware performance.","url":"https://github.com/AmigaPorts/ACE","related":["amigagcc"],"tags":["gamedev","open"]},{"id":"dreadengine","name":"dread engine","year":2021,"category":"dev","kind":"tool","status":"active","arch":["68k"],"weight":4,"by":"Krzysztof \"KK/Altair\" Kluczek","what":"The famous \"Doom on an A500\" rendering technology, first shown in the 2021 Dread demos and now driving the game GRIND. Public demo builds continue; a full release is still pending.","why":"It overturned a thirty-year assumption that texture-mapped first-person 3D was impossible on a stock 68000 Amiga.","tags":["gamedev","3d"]},{"id":"amitools","name":"amitools / xdftool","year":2010,"category":"dev","kind":"tool","status":"active","arch":["x86"],"weight":3,"by":"Christian Vogelgsang","what":"A Python toolbox that is the glue of modern Amiga build pipelines: xdftool for ADF and HDF images, rdbtool, romtool, hunktool, and vamos, which runs AmigaOS CLI binaries directly on a host machine.","why":"vamos in particular lets continuous-integration systems run genuine Amiga compilers with no emulator GUI at all.","version":"0.8.1 (Dec 2025)","url":"https://github.com/cnvogelg/amitools","tags":["tooling","open"]},{"id":"llvmm68k","name":"LLVM/Clang m68k backend","year":2021,"category":"dev","kind":"tool","status":"active","arch":["68k"],"weight":2,"by":"Min-Yih Hsu & LLVM project","what":"The M68k backend has been in the LLVM tree since version 13 and keeps improving, but remains officially experimental — usable for bare-metal experiments rather than production AmigaOS work. Rust and Zig on 68k depend on it and are proof-of-concept only.","why":"If it matures, it is the route by which modern languages finally reach a 1979 CPU.","tags":["compiler","open"]},{"id":"ndk","name":"SDKs & developer documentation","year":2021,"category":"dev","kind":"tool","status":"shipping","arch":["68k","ppc","x86"],"weight":3,"by":"Hyperion, MorphOS Team, AROS","what":"The official kits: the free NDK 3.2 for classic AmigaOS, the AmigaOS 4.1 SDK refreshed in June 2026, the MorphOS 3.20 SDK with GCC 15.2 and Python 3.14, and AROS development via nightly contribs, deadwood's ABIv11 and AxRuntime. The ROM Kernel Reference Manuals remain readable online at amigadev.elowar.com.","why":"The Amiga is unusually well documented for its age — the original Commodore autodocs and RKMs are still the primary reference thirty years later.","related":["os32","os41fe","morphos320"],"tags":["sdk","docs"]},{"id":"whdload","name":"WHDLoad","year":1996,"category":"pres","kind":"component","status":"active","arch":["68k"],"weight":5,"by":"Bert Jahn","what":"The AmigaOS-friendly hard-disk install system for floppy-only games and demos: it loads them into an OS-clean environment, patches quirks — Kickstart dependencies, timing bugs, disk protection — adds trainers and quit keys, and returns cleanly to Workbench. New and updated installs are published continuously.","why":"The single most important classic-Amiga preservation project on real hardware. Nearly every launcher, pack and turnkey image in this atlas is built on it.","version":"v20.0 (27 Mar 2026)","url":"https://www.whdload.de","related":["os3x"],"tags":["preservation","games"]},{"id":"sps","name":"Software Preservation Society (SPS/CAPS)","year":2001,"category":"pres","kind":"org","status":"limited","arch":["68k"],"weight":4,"by":"SPS","what":"Founded to preserve floppy software bit-perfectly, SPS created the IPF format — flux-derived images that include copy protection — and the CAPSimg library that lets WinUAE, FS-UAE, Amiberry and MAME read them. The site is online but visibly dormant.","why":"It set the standard for authentic disk preservation. Its restrictive licensing is also why GPL emulators must load CAPSimg as a separate user-downloaded plugin.","url":"http://www.softpres.org","tags":["preservation","format"]},{"id":"kryoflux","name":"KryoFlux","year":2009,"category":"pres","kind":"component","status":"shipping","arch":["x86"],"weight":3,"by":"KryoFlux Products & Services (UK)","what":"SPS's own USB forensic floppy controller, sampling magnetic flux transitions; a de-facto standard at universities, museums and archives, with separate personal and institutional licensing.","why":"It professionalised disk archiving — and its non-commercial licensing terms are a large part of why fully open alternatives gained momentum.","url":"https://kryoflux.com","related":["sps"],"tags":["preservation","hardware"]},{"id":"greaseweazle","name":"Greaseweazle","year":2019,"category":"pres","kind":"component","status":"active","arch":["x86"],"weight":4,"by":"Keir Fraser","what":"A fully open-source (Unlicense) USB flux reader and writer, with boards from around £10–£30 and support for nearly any floppy format.","why":"The community favourite of the 2020s: it made archiving your own disk collection cheap enough that thousands of people actually did it.","version":"host tools v1.23 (Dec 2025)","url":"https://github.com/keirf/greaseweazle","related":["sps"],"tags":["preservation","hardware","open"]},{"id":"drawbridge","name":"DrawBridge / FloppyBridge","year":2017,"category":"pres","kind":"component","status":"active","arch":["x86"],"weight":3,"by":"Rob Smith","what":"An Arduino-based board and software to read and write ADFs and flux from real Amiga disks — whose killer feature, FloppyBridge, mounts a *real floppy drive* live inside WinUAE and Amiberry, with DrawBridge, Greaseweazle and SuperCard Pro all supported as bridges.","why":"It closes the loop between physical media and emulation: put a 1989 disk in a drive and it appears in a modern emulator.","version":"2.8.9","url":"https://amiga.robsmithdev.co.uk","related":["winuae","greaseweazle"],"tags":["preservation","hardware","open"]},{"id":"fluxtools","name":"SuperCard Pro, FluxEngine & Applesauce","year":2011,"category":"pres","kind":"component","status":"shipping","arch":["x86"],"weight":2,"by":"Jim Drew / David Given / John Morris","what":"The rest of the flux-imaging field: Jim Drew's SuperCard Pro, origin of the widely supported .scp format; David Given's ~$15 MIT-licensed FluxEngine, which can also drive Greaseweazle hardware; and Applesauce, historically Apple-focused but now supporting Amiga DD and HD disks with AmigaDOS browsing and ADF export.","why":"Between them, flux-level archiving is now available at every price point from $15 to institutional.","related":["greaseweazle"],"tags":["preservation","hardware"]},{"id":"aminet","name":"Aminet","year":1992,"category":"pres","kind":"archive","status":"active","arch":["68k","ppc","x86"],"weight":5,"by":"Urban Müller & team","what":"The historic centre of Amiga software distribution and long claimed as the largest public archive for any single platform of its era — still taking new uploads daily across 68k, PowerPC, MorphOS and AROS, with worldwide mirrors.","why":"Thirty-four years of continuous operation. Aminet is why so much Amiga software simply still exists, and why paths like `util/wb/` function as citations in this scene.","version":"85,499 packages (Aug 2026)","url":"https://aminet.net","tags":["archive"]},{"id":"os4depot","name":"OS4Depot, MorphOS Storage & AROS Archives","year":2004,"category":"pres","kind":"archive","status":"active","arch":["ppc","x86"],"weight":3,"by":"respective communities","what":"The next-generation equivalents of Aminet: OS4Depot with over 4,500 files, MorphOS Storage with nearly 2,000 and more than a million downloads, and the slower-moving AROS Archives.","why":"Each living system maintains its own well-curated repository — a small ecosystem's version of a package manager.","url":"https://os4depot.net","related":["aminet"],"tags":["archive"]},{"id":"hol","name":"Hall of Light","year":2001,"category":"pres","kind":"archive","status":"active","arch":["68k"],"weight":4,"by":"HOL team (abime.net)","what":"The definitive Amiga games database: releases, versions, credits, box, manual and media scans and screenshots, cross-linked with the Amiga Magazine Rack's reviews. Now served at amiga.abime.net behind anti-scraper protection.","why":"The reference catalogue of what was actually published on the Amiga — indispensable to preservation and to every launcher's metadata.","url":"https://amiga.abime.net","tags":["archive","games"]},{"id":"lemon","name":"Lemon Amiga & OpenRetro","year":2004,"category":"pres","kind":"archive","status":"active","arch":["68k"],"weight":3,"by":"Kim Lemon / Frode Solheim","what":"Lemon Amiga is a polished games database and community with roughly 4,500 titles, reviews and votes; OpenRetro is Frode Solheim's open, wiki-style *configuration* database — correct model, chipset, controls and WHDLoad variants — consumed live by the FS-UAE Launcher.","why":"OpenRetro in particular solved a specific problem: not what a game *is*, but exactly how to run it correctly.","url":"https://www.lemonamiga.com","related":["fsuae","hol"],"tags":["archive","games"]},{"id":"amr","name":"Amiga Magazine Rack","year":2003,"category":"pres","kind":"archive","status":"active","arch":["68k"],"weight":3,"by":"abime.net","what":"An index of over 100 Amiga magazines with tens of thousands of scanned pages, every review and preview cross-linked to Hall of Light entries. Complete runs of Amiga Format, CU Amiga, Amiga World, Amazing Computing and Amiga Power are also mirrored on the Internet Archive.","why":"It preserves the *discourse* around the platform, not just its software — the reviews, the culture, the arguments.","url":"https://amr.abime.net","related":["hol"],"tags":["archive","media"]},{"id":"tosec","name":"TOSEC","year":2000,"category":"pres","kind":"archive","status":"active","arch":["68k"],"weight":3,"by":"The Old School Emulation Center","what":"A cataloguing project publishing DAT files that name and verify over 1,033,000 software sets across 300+ platforms, with the Commodore Amiga branch among the largest.","why":"It provides the canonical naming and checksums that make large collections verifiable rather than merely large.","version":"2025-03-13","url":"https://www.tosecdev.org","tags":["archive","format"]},{"id":"eabfs","name":"EAB File Server & Retroplay packs","year":2005,"category":"pres","kind":"archive","status":"active","arch":["68k"],"weight":4,"by":"Turran / Retroplay (EAB)","what":"The English Amiga Board community file server: the canonical Retroplay WHDLoad game and demo packs — continuing Killergorilla's earlier work — plus OS packs, TOSEC sets and magazine scans, with free registration.","why":"This is where nearly every curated collection actually gets its content. AmigaVision, HstWB, iGame and AGS2 all assume it.","url":"https://grandis.nu","related":["whdload"],"tags":["archive","games"]},{"id":"demozoo","name":"Demozoo & Pouët","year":2011,"category":"pres","kind":"archive","status":"active","arch":["68k"],"weight":4,"by":"demoscene community","what":"The demoscene's primary databases: Demozoo with 188,851 productions, 135,461 music entries, 28,930 groups and 5,532 parties, edited daily and open source, and Pouët with 102,680 productions and over a million comments.","why":"Between them they document the Amiga's most distinctive cultural output more thoroughly than any commercial catalogue documents its software.","url":"https://demozoo.org","tags":["archive","demoscene"]},{"id":"exotica","name":"ExoticA, Modland & Kestra BitWorld","year":2000,"category":"pres","kind":"archive","status":"active","arch":["68k"],"weight":3,"by":"respective communities","what":"The music and scene archives: ExoticA and UnExoticA hold Amiga game and demo music in original native formats organised by game and composer; Modland is an enormous tracker-module archive across every format, updated to August 2026; and Kestra BitWorld is the deepest Amiga-specific scene index anywhere.","why":"They preserve formats no commercial player supports, playable via UADE's emulation of the original music routines.","url":"https://www.exotica.org.uk","related":["demozoo"],"tags":["archive","music","demoscene"]},{"id":"amigapcb","name":"amigapcb.org & hardware databases","year":2015,"category":"pres","kind":"archive","status":"active","arch":["68k"],"weight":3,"by":"various","what":"Hardware-side preservation: the interactive layer-by-layer Amiga PCB Explorer for repair work, the Amiga Hardware Database (updated August 2026) documenting expansion cards with photos, autoconfig IDs and install disks, the Big Book of Amiga Hardware with 1,993 products, and AmigaWiki's schematics and service manuals.","why":"Board-level repair is only possible because someone documented the boards. These sites are why a 1992 A1200 can be traced and fixed in 2026.","url":"https://www.amigapcb.org","tags":["archive","repair"]},{"id":"archiveorg","name":"Internet Archive Amiga collections","year":2012,"category":"pres","kind":"archive","status":"active","arch":["web"],"weight":3,"by":"Internet Archive","what":"Large ADF, WHDLoad and TOSEC mirrors, complete magazine runs, and the Software Library: Amiga with titles playable directly in a browser through the Emularity loader and the Scripted Amiga Emulator.","why":"It brings Amiga software into the world's largest general-purpose archive, and makes it playable without installing anything.","url":"https://archive.org/details/softwarelibrary_amiga","related":["sae","tosec"],"tags":["archive","web"]},{"id":"eab","name":"English Amiga Board (EAB)","year":2001,"category":"comm","kind":"org","status":"active","arch":["68k"],"weight":5,"by":"abime.net","what":"The central English-language classic-Amiga forum and the hub of the preservation scene — WHDLoad development, Retroplay packs, Hall of Light and Magazine Rack coordination, hardware repair and coding — now behind anti-bot protection.","why":"If one place had to be called the home of the modern Amiga community, this is it.","url":"https://eab.abime.net","related":["whdload","hol"],"tags":["forum"]},{"id":"amiganews","name":"amiga-news.de","year":1998,"category":"comm","kind":"org","status":"active","arch":["68k","ppc","x86"],"weight":4,"by":"Petra Struck","what":"Daily Amiga news in both German and English since 1998, with a complete archive back to that year and multiple items a day in 2026.","why":"The record of note for the whole ecosystem — the closest thing the scene has to a newspaper of record, and the primary source for much of this atlas.","url":"https://www.amiga-news.de","tags":["news"]},{"id":"forums","name":"AmigaWorld, Amigans, MorphZone & a1k","year":2000,"category":"comm","kind":"org","status":"active","arch":["ppc","x86"],"weight":3,"by":"respective communities","what":"The system-specific communities: AmigaWorld.net and Amigans.net for AmigaOS 4, MorphZone (now at morph.zone) for MorphOS, AROS World for AROS, and the huge German-language a1k.org for hardware, repair and trading. Amiga.org, once among the oldest, is now effectively moribund.","why":"The next-generation branches each maintain their own centre of gravity — which is part of why the ecosystem reads as several communities rather than one.","url":"https://amigaworld.net","related":["eab"],"tags":["forum"]},{"id":"national","name":"National communities","year":2000,"category":"comm","kind":"org","status":"active","arch":["68k","ppc"],"weight":3,"by":"PPA.pl, Amiga Impact, Obligement, Amigatronics, AmigaPage","what":"Poland's PPA.pl with daily news and a marketplace, France's Amiga Impact and David Brunet's monumental Obligement magazine with thousands of articles, Spain's Amigatronics, and Italy's AmigaPage.it.","why":"Poland in particular sustains an outsized share of modern Amiga hardware and game development — the scene is far more European and multilingual than English-language sources suggest.","url":"https://www.ppa.pl","tags":["forum","news"]},{"id":"magazines","name":"Print magazines in 2026","year":1998,"category":"comm","kind":"media","status":"active","arch":["68k","ppc"],"weight":4,"by":"various publishers","what":"Amiga still has newsstand print: Amiga Future (bimonthly since 1998, separate German and English editions, issue #182 in August 2026), Amiga Addict (UK, glossy, reached its 40th issue), Passione Amiga (Italy, #32 July 2026), Komoda & Amiga Plus (Poland, #30 July 2026), Boing (France, #11 June 2026) and Fusion Retro Books' ZZAP! AMIGA revival.","why":"Six or more current print magazines for a computer discontinued in 1994 is, by itself, the strongest evidence of what this atlas describes.","url":"https://www.amigafuture.de","tags":["media","print"]},{"id":"historicmags","name":"The historic magazines","year":1986,"category":"comm","kind":"media","status":"historic","arch":["68k"],"weight":3,"by":"various","what":"The print culture that built the platform: Amiga Format (the UK giant), CU Amiga, the beloved iconoclast Amiga Power, Amiga World and Amazing Computing in the US, Germany's Amiga Joker — revived as a one-off special at Amiga40 in 2025 — The One, Amiga Action and Amiga Computing.","why":"Amiga magazine writing was unusually opinionated and literate, and its coverdisks were a distribution channel in their own right. All indexed at the Amiga Magazine Rack.","url":"https://amr.abime.net","related":["amr"],"tags":["media","print"]},{"id":"podcasts","name":"Podcasts, YouTube & streaming","year":2014,"category":"comm","kind":"media","status":"active","arch":["68k","ppc"],"weight":3,"by":"various creators","what":"Amigos Retro Gaming, The Retro Hour, 10 Minute Amiga Retro Cast, Dan Wood, GadgetUK164 for repairs, RMC – The Cave, Chris Edwards Restoration, Bill Winters' Amiga Bill Twitch show, Epsilon's Amiga Blog for next-gen systems — and Retro Recipes, whose host Christian \"Perifractic\" Simpson led the 2025 Commodore acquisition and now runs the company.","why":"Video became the platform's main outreach channel, and in at least one case the audience built there turned into ownership of the brand itself.","tags":["media","video"]},{"id":"books","name":"Documentaries & books","year":2012,"category":"comm","kind":"media","status":"active","arch":["68k"],"weight":3,"by":"various authors","what":"Jimmy Maher's The Future Was Here (MIT Press, 2012) on why the Amiga mattered technically; Brian Bagnall's Commodore: The Amiga Years (2017); David Pleasance's Commodore: The Inside Story (2018) and, with Trevor Dickinson, the three-volume From Vultures to Vampires on the post-Commodore IP saga; plus the documentaries Viva Amiga (2017), From Bedrooms to Billions: The Amiga Years (2016) and The Commodore Story (2018).","why":"The Amiga is unusually well served by serious history — including a university-press platform study, which few home computers can claim.","tags":["media","books"]},{"id":"events","name":"Amiga37 / 38 / 39 / 40","year":2022,"category":"comm","kind":"event","status":"active","arch":["68k","ppc"],"weight":4,"by":"Markus Tillmann & team","what":"The Mönchengladbach event series that became the scene's centre of gravity: Amiga37 in October 2022 drew thousands and an all-star Commodore guest list, followed by Amiga38, Amiga39, and the 40th-anniversary Amiga40 in October 2025 — where the A1200NG was shown working and APC&TCP released the Amiga Joker revival special and two new games.","why":"It demonstrated that the community could fill a venue on the scale of a real trade show, twenty-eight years after the platform died commercially.","tags":["event"]},{"id":"amiwest","name":"AmiWest","year":1996,"category":"comm","kind":"event","status":"active","arch":["ppc","68k"],"weight":3,"by":"Sacramento Amiga Computer Club","what":"North America's premier Amiga show, held annually in Sacramento with A-EON as a longstanding sponsor, and traditionally where next-generation announcements and AmigaOS betas are shown.","why":"The AmigaOS 3.3 beta was first shown publicly at AmiWest in November 2025 — the show still functions as a genuine launch venue.","version":"2026 edition: 24–25 October","url":"https://www.amiwest.net","tags":["event"]},{"id":"parties","name":"Demoparties: Revision, Gerp & others","year":2011,"category":"comm","kind":"event","status":"active","arch":["68k"],"weight":4,"by":"demoscene","what":"Where new Amiga demos actually premiere: Revision at Easter in Saarbrücken — the world's biggest pure demoparty, with dedicated Amiga competitions, 2026 edition 3–6 April — plus Sweden's Amiga-heavy Gerp in January, Assembly, Evoke, and grassroots events like AmiParty and Amiga Rave-Craze.","why":"Thirty-five years on, competitive Amiga demo programming is still a live art form with an annual calendar.","url":"https://revision-party.net","related":["demoscene"],"tags":["event","demoscene"]},{"id":"demoscene","name":"The Amiga demoscene","year":1988,"category":"comm","kind":"concept","status":"active","arch":["68k"],"weight":5,"by":"—","what":"The demoscene crystallised on the Amiga: crack intros on pirated games evolved into standalone demos, and by 1989–93 Amiga groups defined European digital youth culture — megademos, trackmos and the party circuit. Landmarks run from Enigma (Phenomena, 1991), State of the Art (Spaceballs, 1992) and Desert Dream (Kefrens, 1993) to The Black Lotus's Eon, which won Revision 2019.","why":"The custom chipset rewarded exactly the hardware mastery the scene celebrates, which is why 68k and AGA competitions are still marquee events. TBL, Loonies, Ghostown, Desire, Spaceballs and Elude remain active.","url":"https://demozoo.org","related":["a500"],"tags":["demoscene","culture"]},{"id":"trackers","name":"Trackers & the MOD format","year":1987,"category":"comm","kind":"concept","status":"active","arch":["68k","x86"],"weight":5,"by":"Karsten Obarski and successors","what":"Karsten Obarski's Ultimate Soundtracker (1987) was the original sample-based tracker, built around Paula's four 8-bit DMA channels. Its lineage — NoiseTracker, then ProTracker in 1990 — produced the MOD format, and its descendants S3M, XM and IT. Olav Sørensen's pt2-clone (v1.91, July 2026) recreates ProTracker 2.3D with Amiga filter modelling.","why":"The Amiga's biggest single cultural export: MOD escaped the platform and shaped PC demos, game audio, early rave and jungle production, and net music culture. Also preserved live by UADE, AmigaRemix and Nectarine radio.","url":"https://github.com/8bitbubsy/pt2-clone","related":["a500"],"tags":["music","culture","demoscene"]},{"id":"boingball","name":"The Boing Ball","year":1984,"category":"comm","kind":"concept","status":"active","arch":["68k"],"weight":4,"by":"Dale Luck & R.J. Mical","what":"The red-and-white checkered bouncing ball predates the Amiga's launch: coded overnight for the January 1984 winter CES on the Lorraine prototype, its rotation faked cheaply with colour-register cycling while a hardware-shaking \"boom\" thudded through the hall PA.","why":"Commodore replaced it with the rainbow checkmark as official branding, which is precisely why the community adopted the Boing Ball as the *real* symbol. It has appeared on AmigaOS \"Boing Bags\", AmigaOne branding, magazines and event logos ever since — and the Boing Ball mark is explicitly among the trademarks consolidated under Amiga Corporation in the 2026 settlement.","related":["lorraine"],"tags":["culture","icon"]},{"id":"newgames","name":"The new games scene 2015–2026","year":2016,"category":"soft","kind":"app","status":"active","arch":["68k"],"weight":5,"by":"many developers & labels","what":"A genuine commercial and freeware revival: Richard Löwenstein's RESHOOT trilogy, Tower 57, Worthy, Inviyya, Black Dawn Rebirth, Creeping Me Out, Roguecraft and Roguecraft DX, Turbo Sprint, Tenebra, an assembly-accurate OutRun port, the long-awaited Metro Siege, and GRIND on dread technology — published in boxes by Bitmap Soft, poly.play, Thalamus Digital and RETREAM, with recurring AmiGameJam events feeding the pipeline.","why":"New Amiga games are now released more often than in the platform's final commercial years — and several are genuinely excellent rather than merely nostalgic.","version":"~594 games on the itch.io Amiga tag","url":"https://itch.io/games/tag-amiga","related":["scorpion","redpill"],"tags":["games"]},{"id":"ports","name":"Modern ports & conversions","year":2020,"category":"soft","kind":"app","status":"active","arch":["68k","ppc"],"weight":3,"by":"various","what":"What fast modern hardware unlocked: Frank Wille's AmiQuake and AmiQuake2 (RTG v3.03, August 2026), Steffen Häuser's Heretic II for PiStorm-class machines (2024), Quake 2 on AmigaOS 4 via GL4ES, maintained ScummVM builds for 68k, AmigaOS 4 and MorphOS, ClassiCube on OS4, plus AGA fan conversions like Turrican II AGA and Castlevania AGA.","why":"PiStorm, Vampire and next-generation hardware did not just make old software faster — they made a category of software possible that the platform never had.","related":["pistorm","warp3dnova"],"tags":["games","ports"]},{"id":"taws","name":"TAWS — Amiga Workbench Simulation","year":2010,"category":"soft","kind":"app","status":"active","arch":["web"],"weight":2,"by":"Michael Rupp","what":"A browser-based simulation of Workbench 1.x through 3.x in JavaScript, continuously updated.","why":"The easiest possible way to show someone what a Workbench actually is — no ROMs, no emulator, no install.","url":"https://www.taws.ch","related":["workbench"],"tags":["web"]},{"id":"ppaint","name":"Personal Paint, IGNITION & productivity","year":1994,"category":"soft","kind":"app","status":"active","arch":["68k","ppc","arm"],"weight":2,"by":"Cloanto, A-EON, community","what":"Classic productivity, still moving: Personal Paint now licensed by A-EON with an ARM-accelerated 7.4 shipping on the A600GS (7.1 remains free on Aminet), the open-sourced IGNITION spreadsheet at v1.30 for AmigaOS 4, MediaVault for OS4 streaming, and SketchBlock for painting.","why":"A reminder that the Amiga was a work machine — DTP, painting, spreadsheets, video — and that some of that software is still being developed.","related":["a600gs"],"tags":["productivity"]},{"id":"cbm-bankrupt","name":"Commodore bankruptcy","year":1994,"category":"brand","kind":"event","status":"historic","arch":["other"],"weight":5,"by":"Commodore International Ltd","what":"Commodore International declares bankruptcy and enters liquidation. Amiga production stops; the liquidation drags on for a year.","why":"The event that created everything else in this atlas. From this point the platform has no manufacturer — only stewards, licensees and volunteers.","version":"29 April 1994","related":["a4000t"],"tags":["ownership"]},{"id":"escom","name":"Escom / Amiga Technologies","year":1995,"category":"brand","kind":"event","status":"historic","arch":["other"],"weight":3,"by":"Escom AG (DE)","what":"German PC maker Escom wins the auction for roughly US$10–14 million, beating Dell, and forms Amiga Technologies GmbH under Petro Tyschtschenko, restarting A1200 and A4000T production. Escom itself goes bankrupt in July 1996; QuikPak builds remaining A4000Ts and a sale to VIScorp collapses.","why":"The first and last time anyone tried to simply resume being Commodore.","related":["cbm-bankrupt"],"tags":["ownership"]},{"id":"gateway","name":"Gateway 2000 acquisition","year":1997,"category":"brand","kind":"event","status":"historic","arch":["other"],"weight":3,"by":"Gateway 2000 (US)","what":"Gateway buys the Commodore and Amiga assets out of the Escom bankruptcy for around US$13 million, mainly for the patent portfolio. Amiga International licenses the classic hardware; Gateway's 1999 next-generation projects under Jim Collas are cancelled.","why":"The moment the Amiga became primarily a patent asset rather than a product line.","related":["escom"],"tags":["ownership"]},{"id":"amigainc","name":"Amiga, Inc. (McEwen)","year":2000,"category":"brand","kind":"event","status":"historic","arch":["other"],"weight":3,"by":"Amino Development → Amiga, Inc.","what":"Gateway sells the Amiga name, trademarks, OS and remaining IP — patents excluded and licensed back — to Bill McEwen and Fleecy Moss's Amino Development Corp, renamed Amiga, Inc. (Washington). Its strategy centres on AmigaDE rather than AmigaOS.","why":"The brand and the technology begin to diverge: the company holding the name spends the decade pointing it away from Amiga hardware.","related":["gateway","amigade"],"tags":["ownership"]},{"id":"hyperion-contract","name":"Hyperion contracted for AmigaOS 4","year":2001,"category":"brand","kind":"event","status":"historic","arch":["ppc"],"weight":4,"by":"Amiga, Inc. / Hyperion Entertainment","what":"Amiga Inc. contracts Hyperion Entertainment of Belgium — founded in 1999 by Ben Hermans and Evert Carton — to develop AmigaOS 4 for PowerPC AmigaOne boards.","why":"The contract that produced a real, shipping, official AmigaOS — and, eight years later, the lawsuit that defined who owns what.","related":["amigainc"],"tags":["ownership","os4"]},{"id":"kmos","name":"KMOS / Amiga, Inc. (Delaware)","year":2005,"category":"brand","kind":"event","status":"historic","arch":["other"],"weight":2,"by":"KMOS, Inc.","what":"Amid financial trouble, Amiga Inc.'s OS-related assets pass to KMOS, Inc., which renames itself Amiga, Inc. (Delaware) in 2005.","why":"The Washington/Delaware duality created years of genuine legal confusion about which entity held which rights.","related":["amigainc"],"tags":["ownership"]},{"id":"settlement2009","name":"2009 Amiga Inc. v. Hyperion settlement","year":2009,"category":"brand","kind":"event","status":"historic","arch":["ppc"],"weight":5,"by":"court settlement, Seattle","what":"Settling litigation begun in 2007, Hyperion receives an exclusive, perpetual, royalty-free worldwide licence to AmigaOS 3.1 to develop and market \"AmigaOS 4 and subsequent versions\" under the AmigaOS name, while Amiga Inc. retains the trademarks.","why":"The legal backbone of everything that followed — including Hyperion's later right to ship AmigaOS 3.1.4 and 3.2 for classic machines.","version":"30 September 2009","related":["hyperion-contract"],"tags":["ownership","legal"]},{"id":"aeon","name":"A-EON Technology & AmigaKit","year":2009,"category":"brand","kind":"event","status":"active","arch":["ppc"],"weight":4,"by":"Trevor Dickinson & Matthew Leaman","what":"A-EON Technology is founded, with AmigaKit as its retail and manufacturing arm, becoming the patron of AmigaOS 4 hardware: the X1000 (2012), X5000 (2016) and A1222 Plus, plus the Enhancer Software stack and the AmiSphere platform.","why":"For fifteen years, essentially all new AmigaOS 4 hardware has existed because of private patronage rather than a market.","url":"https://www.a-eon.com","related":["settlement2009"],"tags":["ownership","os4"]},{"id":"cloanto","name":"Cloanto acquires the OS copyrights","year":2018,"category":"brand","kind":"event","status":"active","arch":["other"],"weight":4,"by":"Cloanto / Mike Battilana","what":"Cloanto — long the publisher of Amiga Forever — acquires Amiga Inc.'s Commodore and Amiga OS copyrights covering AmigaOS 3.1 and earlier. In 2019 Battilana's C-A Acquisition Corp buys the remaining Amiga, Inc. assets including the trademarks and becomes Amiga Corporation.","why":"For the first time since 1994, the historic copyrights and the trademarks are consolidated under one owner who actually licenses them.","url":"https://www.amigaforever.com","related":["amigainc","amigaforever"],"tags":["ownership"]},{"id":"litigation","name":"The Hyperion litigation era","year":2018,"category":"brand","kind":"event","status":"historic","arch":["other"],"weight":4,"by":"Hyperion / the Amiga parties","what":"Relations rupture as Hyperion ships AmigaOS 3.1.4 and then 3.2 for classic machines. Litigation runs in the US and Belgium from 2018, with partial settlements reported around 2021–22, alongside a separate long-running dispute with A-EON and AmigaKit over the Enhancer Software's duplicated components and the ExecSG kernel.","why":"It froze parts of the ecosystem for years — Retro Games Ltd publicly blamed the litigation for delaying THEA1200 past 2025.","related":["cloanto","settlement2009"],"tags":["ownership","legal"],"unverified":true},{"id":"hyperion2024","name":"Hyperion under new ownership","year":2024,"category":"brand","kind":"event","status":"active","arch":["ppc"],"weight":3,"by":"Hyperion Entertainment BV","what":"After the bankruptcy of Ben Hermans BV, Hyperion's largest shareholder, a court-supervised shareholders' meeting annuls that shareholding and appoints Timothy De Groote as director. (Hyperion itself was never bankrupt — only the shareholder vehicle. Widely circulated claims about Ben Hermans' personal circumstances could not be verified and should not be repeated.)","why":"The reset that restarted official development: AmigaOS 3.2.3 in April 2025, 4.1 FE Update 3 in October 2025, digital 3.2 in March 2026 and a new SDK in June 2026.","url":"https://www.hyperion-entertainment.com","related":["litigation"],"tags":["ownership"],"unverified":true},{"id":"commodore2025","name":"Commodore returns","year":2025,"category":"brand","kind":"event","status":"active","arch":["other"],"weight":5,"by":"Commodore International Corporation","what":"A group of angel investors fronted by YouTuber Christian \"Perifractic\" Simpson acquires Commodore Corporation B.V. — holder of the remaining Commodore trademarks — for a low seven-figure sum; Simpson becomes CEO. First product: the FPGA-based Commodore 64 Ultimate from $299.99, built on Gideon Zweijtzer's Ultimate-64 technology, with first deliveries at Christmas 2025.","why":"Crucially, the deal includes **no Amiga rights**. Commodore and Amiga are now separately owned, and the two are frequently confused — the single most common misunderstanding in the current landscape.","version":"28 June 2025","url":"https://www.commodore.net","tags":["ownership","commodore"]},{"id":"settlement2026","name":"The 2026 settlement","year":2026,"category":"brand","kind":"event","status":"active","arch":["other"],"weight":5,"by":"Amiga Corporation & Hyperion","what":"All litigation ends. Hyperion acknowledges Amiga Corporation's ownership of the trademarks, with over twenty registrations transferring; AmigaOS 4 remains Hyperion's property with a fresh OS 3.1 source licence, exclusive rights to the AmigaOne brand, and freedom to port AmigaOS 4 to **any CPU architecture except 68k**. Hyperion's licence to sell AmigaOS 3.2/3.3 for 68k expires 31 December 2027, after which it hands the sources to Amiga Corporation and exits the classic market. Hyperion states it will complete AmigaOS 3.3 and 4.2.","why":"The most consequential development in decades: it ends the legal paralysis, frees AmigaOS 4 from PowerPC, and schedules the transfer of 68k stewardship. The same-day agreement also formalises the Commodore relationship and names Retro Games Ltd and Blaze Entertainment as licensees.","version":"4 August 2026","url":"https://www.amiga.com","related":["litigation","commodore2025","cloanto"],"tags":["ownership","legal"]},{"id":"whoowns","name":"Who owns what, August 2026","year":2026,"category":"brand","kind":"concept","status":"active","arch":["other"],"weight":4,"by":"—","what":"Amiga trademarks (Amiga, AmigaOS, Kickstart, Workbench, Boing Ball) and the historic Commodore and Amiga software copyrights: **Amiga Corporation** (Mike Battilana). AmigaOS 4.x, and 3.2/3.3 until end-2027, plus the AmigaOne brand: **Hyperion Entertainment**. 68k AmigaOS after 2027: **Amiga Corporation**. The Commodore and C= marks: **Commodore International Corporation** — with no Amiga rights. MorphOS: the independent **MorphOS Team**. AROS: open source. The 1997-era hardware patents have expired.","why":"Technical lineage and corporate ownership are two different maps. Nearly every \"wait, who makes the Amiga now?\" confusion comes from conflating them.","related":["settlement2026"],"tags":["ownership","reference"]}]};

(function(){

ALL.forEach(function(e){

/* Facets and search narrow by DIMMING what does not match; the map needs this

   it as well -- it has its own caption wording for that state. */
function dimmingCount(){
  var n = 0;
  Object.keys(S.f).forEach(function(k){ n += Object.keys(S.f[k]).length; });
  return n + (S.q ? 1 : 0);
}
/* Everything the Reset button clears, Essentials included. */
function activeCount(){ return dimmingCount() + (S.ess ? 1 : 0); }
function facetOn(dim){ return Object.keys(S.f[dim]); }

/* one predicate per dimension so facet counts can exclude their own dimension */
function testDim(e, dim){
  var on = facetOn(dim);
  if(!on.length) return true;
  if(dim === 'arch') return (e.arch||[]).some(function(a){ return S.f.arch[a]; });
  if(dim === 'st')   return !!S.f.st[e.st];
  if(dim === 'era')  return !!S.f.era[e.era];
  if(dim === 'cat')  return !!S.f.cat[e.cat];
  if(dim === 'kind') return !!S.f.kind[e.kind];
  return true;
}
function testQ(e){
  if(!S.q) return true;
  var terms = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  return terms.every(function(t){ return e._s.includes(t); });
}
var DIMS = ['arch','st','era','cat','kind'];
function matches(e, skipDim){
  if(S.ess && (e.wt || 0) < 5) return false;
  if(!testQ(e)) return false;
  for(var i=0;i<DIMS.length;i++){

    if(!testDim(e, DIMS[i])) return false;

function results(){ return ALL.filter(function(e){ return matches(e); }); }

    var vals = (dim === 'arch') ? (e.arch||[]) : [e[key||dim]];

  });
  return out;
}

var PICT_BY_CAT = {

function pictFor(e){

function pad2(n){ return (n < 10 ? '0' : '') + n; }

(function(){

     });
})();

   checkmarks offset by 51.5 units, each arm at 32 degrees from vertical, cut
   flat at the top and bottom. The spectrum runs along the PATH — purple at
   the short arm's tip, mint at the vertex, red at the long arm's tip — so
   each arm carries its own gradient, both in user space, which is what makes
   the second tick read a step further round the spectrum than the first.
   Hand-authored, so it needs no asset and survives with no network. */
var MARK_GEO = [
  {s:'M0.0 182.0 65.1 286.0 87.3 286.0 87.3 259.3 39.0 182.0Z',
   l:'M87.3 259.3 87.3 286.0 109.6 286.0 288.5 0.0 249.5 0.0Z'},
  {s:'M51.5 182.0 116.6 286.0 138.8 286.0 138.8 259.3 90.5 182.0Z',
   l:'M138.8 259.3 138.8 286.0 161.1 286.0 340.0 0.0 301.0 0.0Z'}
];
var MARK_LONG = [[0,'#62D2B4'],[.02,'#6FD4AA'],[.10,'#8BD58A'],[.18,'#A8D56E'],
  [.26,'#C8D551'],[.34,'#E7D535'],[.42,'#FBC725'],[.50,'#F8A229'],[.58,'#F37E2F'],
  [.66,'#F15932'],[.74,'#E93C36'],[.82,'#D22D3D'],[1,'#BF1E46']];
var MARK_SHORT = [[0,'#663AB4'],[.092,'#623CB6'],[.181,'#5E41B8'],[.267,'#554CC1'],
  [.356,'#4858C9'],[.442,'#3E64CF'],[.531,'#3672D4'],[.65,'#3D9BC6'],[.767,'#68BD9E'],
  [1,'#79CCAC']];
function markStops(list, id){
  return '<linearGradient id="'+id+'" gradientUnits="userSpaceOnUse" ' +
    (id.includes('-l') ? 'x1="-92" y1="147.1" x2="95.6" y2="-152.9"'
                           : 'x1="81.8" y1="130.8" x2="167.6" y2="268"') + '>' +
    list.map(function(st){ return '<stop offset="'+st[0]+'" stop-color="'+st[1]+'"/>'; }).join('') +
    '</linearGradient>';
}
function rainbowMark(h, id){
  id = id || 'rb';
  return '<svg class="rbmark" viewBox="0 0 340 286" height="'+h+'" role="img" '+
    'aria-label="Amiga" preserveAspectRatio="xMidYMid meet">'+
    '<defs>'+markStops(MARK_SHORT, id+'-s')+markStops(MARK_LONG, id+'-l')+'</defs>'+
    MARK_GEO.map(function(g){
      return '<path d="'+g.s+'" fill="url(#'+id+'-s)"/>'+
             '<path d="'+g.l+'" fill="url(#'+id+'-l)"/>';
    }).join('')+
    '</svg>';
}

/* ------------------------------------------------------- pixel wordmark
   A 5x7 bitmap face, drawn as SVG rects. Hand-authored so the Amiga
   character survives with no webfont and no network. */
var GLYPHS = {
  A:['01110','10001','10001','11111','10001','10001','10001'],
  M:['10001','11011','10101','10101','10001','10001','10001'],
  I:['11111','00100','00100','00100','00100','00100','11111'],
  G:['01110','10001','10000','10111','10001','10001','01111'],
  C:['01110','10001','10000','10000','10000','10001','01110'],
  O:['01110','10001','10001','10001','10001','10001','01110'],
  N:['10001','11001','10101','10011','10001','10001','10001'],
  S:['01111','10000','10000','01110','00001','00001','11110'],
  T:['11111','00100','00100','00100','00100','00100','00100'],
  E:['11111','10000','10000','11110','10000','10000','11111'],
  L:['10000','10000','10000','10000','10000','10000','11111'],
  ' ':['00000','00000','00000','00000','00000','00000','00000']
};
function wordmark(text, px){
  var W = 0, parts = [], x = 0;
  for(var i=0;i<text.length;i++){
    var g = GLYPHS[text[i]]; if(!g) continue;
    for(var r=0;r<7;r++) for(var c=0;c<5;c++){
      if(g[r][c]==='1') parts.push('<rect x="'+(x+c)+'" y="'+r+'" width="1" height="1"/>');
    }
    x += 6;
  }
  W = x - 1;
  return '<svg id="wordmark" viewBox="0 0 '+W+' 7" width="'+(W*px)+'" height="'+(7*px)+
         '" role="img" aria-label="'+text+'" shape-rendering="crispEdges" fill="currentColor">'+
         parts.join('')+'</svg>';
}

/* ---------------------------------------------------------------- rail */
function facet(title, dim, items, key, help){
  var d = el('details','facet'); d.open = true;
  var sum = document.createElement('summary');
  sum.innerHTML = ICON.chev + '<span>' + title + '</span>' +
                  '<span class="on" data-on-for="'+dim+'" hidden>0</span>';
  d.appendChild(sum);
  var body = el('div','facetbody');
  if(help){ body.appendChild(el('div','facethelp', help)); }
  items.forEach(function(it){
    if(it.groupLabel){ body.appendChild(el('div','grouplbl', it.groupLabel)); return; }
    var b = el('button','opt');
    b.type = 'button';
    b.setAttribute('data-dim', dim);
    b.setAttribute('data-val', it.id);
    b.setAttribute('aria-pressed','false');
    if(it.title) b.title = it.title;
    var box = el('span','box'); box.innerHTML = ICON.check; b.appendChild(box);
    if(it.swatch){ var sw = el('span','swatch'); sw.style.background = it.swatch; b.appendChild(sw); }
    if(it.dot){ var dt = el('span','dot'); dt.style.background = it.dot; b.appendChild(dt); }
    b.appendChild(el('span','lbl', it.label));
    b.appendChild(el('span','n','0'));
    body.appendChild(b);
  });
  d.appendChild(body);
  return d;
}

function buildRail(){
  var rail = $('#rail');
  rail.innerHTML = '';
  var head = el('div','railhead');
  var cw = el('div','count');
  cw.innerHTML = '<b id="rescount">0</b> of ' + ALL.length;
  head.appendChild(cw);
  var reset = el('button', null, 'Reset'); reset.id = 'resetall'; reset.type = 'button'; reset.hidden = true;
  head.appendChild(reset);
  rail.appendChild(head);

  rail.appendChild(facet('Architecture','arch', M.archs.map(function(a){
    return {id:a.id, label:a.label, title:a.note};
  }), null, 'Which processor or platform the item runs on — hardware and software alike.'));

  rail.appendChild(facet('Development status','st', M.statuses.map(function(s){
    return {id:s.id, label:s.label, title:s.note,
            dot:'var(--'+(s.tone==='good'?'ok':s.tone==='warn'?'warn':s.tone==='info'?'info':'off')+')'};
  })));

  rail.appendChild(facet('Era','era', M.eras.map(function(e,i){
    return {id:e.id, label:e.label+'  ·  '+e.range, title:e.note, swatch:'var(--e'+(i+1)+')'};
  })));

  var catItems = [];
  M.groups.forEach(function(g){
    catItems.push({groupLabel:g.label});
    g.cats.forEach(function(c){ catItems.push({id:c.id, label:c.label}); });
  });
  rail.appendChild(facet('Category','cat', catItems));

  rail.appendChild(facet('Kind','kind', M.kinds.map(function(k){
    return {id:k.id, label:k.label, title:k.note};
  }), null, 'The distinction that prevents most Amiga confusion: an original machine, a replica, an FPGA recreation, an emulator and a curated environment are five different things.'));

  rail.addEventListener('click', function(ev){
    var b = ev.target.closest('.opt'); if(!b) return;
    var dim = b.getAttribute('data-dim'), val = b.getAttribute('data-val');
    if(S.f[dim][val]) delete S.f[dim][val]; else S.f[dim][val] = 1;
    if(S.view === 'overview') setView('catalog'); else render();
  });
  reset.addEventListener('click', resetAll);
}

function resetAll(){
  DIMS.forEach(function(d){ S.f[d] = {}; });
  S.q = ''; $('#search').value = '';
  S.ess = false;
  render();
}

/* How many entries the weight-5 landmark filter keeps. */
var ESS_N = ALL.filter(function(e){ return (e.wt || 0) >= 5; }).length;

/* One notion of "essentials", shared by the catalogue and the lineage map:
   the catalogue drops its non-landmark plates, the map re-forms its clusters
   from what is left, and the rail count and chips report it like any other
   filter. Both toggles read and write this single flag, so the two views can
   never disagree about what is showing. */
function setEss(on){
  if(S.ess === on) return;
  S.ess = on;
  if(GRAPH.tour) tourEnd();
  if(on && S.sel && (BY_ID[S.sel].wt || 0) < 5) closeDetail();
  if(S.view === 'graph') graphRemap();
  render();
}

/* both Essentials toggles reflect the one flag */
function syncEss(){
  ['#gess','#cess'].forEach(function(sel){
    var b = $(sel);
    if(b) b.setAttribute('aria-pressed', S.ess ? 'true' : 'false');
  });
}

function syncRail(){
  var counts = {
    arch: facetCounts('arch'), st: facetCounts('st'),
    era: facetCounts('era'), cat: facetCounts('cat'), kind: facetCounts('kind')
  };
  Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){
    var dim = b.getAttribute('data-dim'), val = b.getAttribute('data-val');
    var on = !!S.f[dim][val], n = counts[dim][val] || 0;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.querySelector('.n').textContent = n;
    b.setAttribute('data-zero', (!on && n === 0) ? '1' : '0');
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-on-for]'), function(s){
    var dim = s.getAttribute('data-on-for');
    var n = facetOn(dim).length;
    s.textContent = n; s.hidden = n === 0;
    /* mark the whole facet so its heading picks up the accent when it is
       narrowing the results — visible even with the facet collapsed */
    var f = s.closest ? s.closest('.facet') : null;
    if(f) f.setAttribute('data-on', n ? '1' : '0');
  });
  syncEss();
  var r = results();
  $('#rescount').textContent = r.length;
  $('#resetall').hidden = activeCount() === 0;
  $('#searchclear').hidden = !S.q;
  return r;
}

/* ---------------------------------------------------------------- chips */
function buildChips(){
  var c = $('#chips'); c.innerHTML = '';
  function add(label, val, onClear){
    var ch = el('span','chip');
    ch.innerHTML = '<span>'+label+' <b>'+val+'</b></span>';
    var x = el('button', null, '×'); x.type='button';
    x.setAttribute('aria-label','Remove filter '+val);
    x.addEventListener('click', onClear);
    ch.appendChild(x); c.appendChild(ch);
  }
  if(S.q) add('Search', '“'+S.q+'”', function(){ S.q=''; $('#search').value=''; render(); });
  if(S.ess) add('Only', 'Essentials', function(){ setEss(false); });
  var maps = {arch:ARCH_LABEL, st:ST_LABEL, cat:CAT_LABEL, kind:KIND_LABEL};
  DIMS.forEach(function(dim){
    facetOn(dim).forEach(function(v){
      var lbl = dim==='era' ? (ERA_OF[v]?ERA_OF[v].label:v) : (maps[dim][v] || v);
      var name = {arch:'Arch',st:'Status',era:'Era',cat:'Category',kind:'Kind'}[dim];
      add(name, lbl, function(){ delete S.f[dim][v]; render(); });
    });
  });
}

/* ---------------------------------------------------------------- cards */
function statusEl(e){
  var s = el('span','st'); s.setAttribute('data-tone', ST_TONE[e.st] || 'off');
  s.innerHTML = '<i></i>' + (ST_LABEL[e.st] || e.st);
  return s;
}
function card(e){
  var b = el('button','card'); b.type = 'button';
  b.setAttribute('data-id', e.id);
  b.style.setProperty('--era', eraColor(e.era));
  b.style.setProperty('--era-t', eraTint(e.era));
  if(S.sel === e.id) b.setAttribute('aria-current','true');

  b.appendChild(plateEl(e));

  var body = el('div','cardbody');
  var line = el('div','cardline');
  line.appendChild(el('h3', null, e.n));
  line.appendChild(el('span','yr', String(e.y)));
  body.appendChild(line);

  /* one era-coloured spec line, the way a museum label runs
     maker · status · architecture under the object's name */
  var spec = [e.by]
    .concat((e.arch||[]).slice(0,2).map(function(a){ return ARCH_LABEL[a]||a; }))
    .filter(Boolean).join(' · ');
  body.appendChild(el('div','cardspec', spec));
  body.appendChild(el('p', null, e.d));

  var foot = el('div','cardfoot');
  foot.appendChild(statusEl(e));
  if(e.u) foot.appendChild(el('span','haslink','Has official page'));
  if(e.unv){ var u = el('span','unv','?'); u.title = 'Some details unverified'; foot.appendChild(u); }
  body.appendChild(foot);

  b.appendChild(body);
  return b;
}

function renderCatalog(list){
  var host = $('#cat-scroll');
  host.innerHTML = '';
  buildChips();

  if(!list.length){
    var em = el('div','empty');
    em.innerHTML = '<h2>Nothing matches those filters</h2>'+
      '<p>Try removing a filter — combinations like <em>PowerPC</em> plus <em>Origins</em> have no entries by definition.</p>';
    var btn = el('button','btn','Reset filters'); btn.type='button';
    btn.addEventListener('click', resetAll);
    em.appendChild(btn); host.appendChild(em);
    return;
  }

  var sorted = list.slice();
  if(S.sort === 'year')       sorted.sort(function(a,b){ return a.y - b.y || a.n.localeCompare(b.n); });
  if(S.sort === 'year-desc')  sorted.sort(function(a,b){ return b.y - a.y || a.n.localeCompare(b.n); });
  if(S.sort === 'name')       sorted.sort(function(a,b){ return a.n.localeCompare(b.n); });
  if(S.sort === 'weight')     sorted.sort(function(a,b){ return (b.wt||0)-(a.wt||0) || a.y-b.y; });

  var buckets = {};
  sorted.forEach(function(e){ (buckets[e.cat] = buckets[e.cat] || []).push(e); });
  var filtering = activeCount() > 0;
  /* A filter used to force every section open, which meant the chevrons did
     nothing while filtering. Now the filter only changes the DEFAULT: when it
     changes, explicit choices are dropped so results are visible, and after
     that a click on any section is honoured either way. */
  var sig = JSON.stringify([S.f, S.q]);
  if(sig !== S.filterSig){
    S.filterSig = sig;
    S.open.c = {}; S.open.g = {};
    S.openedFirst = filtering ? 1 : 0;
  }
  if(!S.openedFirst){
    /* open the first section that has anything in it, so the catalogue never
       greets you as a wall of shut drawers */
    S.openedFirst = 1;
    for(var gi = 0; gi < M.groups.length; gi++){
      var fc = M.groups[gi].cats.filter(function(c){ return (buckets[c.id]||[]).length; })[0];
      if(fc){ S.open.c[fc.id] = 1; break; }
    }
  }

  M.groups.forEach(function(g){
    var gItems = 0;
    g.cats.forEach(function(c){ gItems += (buckets[c.id]||[]).length; });
    if(!gItems) return;

    /* groups default open; categories default open only while filtering */
    var gOpen = Object.prototype.hasOwnProperty.call(S.open.g, g.id)
      ? !!S.open.g[g.id] : true;
    var gh = el('button','grouphead'); gh.type = 'button';
    gh.setAttribute('aria-expanded', gOpen ? 'true' : 'false');
    gh.innerHTML = ICON.chev;
    gh.appendChild(el('h2', null, g.label));
    gh.appendChild(el('span','n', gItems + (gItems===1?' entry':' entries')));
    gh.addEventListener('click', function(){
      S.open.g[g.id] = !gOpen;
      renderCatalog(results());
    });
    host.appendChild(gh);
    if(!gOpen) return;

    g.cats.forEach(function(c){
      var items = buckets[c.id]; if(!items || !items.length) return;
      var cOpen = Object.prototype.hasOwnProperty.call(S.open.c, c.id)
        ? !!S.open.c[c.id] : filtering;
      var ch = el('button','cathead'); ch.type = 'button';
      ch.setAttribute('aria-expanded', cOpen ? 'true' : 'false');
      ch.innerHTML = ICON.chev;
      ch.appendChild(el('h3', null, c.label));
      ch.appendChild(el('span','n', String(items.length)));
      if(!cOpen){
        var tops = items.slice().sort(function(a,b){ return (b.wt||0)-(a.wt||0); })
                        .slice(0,3).map(function(e){ return e.n; }).join(' · ');
        ch.appendChild(el('span','preview', tops + (items.length > 3 ? ' …' : '')));
      }
      ch.addEventListener('click', function(){
        S.open.c[c.id] = !cOpen;
        renderCatalog(results());
      });
      host.appendChild(ch);
      if(cOpen){
        var grid = el('div','grid');
        items.forEach(function(e){ grid.appendChild(card(e)); });
        host.appendChild(grid);
      }
    });
  });
}
