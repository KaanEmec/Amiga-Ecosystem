o branches."},{"id":"e3","label":"Reinvention","range":"2005–2014","from":2005,"to":2014,"note":"FPGA recreation, PowerPC maturity and emulation as infrastructure."},{"id":"e4","label":"Living scene","range":"2015–2026","from":2015,"to":2026,"note":"Hybrid accelerators, new machines, curated distributions, new games."}],"architectures":[{"id":"68k","label":"68k","note":"Motorola 680x0 — the original architecture"},{"id":"ppc","label":"PowerPC","note":"AmigaOS 4 and MorphOS hardware"},{"id":"x86","label":"x86","note":"PC hosts: emulation, AROS, hosted systems"},{"id":"arm","label":"ARM","note":"Raspberry Pi, hybrid accelerators, appliances"},{"id":"fpga","label":"FPGA","note":"Recreated or extended hardware in programmable logic"},{"id":"riscv","label":"RISC-V","note":"Newest AROS and Amiberry targets"},{"id":"web","label":"Web","note":"Browser and WebAssembly implementations"},{"id":"other","label":"Other","note":"PA-RISC, VM-based, or not CPU-specific"}],"statuses":[{"id":"shipping","label":"Shipping","tone":"good","note":"Orderable or available from a current vendor page"},{"id":"active","label":"Active","tone":"good","note":"Software, firmware or documentation still receiving work"},{"id":"limited","label":"Limited","tone":"warn","note":"Irregular availability, volunteer-maintained or small runs"},{"id":"planned","label":"Announced","tone":"info","note":"Announced for future release as of August 2026"},{"id":"prototype","label":"Prototype","tone":"info","note":"Demonstrated or designed, never a normal product"},{"id":"historic","label":"Historic","tone":"off","note":"No longer current, though often still widely used"}],"kinds":[{"id":"original","label":"Original hardware","note":"Uses Commodore-era custom chips and processors"},{"id":"replica","label":"Replica board","note":"Recreates an original design; may still need original chips"},{"id":"fpga","label":"FPGA recreation","note":"Chipset or CPU behaviour in programmable logic"},{"id":"appliance","label":"Appliance","note":"A physical device sold to provide an Amiga experience"},{"id":"compatible","label":"AmigaOS-compatible","note":"Runs the OS or its APIs without original chipset behaviour"},{"id":"component","label":"Component","note":"An expansion, upgrade, driver or subsystem"},{"id":"os","label":"Operating system","note":"An Amiga OS in the official lineage"},{"id":"amigalike","label":"Amiga-like OS","note":"Preserves the programming model without being the same branch"},{"id":"oslike","label":"OS-like environment","note":"A curated system built from OS, emulator and software — not an OS itself"},{"id":"emulator","label":"Emulator","note":"Models the Amiga on a host processor"},{"id":"shell","label":"Shell or desktop","note":"Workbench, console and desktop replacements"},{"id":"toolkit","label":"Toolkit or theme","note":"GUI frameworks, icon systems, system patches"},{"id":"launcher","label":"Launcher","note":"Game and demo front ends"},{"id":"tool","label":"Developer tool","note":"Compilers, assemblers, engines, build tooling"},{"id":"app","label":"Application","note":"Browsers, games, productivity software"},{"id":"archive","label":"Archive or database","note":"Repositories, catalogues, scanned media"},{"id":"org","label":"Community","note":"Forums, news outlets, organisations"},{"id":"media","label":"Media","note":"Magazines, video, books, documentaries"},{"id":"event","label":"Event","note":"Shows, meetups and demoparties"},{"id":"concept","label":"Concept","note":"A standard, practice or idea rather than a product"},{"id":"prototype","label":"Prototype","note":"Never reached production"},{"id":"other","label":"Other","note":""}],"groups":[{"id":"g-hw","label":"Hardware","cats":[{"id":"hw-classic","label":"Classic models"},{"id":"hw-ng","label":"Next-gen machines"},{"id":"hw-fpga","label":"FPGA, replicas & appliances"},{"id":"hw-accel","label":"Accelerators"},{"id":"hw-gfx","label":"Graphics & video"},{"id":"hw-audio","label":"Audio"},{"id":"hw-storage","label":"Storage"},{"id":"hw-io","label":"Networking & I/O"},{"id":"hw-repair","label":"Repair, cases & power"}]},{"id":"g-sys","label":"Systems & interfaces","cats":[{"id":"os","label":"Operating systems"},{"id":"shell","label":"Shells & desktops"},{"id":"distro","label":"Distributions"},{"id":"tech","label":"System technologies"}]},{"id":"g-emu","label":"Emulation","cats":[{"id":"emu","label":"Emulators"}]},{"id":"g-scene","label":"Preservation & scene","cats":[{"id":"pres","label":"Preservation & archives"},{"id":"comm","label":"Community & media"},{"id":"brand","label":"Ownership & brand"}]},{"id":"g-make","label":"Creation","cats":[{"id":"dev","label":"Developer tooling"},{"id":"soft","label":"Software & games"}]}],"theses":[{"title":"The original machines became platforms, not products","body":"The A2000, A3000 and A4000 were designed around internal expansion; the A500, A600 and A1200 grew sidecar, CPU-socket and trapdoor ecosystems. That openness let later generations replace nearly every subsystem — processor, graphics, storage, video output, networking, USB, even parts of the chipset model."},{"title":"The future split rather than ending","body":"No single successor inherited everything. AmigaOS 4 preserved the official API lineage on PowerPC; MorphOS built a separate system and colonised used Apple hardware; AROS pursued open re-implementation across architectures; FPGA and replica projects preserved hardware behaviour; emulators preserved access. The branches compete — and together they explain the longevity."},{"title":"Emulation became infrastructure","body":"UAE did not stay one application. Its descendants are desktop emulators, Raspberry Pi engines, libretro cores, netplay systems, commercial preservation packages — and the hidden foundation of retail devices. Amiberry and WinUAE-derived code now sits underneath environments whose users never perceive an emulator at all."},{"title":"FPGA changed the meaning of compatibility","body":"Minimig began as an open A500 recreation; MiST, MiSTer, Analogue Pocket and FPGA Arcade extended it toward AGA. Apollo’s 68080 and SAGA take the revisionist path instead — adding instructions, graphics capability and whole system designs while keeping a 68k software world. \"Compatible\" now spans faithful recreation through deliberate extension."},{"title":"Curation matters as much as accuracy","body":"A bare emulator plus a ROM is not an approachable system. Amiga Forever solves legality and configuration; AmiKit, ClassicWB and BetterWB curate desktops; Icaros packaged AROS; Pimiga and Amibian make Pi appliances; AmigaVision targets repeatable preservation across real hardware, FPGA and emulators. These projects preserve workflows and context, not only instruction sets."},{"title":"The desktop was always replaceable","body":"Workbench is iconic, but Amiga users routinely swapped file managers, console handlers, shells, toolkits, icons and the entire desktop. Directory Opus Magellan, Scalos, Ambient and Wanderer show the platform identity sits below any one visual shell — which is how descendants stayed recognisably Amiga-like while developing distinct interfaces."}],"cautions":[{"title":"Availability changes fast","body":"Small-run boards move between shipping, pre-order, waiting-list and unavailable without announcements."},{"title":"Release years are fuzzy","body":"Announcement, developer-board, first-batch and general-retail dates often differ. Years here are first public release."},{"title":"Compatibility is configuration-specific","body":"MorphOS on Apple hardware depends on the exact model and GPU; AmigaOS 4 depends on the listed board or accelerator."},{"title":"FPGA is not automatically cycle-perfect","body":"FPGA cores can be extremely faithful but remain engineering models with their own limits."},{"title":"Curated images may carry licensing constraints","body":"Anything needing AmigaOS, Kickstart ROMs or commercial software should be built from legally obtained files. Listing a project is not an endorsement of any download bundle."},{"title":"Ownership is a separate map","body":"Technical lineage and corporate rights are different things. See the Ownership & brand category."}]},"domains":[{"id":"d-classic","label":"Classic machines","cats":["hw-classic"]},{"id":"d-ng","label":"Next-gen machines","cats":["hw-ng"]},{"id":"d-fpga","label":"FPGA & replicas","cats":["hw-fpga"]},{"id":"d-accel","label":"Accelerators","cats":["hw-accel"]},{"id":"d-exp","label":"Expansions & repair","cats":["hw-gfx","hw-audio","hw-storage","hw-io","hw-repair"]},{"id":"d-os","label":"Operating systems","cats":["os"]},{"id":"d-shell","label":"Shells & desktops","cats":["shell"]},{"id":"d-distro","label":"Distributions","cats":["distro"]},{"id":"d-tech","label":"System tech","cats":["tech"]},{"id":"d-emu","label":"Emulators","cats":["emu"]},{"id":"d-make","label":"Dev & new software","cats":["dev","soft"]},{"id":"d-scene","label":"Scene & stewardship","cats":["pres","comm","brand"]}],"tours":[{"id":"t68k","label":"The 68k continuum","steps":[{"id":"a1000","note":"1985. Where it starts: the chipset-led machine."},{"id":"a500","note":"The best-seller that built the software library."},{"id":"a1200","note":"The AGA wedge that still anchors the scene."},{"id":"os3x","note":"AmigaOS 3.1 — the 25-year compatibility baseline."},{"id":"whdload","note":"The preservation system everything else builds on."},{"id":"vampirev2","note":"FPGA 68080 boards transform real machines."},{"id":"pistorm","note":"A Raspberry Pi in the CPU socket — tens, not hundreds."},{"id":"os32","note":"A current, maintained classic OS in 2026."},{"id":"thea1200","note":"December 2026: a licensed A1200 back at retail."}]},{"id":"tppc","label":"PowerPC & next-gen","steps":[{"id":"blizzardppc","note":"1997: PowerPC arrives beside the 68k."},{"id":"powerup","note":"Two rival PPC kernels split the tiny market."},{"id":"os40","note":"AmigaOS 4 — the official line goes PPC-native."},{"id":"morphos1","note":"MorphOS — the other PPC heir."},{"id":"peg2","note":"Pegasos II: the machine both systems share."},{"id":"x1000","note":"A-EON revives the bespoke flagship."},{"id":"x5000","note":"Today’s shared OS4/MorphOS hardware."},{"id":"os41fe","note":"AmigaOS 4.1 FE — updated again in 2025."},{"id":"morphos320","note":"MorphOS 3.20 ships in 2026…"},{"id":"mirari","note":"…for a brand-new PowerPC board."}]},{"id":"tfpga","label":"FPGA rebirth","steps":[{"id":"minimig","note":"2007: the A500 rebuilt in programmable logic, GPL."},{"id":"mist","note":"The whole machine moves into the FPGA."},{"id":"mister","note":"The open platform that became the standard."},{"id":"replay","note":"AGA in FPGA, with a real 68060 option."},{"id":"v4sa","note":"Apollo extends rather than recreates: 68080 + SAGA."},{"id":"a6000","note":"A brand-new 68k computer with a keyboard, 2025."},{"id":"nanomig","note":"An Amiga on a $30 FPGA board."}]},{"id":"temu","label":"Emulate it","steps":[{"id":"uae","note":"1995: the \"Unusable\" emulator that started it all."},{"id":"winuae","note":"The accuracy reference, still developed in 2026."},{"id":"fsuae","note":"The polished cross-platform shell with netplay."},{"id":"amiberry","note":"The engine inside most modern devices and images."},{"id":"puae","note":"The RetroArch core — Amiga on phones and consoles."},{"id":"vamiga","note":"Cycle-accurate, from scratch, beautiful on a Mac."},{"id":"qemu","note":"Even the PowerPC machines are emulated now."},{"id":"amigaforever","note":"The legal one-click package with licensed ROMs."}]},{"id":"tos","label":"The OS family tree","steps":[{"id":"os1x","note":"1985: pre-emptive multitasking in 256 KB."},{"id":"os2x","note":"The API surface every successor still implements."},{"id":"os3x","note":"3.1 — the classic baseline."},{"id":"os39","note":"The Haage & Partner era peaks."},{"id":"amithlon","note":"The x86 heresy: fastest Amiga ever sold, killed by licensing."},{"id":"os40","note":"The official heir on PowerPC."},{"id":"morphos1","note":"The parallel heir, born from PowerUP."},{"id":"aros","note":"The open-source re-implementation."},{"id":"aros68k","note":"…which gives everyone a free Kickstart."},{"id":"apolloos","note":"…and powers the Vampire machines."},{"id":"os32","note":"Classic AmigaOS, current release 2025."},{"id":"os41fe","note":"AmigaOS 4.1 FE Update 3, 2025."},{"id":"morphos320","note":"MorphOS 3.20, 2026. Four living systems."}]},{"id":"town","label":"Who owns the Amiga?","steps":[{"id":"cbm-bankrupt","note":"April 1994: Commodore dies. The platform does not."},{"id":"escom","note":"Escom buys it, restarts production, goes under."},{"id":"gateway","note":"Gateway buys it for the patents."},{"id":"amigainc","note":"Amiga Inc. points the brand away from the hardware."},{"id":"hyperion-contract","note":"Hyperion is contracted for AmigaOS 4."},{"id":"settlement2009","note":"The 2009 settlement defines who owns what."},{"id":"cloanto","note":"Cloanto consolidates the classic copyrights."},{"id":"commodore2025","note":"2025: Commodore returns — without Amiga rights."},{"id":"settlement2026","note":"4 Aug 2026: all litigation ends."},{"id":"whoowns","note":"The map of rights as it stands today."}]}],"entries":[{"id":"lorraine","name":"Lorraine prototype","year":1984,"category":"hw-classic","kind":"prototype","status":"prototype","arch":["68k"],"weight":4,"by":"Amiga Corporation","what":"The pre-Commodore development system built by Jay Miner's team that established the chipset-led architecture later sold as the Amiga 1000.","why":"Graphics, audio and pre-emptive multitasking were conceived as one integrated system from the start. The Boing Ball demo ran on a Lorraine at CES in January 1984.","tags":["prototype","origins"]},{"id":"a1000","name":"Amiga 1000","year":1985,"category":"hw-classic","kind":"original","status":"historic","arch":["68k"],"weight":5,"by":"Commodore","what":"The first shipping Amiga: 68000 at 7.16 MHz, OCS chipset, 256 KB RAM, and Kickstart loaded from disk into writable control store.","why":"Turned Lorraine into a consumer computer and set the software and expansion conventions everything else followed.","image":"images/a1000.jpg","imageCredit":"Photo: Rama & Musée Bolo, CC BY-SA 2.0 FR (Wikimedia Commons)","related":["lorraine"],"tags":["ocs","origins"]},{"id":"ranger","name":"Ranger prototype","year":1986,"category":"hw-classic","kind":"prototype","status":"prototype","arch":["68k"],"weight":2,"by":"Commodore","what":"An unreleased advanced-chipset and high-end system effort developed between the A1000 and the later big-box machines.","why":"A reminder that Amiga evolution included ambitious internal branches that never became products.","related":["a1000"],"tags":["prototype"]},{"id":"a2000","name":"Amiga 2000","year":1987,"category":"hw-classic","kind":"original","status":"historic","arch":["68k"],"weight":5,"by":"Commodore","what":"The expandable desktop Amiga: five Zorro II slots, a CPU slot, a video slot and ISA pass-throughs.","why":"Its open slots made it the platform for Video Toaster systems, accelerators, graphics cards and decades of upgrades.","image":"images/a2000.jpg","imageCredit":"Photo: Trafalgarcircle, public domain (Wikimedia Commons)","related":["a1000"],"tags":["ocs","ecs","bigbox","zorro"]},{"id":"a500","name":"Amiga 500","year":1987,"category":"hw-classic","kind":"original","status":"historic","arch":["68k"],"weight":5,"by":"Commodore","what":"The cost-reduced keyboard wedge and best-selling Amiga: 68000, OCS (later ECS Agnus), 512 KB, with a trapdoor and side expansion bus.","why":"The mass-market foundation — most people's mental image of an Amiga, and the target of an enormous games and demo library.","image":"images/a500.jpg","imageCredit":"Photo: Bill Bertram, CC BY-SA 2.5 (Wikimedia Commons)","related":["a1000"],"tags":["ocs","wedge"]},{"id":"a2500","name":"Amiga 2500","year":1989,"category":"hw-classic","kind":"original","status":"historic","arch":["68k"],"weight":2,"by":"Commodore","what":"Factory A2000 configurations bundled with an A2620 (68020) or A2630 (68030) accelerator and SCSI.","why":"It formalised the community's favourite idea: start with an expandable Amiga and grow it into a workstation.","related":["a2000"],"tags":["bigbox"]},{"id":"a1500","name":"Amiga 1500","year":1990,"category":"hw-classic","kind":"original","status":"historic","arch":["68k"],"weight":2,"by":"Commodore","what":"A UK-market A2000 variant commonly supplied with two floppy drives and no hard disk.","why":"A region-specific model that became an accessible route into the big-box expansion ecosystem.","related":["a2000"],"tags":["bigbox"]},{"id":"a3000","name":"Amiga 3000","year":1990,"category":"hw-classic","kind":"original","status":"historic","arch":["68k"],"weight":4,"by":"Commodore","what":"A compact high-end workstation: 68030 at 16/25 MHz with FPU, ECS plus the Amber flicker-fixer for 31 kHz output, Zorro III, on-board SCSI and SIMM sockets.","why":"Often regarded as the most coherent big-box design, and a durable base for 68060, PowerPC and RTG builds.","related":["a2000"],"tags":["ecs","bigbox","zorro","scsi"]},{"id":"a3000ux","name":"Amiga 3000UX","year":1990,"category":"hw-classic","kind":"original","status":"historic","arch":["68k"],"weight":2,"by":"Commodore","what":"A3000 configurations sold with Commodore's Amiga UNIX (SVR4) rather than only AmigaOS.","why":"It showed the same hardware could serve as a Unix workstation, even without AmigaOS application compatibility.","related":["a3000","amix"],"tags":["unix","bigbox"]},{"id":"a3500","name":"Amiga 3500 prototype","year":1990,"category":"hw-classic","kind":"prototype","status":"prototype","arch":["68k"],"weight":1,"by":"Commodore","what":"A pre-production tower form of the A3000, associated with workstation and UNIX plans.","why":"It led into the production A3000T and illustrates Commodore's workstation ambitions.","related":["a3000"],"tags":["prototype","bigbox"]},{"id":"a3000t","name":"Amiga 3000T","year":1991,"category":"hw-classic","kind":"original","status":"historic","arch":["68k"],"weight":2,"by":"Commodore","what":"Tower version of the A3000 with additional room for drives and expansion.","why":"One of the rarest production big-box Amigas and a favoured platform for serious expansion.","related":["a3000","a3500"],"tags":["bigbox"]},{"id":"a500p","name":"Amiga 500 Plus","year":1991,"category":"hw-classic","kind":"original","status":"historic","arch":["68k"],"weight":3,"by":"Commodore","what":"An ECS revision of the A500 with 1 MB chip RAM, Kickstart 2.04 and a battery-backed clock — the infamous leaking barrel battery.","why":"A short-lived but important bridge from OCS-era software toward the A600 generation.","related":["a500"],"tags":["ecs","wedge"]},{"id":"cdtv","name":"Commodore CDTV","year":1991,"category":"hw-classic","kind":"original","status":"historic","arch":["68k"],"weight":3,"by":"Commodore","what":"An A500-based multimedia CD player in a hi-fi case, with CD-ROM and the DMAC controller, running Kickstart 1.3 plus a CDTV extended ROM.","why":"It anticipated CD-based consoles and demonstrated that Amiga technology could leave the desktop.","related":["a500"],"tags":["ocs","console","cd"]},{"id":"a600","name":"Amiga 600","year":1992,"category":"hw-classic","kind":"original","status":"historic","arch":["68k"],"weight":4,"by":"Commodore","what":"The smallest classic wedge (project \"A300\"): 68000, ECS, and the Gayle chip providing internal 44-pin IDE and a PCMCIA slot, but no numeric keypad.","why":"Its compact surface-mount board — notorious for capacitor leakage — later became a surprising favourite for Vampire and PiStorm transformations.","related":["a500p"],"tags":["ecs","wedge","ide","pcmcia"]},{"id":"a1200","name":"Amiga 1200","year":1992,"category":"hw-classic","kind":"original","status":"historic","arch":["68k"],"weight":5,"by":"Commodore","what":"The affordable AGA wedge: 68EC020 at 14 MHz, Alice/Lisa AGA chips, Gayle IDE and PCMCIA, 2 MB chip RAM, a 150-pin trapdoor with a real 32-bit bus, and a clockport.","why":"Its balance of compatibility, AGA graphics and expandability made it the centre of the modern classic scene.","image":"images/a1200.jpg","imageCredit":"Photo: Wojciech Pędzich, CC BY-SA 4.0 (Wikimedia Commons)","related":["a600","a4000"],"tags":["aga","wedge","ide","clockport"]},{"id":"a4000","name":"Amiga 4000","year":1992,"category":"hw-classic","kind":"original","status":"historic","arch":["68k"],"weight":4,"by":"Commodore","what":"The flagship AGA desktop: 68EC030 at 25 MHz or 68040 on a CPU daughtercard, Zorro III via Super Buster, IDE and SIMM RAM.","why":"The principal high-end AGA platform, and the classic machine most often pushed into 060, PowerPC and RTG territory.","related":["a3000"],"tags":["aga","bigbox","zorro"]},{"id":"cdtvcr","name":"CDTV-CR prototype","year":1992,"category":"hw-classic","kind":"prototype","status":"prototype","arch":["68k"],"weight":1,"by":"Commodore","what":"A cost-reduced second-generation CDTV design that did not reach normal production.","why":"It connects the original CDTV experiment to Commodore's later CD32 console strategy.","related":["cdtv"],"tags":["prototype","console"]},{"id":"cd32","name":"Amiga CD32","year":1993,"category":"hw-classic","kind":"original","status":"historic","arch":["68k"],"weight":4,"by":"Commodore","what":"A CD-based AGA console: 68EC020 at 14 MHz, 2 MB chip RAM, double-speed CD and the Akiko chip combining CD control with chunky-to-planar conversion.","why":"Commodore's last major consumer launch became a preservation and homebrew target in its own right, and its expansion connector allows full-computer upgrades.","related":["cdtv","a1200"],"tags":["aga","console","cd","akiko"]},{"id":"aaa","name":"AAA chipset","year":1993,"category":"hw-classic","kind":"prototype","status":"prototype","arch":["68k"],"weight":2,"by":"Commodore","what":"A 64-bit next-generation chipset (\"Andrea, Linda, Mary, Monica\") with 16-bit audio and chunky modes. Silicon existed but was never debugged to production; cancelled in 1993.","why":"The successor that would have answered the PC's graphics advance — and the clearest measure of what Commodore's collapse cost technically.","related":["a4000"],"tags":["prototype","chipset"]},{"id":"hombre","name":"Hombre chipset","year":1994,"category":"hw-classic","kind":"prototype","status":"prototype","arch":["other"],"weight":2,"by":"Commodore","what":"A PA-RISC-based 3D chipset and console project with Windows NT ambitions, killed by Commodore's 1994 bankruptcy.","why":"Commodore's final attempt at a generational leap, abandoning the 68k line entirely.","related":["a4000"],"tags":["prototype","chipset"]},{"id":"a4000t","name":"Amiga 4000T","year":1994,"category":"hw-classic","kind":"original","status":"historic","arch":["68k"],"weight":3,"by":"Commodore / Amiga Technologies","what":"The tower flagship with added SCSI, produced first by Commodore and then by Escom's Amiga Technologies in 1995–96.","why":"The final production classic model, roomy enough for the most extreme accelerator, graphics and storage builds.","related":["a4000"],"tags":["aga","bigbox"]},{"id":"at95","name":"Amiga Technologies relaunch","year":1995,"category":"hw-classic","kind":"original","status":"historic","arch":["68k"],"weight":3,"by":"Escom / Amiga Technologies","what":"After Commodore's liquidation, Escom's Amiga Technologies (Petro Tyschtschenko) restarted A1200 and A4000T manufacture.","why":"It kept new classic hardware on sale and briefly connected the Commodore era to post-bankruptcy stewardship.","related":["a1200","a4000t"],"tags":["escom"]},{"id":"walker","name":"Amiga Walker prototype","year":1996,"category":"hw-classic","kind":"prototype","status":"prototype","arch":["68k"],"weight":2,"by":"Amiga Technologies","what":"Amiga Technologies' planned mid-range successor — 68EC030, AGA, and a distinctive expandable case — shown publicly but cancelled after Escom's collapse.","why":"Its famous vacuum-cleaner-like case became the visual symbol of the product path that almost continued.","related":["at95"],"tags":["prototype","aga"]},{"id":"draco","name":"MacroSystem DraCo","year":1994,"category":"hw-ng","kind":"compatible","status":"historic","arch":["68k"],"weight":4,"by":"MS MacroSystem (DE)","what":"A professional Amiga-compatible non-linear video editing workstation: 68060 (some 68040) at 50 MHz, unified memory to 128 MB, and no Commodore custom chipset at all. It ran AmigaOS 3.1 from an A3000 Kickstart with a modified SetPatch, driving MacroSystem's MovieShop software over the proprietary DraCoBus.","why":"Built in roughly nine months by about sixteen engineers reacting to Commodore's bankruptcy, DraCo proved AmigaOS could survive on clean-room, RTG-oriented hardware — conceptually the direct ancestor of the AmigaOne, Sam and X5000 idea. Supported commercially to 2000; the cheaper Casablanca appliance followed.","related":["a4000"],"tags":["rtg","video","compatible"]},{"id":"abox","name":"phase5 A\\BOX","year":1996,"category":"hw-ng","kind":"prototype","status":"prototype","arch":["ppc"],"weight":2,"by":"phase5 digital products","what":"phase5's ambitious planned PowerPC successor, built around a custom \"Caipirinha\" chipset. It never shipped, and phase5 entered insolvency around 1999–2000.","why":"Its ideas and team history foreshadowed the post-Commodore split into PowerPC boards and new operating systems — several of the same people went on to bplan, Pegasos and MorphOS.","url":"https://powerup.amigaworld.de","related":["draco"],"tags":["prototype","ppc"]},{"id":"boxer","name":"BoXeR motherboard","year":1997,"category":"hw-ng","kind":"prototype","status":"prototype","arch":["68k"],"weight":2,"by":"Index Information / Blittersoft","what":"A long-running attempt at an updated single-board classic-compatible computer: 68040/68060, AGA-compatible, PCI, in ATX form. Repeatedly announced across roughly 1997–2003 and never reaching volume production.","why":"The canonical example of the community's recurring wish for a genuinely new classic-chipset motherboard — a wish answered instead by FPGA recreations, ReAmiga replicas and the AA3000+.","related":["a4000"],"tags":["prototype","vapourware"],"unverified":true},{"id":"macg4","name":"Apple Power Mac G4 family","year":1999,"category":"hw-ng","kind":"compatible","status":"active","arch":["ppc"],"weight":3,"by":"Apple (MorphOS community support)","what":"Selected Radeon-equipped Power Mac G4 towers and the Cube are supported by MorphOS.","why":"They offer abundant, repairable expansion hardware for an OS whose purpose-built machines are rare and expensive.","url":"https://www.morphos-team.net/hardware","related":["morphos2"],"tags":["apple","morphos"]},{"id":"pbg4","name":"Apple PowerBook / iBook G4","year":2001,"category":"hw-ng","kind":"compatible","status":"active","arch":["ppc"],"weight":3,"by":"Apple (MorphOS community support)","what":"Supported Radeon-equipped G4 laptops give MorphOS a portable hardware branch.","why":"A community port delivered something classic Amiga never had as a production product: a practical laptop.","url":"https://www.morphos-team.net/hardware","related":["morphos3"],"tags":["apple","morphos","portable"]},{"id":"a1se","name":"AmigaOne SE","year":2002,"category":"hw-ng","kind":"compatible","status":"historic","arch":["ppc"],"weight":3,"by":"Eyetech","what":"Eyetech's first shipping AmigaOne board, using a Mai Logic Teron design with a soldered PowerPC 750CXe at 600 MHz.","why":"It made the AmigaOne name concrete and gave AmigaOS 4 developers real PowerPC target hardware.","related":["os40"],"tags":["os4","ng"]},{"id":"peg1","name":"bplan Pegasos I","year":2002,"category":"hw-ng","kind":"compatible","status":"historic","arch":["ppc"],"weight":3,"by":"bplan GmbH / Genesi","what":"The first Pegasos MicroATX board, designed by ex-phase5 engineers Gerald Carda and Thomas Knäbel, using a G3 CPU card and the MAI Articia S northbridge whose DMA bug forced the \"April\" fix chip.","why":"It established the \"blue\" PowerPC branch: Amiga-like APIs and experience on non-Amiga hardware, closely tied to early MorphOS.","related":["abox","morphos1"],"tags":["morphos","ng"]},{"id":"a1xe","name":"AmigaOne XE","year":2003,"category":"hw-ng","kind":"compatible","status":"historic","arch":["ppc"],"weight":3,"by":"Eyetech","what":"The expandable ATX AmigaOne, taking CPU cards up to a G4 at 933 MHz, with four PCI slots and AGP.","why":"For many early adopters this was the practical start of daily AmigaOS 4 use.","related":["a1se"],"tags":["os4","ng"]},{"id":"macg5","name":"Apple Power Mac G5","year":2003,"category":"hw-ng","kind":"compatible","status":"active","arch":["ppc"],"weight":3,"by":"Apple (MorphOS community support)","what":"Selected Power Mac 7,2 and 7,3 systems are fully supported by MorphOS.","why":"They provide the fastest widely available used desktop hardware in the MorphOS ecosystem.","url":"https://www.morphos-team.net/hardware","related":["morphos3"],"tags":["apple","morphos"]},{"id":"peg2","name":"bplan Pegasos II","year":2003,"category":"hw-ng","kind":"compatible","status":"historic","arch":["ppc"],"weight":4,"by":"bplan GmbH / Genesi","what":"A refined Pegasos board replacing Articia with the Marvell Discovery II, taking G3 600 MHz or G4 1.0 GHz cards. ACube later sold AmigaOS 4.1 for it; Hyperion moved that to digital download in 2025.","why":"One of the rare bridge machines where both major PowerPC Amiga-like operating systems meet, and still a supported MorphOS 3.20 target.","related":["peg1"],"tags":["morphos","os4","ng"]},{"id":"imacg5","name":"Apple iMac G5 / eMac","year":2004,"category":"hw-ng","kind":"compatible","status":"active","arch":["ppc"],"weight":2,"by":"Apple (MorphOS community support)","what":"Specific Radeon-equipped eMac and iMac G5 (iSight A1145) models are supported by MorphOS.","why":"Community driver work transformed sealed mainstream Macs into elegant all-in-one Amiga-like systems.","url":"https://www.morphos-team.net/hardware","related":["morphos3"],"tags":["apple","morphos"]},{"id":"microa1","name":"MicroA1-C","year":2004,"category":"hw-ng","kind":"compatible","status":"historic","arch":["ppc"],"weight":2,"by":"Eyetech","what":"A compact Mini-ITX AmigaOne variant with integrated graphics and a single PCI slot.","why":"It brought the AmigaOS 4 branch into a small-form-factor board years before mini PCs became routine.","related":["a1xe"],"tags":["os4","ng"]},{"id":"macmini","name":"Apple Mac mini G4","year":2005,"category":"hw-ng","kind":"compatible","status":"active","arch":["ppc"],"weight":3,"by":"Apple (MorphOS community support)","what":"Mass-produced Apple hardware supported by MorphOS, now inexpensive on the second-hand market.","why":"Community drivers turned common used Macs into the most accessible genuine PowerPC MorphOS systems — arguably the single biggest driver of MorphOS adoption.","url":"https://www.morphos-team.net/hardware","related":["morphos2"],"tags":["apple","morphos"]},{"id":"efika","name":"Genesi EFIKA 5200B","year":2006,"category":"hw-ng","kind":"compatible","status":"historic","arch":["ppc"],"weight":2,"by":"Genesi","what":"A tiny low-power MPC5200B PowerPC board supported by MorphOS, following Genesi's Open Desktop Workstation.","why":"It demonstrated how lightweight the MorphOS and Amiga-like stack could be on modest embedded hardware.","related":["peg2"],"tags":["morphos","ng"]},{"id":"sam440","name":"ACube Sam440ep","year":2007,"category":"hw-ng","kind":"compatible","status":"historic","arch":["ppc"],"weight":3,"by":"ACube Systems (IT)","what":"A compact board built on the AMCC PowerPC 440EP SoC at 533–667 MHz with onboard Radeon M9, officially supported by AmigaOS 4 from 2008.","why":"Independent hardware development kept a purchasable AmigaOS 4 path alive after Eyetech withdrew.","url":"https://www.acube-systems.biz","related":["microa1"],"tags":["os4","ng"]},{"id":"sam440flex","name":"ACube Sam440ep-flex","year":2008,"category":"hw-ng","kind":"compatible","status":"historic","arch":["ppc"],"weight":2,"by":"ACube Systems","what":"A more expandable flex-ATX Sam440 variant with PCI slots and later 800 MHz options.","why":"It traded the original board's compactness for the expansion culture familiar to classic users.","url":"https://www.acube-systems.biz","related":["sam440"],"tags":["os4","ng"]},{"id":"sam460","name":"ACube Sam460ex","year":2010,"category":"hw-ng","kind":"compatible","status":"historic","arch":["ppc"],"weight":3,"by":"ACube Systems","what":"The next ACube generation: AppliedMicro 460EX at 1.10–1.15 GHz with a PCIe x16 slot, supported by AmigaOS 4 and later MorphOS.","why":"Another meeting point between the two PowerPC systems, with far more modern expansion than the Sam440.","url":"https://www.acube-systems.biz","related":["sam440flex"],"tags":["os4","morphos","ng"]},{"id":"x1000","name":"AmigaOne X1000","year":2010,"category":"hw-ng","kind":"compatible","status":"historic","arch":["ppc"],"weight":4,"by":"A-EON Technology","what":"A-EON's premium flagship on the ATX \"Nemo\" board: a dual-core P.A. Semi PA6T-1682M at 1.8 GHz — orphaned when Apple bought P.A. Semi — plus the Xena XMOS co-processor on a Xorro slot. Launched January 2012.","why":"It restored the idea of a bespoke flagship and funded a new wave of next-gen software and driver work. Community Linux builds for it still appeared in 2026.","url":"https://www.a-eon.com","related":["a1xe"],"tags":["os4","ng"]},{"id":"a1500ng","name":"AmigaOne 500","year":2011,"category":"hw-ng","kind":"compatible","status":"historic","arch":["ppc"],"weight":2,"by":"ACube Systems","what":"A complete desktop system built around a Sam460ex in a Micro-ATX case, badged with the classic checkmark.","why":"It packaged the next-gen branch as a ready-to-use computer rather than a bare specialist board.","url":"https://www.acube-systems.biz","related":["sam460"],"tags":["os4","morphos","ng"]},{"id":"sam460cr","name":"ACube Sam460cr","year":2014,"category":"hw-ng","kind":"compatible","status":"historic","arch":["ppc"],"weight":2,"by":"ACube Systems","what":"A cost-reduced Sam460 revision supported by AmigaOS 4 and MorphOS.","why":"It extended the dual-OS lifespan of the Sam platform.","url":"https://www.acube-systems.biz","related":["sam460"],"tags":["os4","morphos","ng"]},{"id":"x5000","name":"AmigaOne X5000/20","year":2016,"category":"hw-ng","kind":"compatible","status":"limited","arch":["ppc"],"weight":4,"by":"A-EON Technology","what":"A-EON's flagship on the Varisys \"Cyrus\" board: NXP QorIQ P5020 dual-core at 2.0 GHz, running AmigaOS 4.1, MorphOS and PowerPC Linux. Availability is intermittent and the P5020 is end-of-life.","why":"The strongest shared hardware link between today's AmigaOS 4 and MorphOS communities.","version":"P5020 dual-core 2.0 GHz","url":"https://www.a-eon.com","related":["x1000"],"tags":["os4","morphos","ng"]},{"id":"sam460le","name":"ACube Sam460LE","year":2020,"category":"hw-ng","kind":"compatible","status":"limited","arch":["ppc"],"weight":2,"by":"ACube Systems","what":"A limited-edition Sam460 re-run at roughly 1.14 GHz, listed with an AmigaOS 4.1 Final Edition OEM licence but frequently out of stock.","why":"Its existence shows sustained small-run demand for dedicated AmigaOS 4 hardware.","version":"€889.38 with OS 4.1 FE licence","url":"https://www.acube-systems.biz","related":["sam460cr"],"tags":["os4","ng"]},{"id":"x5000-40","name":"AmigaOne X5000/40","year":2020,"category":"hw-ng","kind":"compatible","status":"limited","arch":["ppc"],"weight":3,"by":"A-EON Technology","what":"A higher-end X5000 configuration using a quad-core NXP P5040, produced in small numbers.","why":"It pushes the custom PowerPC AmigaOne branch to its most capable commercial configuration.","version":"P5040 quad-core ~2.2 GHz","url":"https://www.a-eon.com","related":["x5000"],"tags":["os4","morphos","ng"]},{"id":"a1222","name":"AmigaOne A1222 Plus","year },{"id":"thea500","name":"THEA500 Mini","year":2022,"category":"hw-fpga","kind":"appliance","status":"shipping","arch":["arm"],"weight":4,"by":"Retro Games Ltd (UK)","what":"A roughly half-scale Amiga 500 console emulating OCS/ECS and AGA on an ARM SoC, with HDMI 720p, three USB ports, 25 built-in games, save states and WHDLoad sideloading from USB. Ships with an 8-button pad and a recreated tank mouse; the case keyboard is non-functional.","why":"It put a licensed, legal, plug-in Amiga on ordinary retail shelves — ROMs licensed from Cloanto — and introduced the platform to a mainstream audience.","version":"~£119.99 launch","url":"https://retrogames.biz","related":["a500","amiberry"],"tags":["appliance","console","licensed"]},{"id":"a600gs","name":"A600GS","year":2024,"category":"hw-fpga","kind":"appliance","status":"shipping","arch":["arm"],"weight":3,"by":"AmigaKit (UK)","what":"A small ARM-based games system and 68k-compatible computer running AmiBench V46, a 68k desktop environment over embedded Linux with an optimised emulation layer. Includes licensed Personal Paint 7.4, OctaMED, Final Writer 7.2 and Directory Opus, plus the AmiSphere online service.","why":"A turnkey modern Amiga desktop with legally bundled software — the commercial answer to the community distribution images.","version":"US$162.49","url":"https://www.a600gs.com","related":["amiberry"],"tags":["appliance","amibench"],"unverified":true},{"id":"a1200ng","name":"A1200NG","year":2025,"category":"hw-fpga","kind":"appliance","status":"limited","arch":["arm"],"weight":3,"by":"AmigaKit (UK)","what":"A drop-in ARM replacement motherboard for original Amiga 1200 cases, running the same AmiBench V46 environment as the A600GS, with internal USB headers, floppy support, HDMI and an optional CPU Boost Kit.","why":"It lets an original A1200 case and keyboard become a modern, quiet, reliable machine — the opposite trade to a Vampire or PiStorm.","url":"https://www.amigakit.com","related":["a600gs","a1200"],"tags":["appliance","amibench"],"unverified":true},{"id":"thea1200","name":"THEA1200","year":2026,"category":"hw-fpga","kind":"appliance","status":"planned","arch":["arm"],"weight":4,"by":"Retro Games Ltd (UK)","what":"A full-size Amiga 1200 recreation with a fully working keyboard. Emulates A1200 AGA plus selectable A500 OCS, A600 ECS and CD32 configurations, with HDMI, four USB ports, RTG support for high-resolution Workbench, Workbench included, 25 built-in games and WHDLoad sideloading.","why":"Delayed past 2025 by the Hyperion litigation, it became an officially Amiga-branded licensed product on 18 August 2026 following the settlement — the first mainstream Amiga computer in decades.","version":"£169.99 · launches 4 Dec 2026","url":"https://retrogames.biz","related":["thea500","a1200"],"tags":["appliance","licensed","aga"]},{"id":"minimig","name":"Minimig","year":2007,"category":"hw-fpga","kind":"fpga","status":"active","arch":["fpga","68k"],"weight":5,"by":"Dennis van Weeren (NL)","what":"An open-source re-implementation of the Amiga 500 chipset in a Xilinx Spartan-3 FPGA, paired with a real MC68SEC000. Begun January 2005 and released under GPLv3 on 25 July 2007.","why":"The blueprint that proved a community could recreate Amiga hardware behaviour in programmable logic. Its code lives on in virtually every Amiga FPGA project since.","url":"https://github.com/MiSTer-devel/Minimig-AGA_MiSTer","related":["a500"],"tags":["fpga","ocs","open"]},{"id":"c-one","name":"C-One / Clone-A","year":2003,"category":"hw-fpga","kind":"fpga","status":"historic","arch":["fpga"],"weight":2,"by":"Jeri Ellsworth & Jens Schönfeld","what":"The C-One \"reconfigurable computer\" was an ATX FPGA motherboard extensible via swap-in CPU cards; a later Cyclone III extender could run a Minimig port. Clone-A, its cycle-exact OCS re-implementation as drop-in replacement chips, was demonstrated at Breakpoint 2007 but never released commercially.","why":"An independent line of FPGA thinking whose know-how fed into Individual Computers' later products.","url":"https://icomp.de","tags":["fpga"],"unverified":true},{"id":"acubeminimig","name":"ACube Minimig v1.1","year":2008,"category":"hw-fpga","kind":"fpga","status":"historic","arch":["fpga","68k"],"weight":2,"by":"ACube Systems","what":"The commercially manufactured Minimig revision with increased memory and a faster 68000 option, announced 9 February 2008.","why":"It turned an open hardware experiment into something buyable ready-made.","related":["minimig"],"tags":["fpga"]},{"id":"illuwatar","name":"Illuwatar Mini-ITX Minimig","year":2008,"category":"hw-fpga","kind":"fpga","status":"historic","arch":["fpga","68k"],"weight":1,"by":"Illuwatar (SE)","what":"A Swedish Mini-ITX form-factor Minimig implementation released under the open-source licence.","why":"An early sign that the freed Minimig design would be re-spun independently by third parties.","related":["minimig"],"tags":["fpga"]},{"id":"chameleon","name":"Turbo Chameleon 64","year":2011,"category":"hw-fpga","kind":"fpga","status":"limited","arch":["fpga"],"weight":2,"by":"Individual Computers","what":"An FPGA cartridge for the C64 that also works standalone; among its cores is a Minimig OCS/ECS port with a 68020 soft-CPU by Tobias Gubener. V2 hardware arrived in 2020.","why":"It carried the Amiga core into the Commodore 8-bit world, showing how portable the Minimig design had become.","url":"https://icomp.de","related":["minimig"],"tags":["fpga"],"unverified":true},{"id":"mcc216","name":"MCC-216","year":2010,"category":"hw-fpga","kind":"fpga","status":"historic","arch":["fpga"],"weight":1,"by":"unclear","what":"A compact FPGA system marketed as an Amiga-compatible computer, offering Amiga and other Commodore cores among several recreated machines.","why":"An early example of the Amiga core becoming part of a portable multi-system product — and a controversial one, as community testing questioned its performance claims and its originality relative to the open Minimig core.","related":["minimig"],"tags":["fpga"],"unverified":true},{"id":"replay","name":"FPGA Arcade Replay","year":2011,"category":"hw-fpga","kind":"fpga","status":"historic","arch":["fpga","68k"],"weight":3,"by":"Mike Johnson","what":"A high-capacity FPGA board whose Amiga core reached full AGA support, with an optional physical 68060 daughterboard, 256 MB RAM, USB and Ethernet. Replay 1 is discontinued; Replay 2 has been \"in the making\" since around 2018 and remains unreleased.","why":"It moved FPGA Amiga work from basic A500 recreation toward genuine AGA-class capability.","url":"https://www.fpgaarcade.com","related":["minimig"],"tags":["fpga","aga"]},{"id":"mist","name":"MiST","year":2013,"category":"hw-fpga","kind":"fpga","status":"historic","arch":["fpga"],"weight":4,"by":"Till Harbaum","what":"A Cyclone III board — named from aMIga + ST — that moved the whole Amiga including the CPU into the FPGA using the TG68 soft-core, carrying Rok Krajnc's Minimig-AGA fork alongside many other computer cores.","why":"It made the recreated Amiga a reusable core rather than a single product, and directly inspired MiSTer.","url":"https://github.com/mist-devel","related":["minimig"],"tags":["fpga"]},{"id":"mister","name":"MiSTer FPGA","year":2017,"category":"hw-fpga","kind":"fpga","status":"active","arch":["fpga"],"weight":5,"by":"Alexey \"Sorgelig\" Melnikov","what":"An open multi-system FPGA platform on the Terasic DE10-Nano. Its Minimig-AGA core covers OCS/ECS/AGA with a 68000 or 68020 soft-CPU, up to 2 MB chip plus 384 MB fast RAM, four floppies, four IDE devices including CD-ROM, RTG to 1920×1080, a shared Linux↔Amiga folder and MIDI.","why":"For many enthusiasts the reference low-latency, highly configurable Amiga recreation. The clone wave — MiSTer Pi from $125, QMTECH boards, the consolised MiSTer Multisystem 2 at £276 — made it inexpensive.","url":"https://mister-devel.github.io/MkDocs_MiSTer/","related":["mist","minimig"],"tags":["fpga","aga","open"]},{"id":"sidi","name":"SiDi / SiDi128","year":2019,"category":"hw-fpga","kind":"fpga","status":"shipping","arch":["fpga"],"weight":2,"by":"ManuFerHi (ES)","what":"MiST-firmware-compatible compact boards. The 2023 SiDi128 pairs a larger EP4CE55 FPGA with 128 MB SDRAM, enough for heavier cores including Minimig with AGA.","why":"It keeps the MiST software ecosystem alive on current, purchasable hardware.","version":"SiDi128 €263.78","url":"https://manuferhi.com","related":["mist"],"tags":["fpga"],"unverified":true},{"id":"unamiga","name":"UnAmiga / neptUNO","year":2018,"category":"hw-fpga","kind":"fpga","status":"limited","arch":["fpga"],"weight":2,"by":"Spanish FPGA community / Antonio Villena","what":"UnAmiga and UnAmiga Reloaded were small Cyclone IV boards built specifically to run Minimig-AGA forks. Their successors are Antonio Villena's multi-core neptUNO and ZXTRES boards (€150–€369), which include Amiga cores among dozens of systems.","why":"A distinctly Spanish branch of the FPGA scene that kept producing purpose-built Amiga boards.","related":["minimig"],"tags":["fpga"],"unverified":true},{"id":"pocket","name":"Analogue Pocket Amiga core","year":2022,"category":"hw-fpga","kind":"fpga","status":"active","arch":["fpga"],"weight":2,"by":"Mazamars312","what":"A Minimig-derived openFPGA core for the Analogue Pocket handheld — version 0.2.3 in January 2024, with an Analogizer-enabled 0.3.2 following in February 2025.","why":"It made a genuinely handheld FPGA Amiga possible, though it remains early compared with MiSTer.","related":["minimig"],"tags":["fpga","portable"]},{"id":"nanomig","name":"NanoMig","year":2024,"category":"hw-fpga","kind":"fpga","status":"active","arch":["fpga"],"weight":3,"by":"Till Harbaum","what":"Minimig ported to the roughly $30 Gowin Tang Nano 20K and larger Tang boards: A500/A1000-class OCS/ECS, up to 2 MB chip and 4 MB fast RAM, Kickstart 1.2–3.x, four floppies, two IDE drives, HDMI out and USB peripherals. No AGA on the TN20K — the FPGA is too small — with an accelerated 68020 mode in progress.","why":"It drops the cost of an FPGA Amiga to pocket money, and is fully open source.","url":"https://github.com/harbaum/NanoMig","related":["minimig"],"tags":["fpga","open"]},{"id":"gba1000","name":"GBA1000","year":2005,"category":"hw-fpga","kind":"replica","status":"limited","arch":["68k"],"weight":2,"by":"Georg Braun","what":"A long-running enhanced A1000 replacement board, predating the current replica wave.","why":"The pioneer of the \"build a new Amiga motherboard\" idea that ReAmiga later industrialised.","related":["a1000"],"tags":["replica"],"unverified":true},{"id":"a500pp","name":"A500++ replica board","year":2018,"category":"hw-fpga","kind":"replica","status":"active","arch":["68k"],"weight":3,"by":"community (KiCad, open)","what":"A community-redrawn A500 rev 6A motherboard, widely built directly from the published files using period-compatible components.","why":"New PCBs rescue battery-damaged systems and make the original chipset maintainable rather than disposable.","related":["a500p"],"tags":["replica","open"],"unverified":true},{"id":"aa3000","name":"AA3000+","year":2018,"category":"hw-fpga","kind":"replica","status":"active","arch":["68k"],"weight":3,"by":"community","what":"A community motherboard blending A3000 design goals with AGA-era capabilities — effectively finishing the \"AGA A3000\" branch Commodore abandoned with its A3000+ prototype.","why":"The purest example of Amiga hardware preservation shading into alternate history: not copying a Commodore board, but completing an enthusiast-imagined one.","related":["a3000","a4000"],"tags":["replica","aga","open"]},{"id":"reamiga1200","name":"ReAmiga 1200","year":2019,"category":"hw-fpga","kind":"replica","status":"active","arch":["68k"],"weight":4,"by":"John \"Chucky\" Hertell","what":"A redrawn, fabbable A1200 PCB that also fixes known Commodore bugs. The files are public and boards have been built worldwide since 2019.","why":"The s":"shipping","arch":["fpga","68k"],"weight":4,"by":"Apollo Computer","what":"Apollo's flagship complete computer: an A600-inspired wedge with a mechanical Amiga-layout keyboard, 68080, full SAGA and RTG, 2 GB fast RAM, dual SD slots, a 128 GB CF card with ApolloOS, USB-C power and digital video out. Sold in limited batches.","why":"Arguably the first brand-new 68k Amiga-compatible with a built-in keyboard since 1994 — a new machine, not a restoration.","version":"€490 ex-VAT, batch 6 Aug 2026","url":"https://www.apollo-computer.com","related":["v4sa"],"tags":["fpga","68080","saga"]},{"id":"checkmate","name":"Checkmate A1500 Plus","year":2019,"category":"hw-repair","kind":"component","status":"shipping","arch":["68k","ppc","x86"],"weight":3,"by":"Stephen Jones / iMica (UK)","what":"A modern re-issue of the classic Checkmate A1500 case, accepting A500, A600, A1200, Mini-ITX and Micro-ATX boards via modular trays. A compact A1500 Mini variant and a hand-built 19-inch 4:3 IPS retro monitor with native 15 kHz support accompany it.","why":"It gives restored, emulated and next-gen Amiga builds a shared physical design language without sacrificing original cases.","url":"https://checkmate1500plus.com","related":["a1500"],"tags":["case"]},{"id":"gvp","name":"GVP accelerator families","year":1989,"category":"hw-accel","kind":"component","status":"historic","arch":["68k"],"weight":3,"by":"Great Valley Products (US)","what":"The largest US accelerator line: the A530 Turbo sidecar (68EC030 at 40 MHz with SCSI), G-Force 030/040 for the A2000, A1230 Turbo+ for the A1200 and the TekMagic 060.","why":"GVP defined the American Amiga upgrade market and the combo card — CPU, RAM and SCSI on one board.","related":["a2000","a500"],"tags":["accelerator","scsi"]},{"id":"blizzard12xx","name":"phase5 Blizzard 12xx","year":1993,"category":"hw-accel","kind":"component","status":"historic","arch":["68k"],"weight":4,"by":"phase5 digital products (DE)","what":"The definitive A1200 trapdoor accelerators: Blizzard 1230 I–IV, 1240T/ERC and 1260, with up to 256 MB and an optional SCSI Kit IV. The Blizzard 2060 served the A2000.","why":"The gold standard of classic acceleration, and still the boards modern designs are measured against. Several redrawn Blizzard PCBs circulate today.","related":["a1200"],"tags":["accelerator","68060"]},{"id":"cyberstorm","name":"phase5 CyberStorm 040/060","year":1993,"category":"hw-accel","kind":"component","status":"historic","arch":["68k"],"weight":3,"by":"phase5 digital products","what":"A3000/A4000 CPU-slot 68040 and 68060 boards — MK-I, MK-II and MK-III, the last adding Ultra-Wide SCSI.","why":"The big-box counterpart to the Blizzard line, and the platform the CyberStorm PPC later built on.","related":["a3000","a4000"],"tags":["accelerator","68060","scsi"]},{"id":"blizzardppc","name":"phase5 BlizzardPPC","year":1997,"category":"hw-accel","kind":"component","status":"historic","arch":["68k","ppc"],"weight":4,"by":"phase5 digital products","what":"A dual-processor A1200 card placing a PowerPC 603e at 160–240 MHz alongside the existing 68040/68060, with a connector for the BVisionPPC graphics card.","why":"It created the installed base that AmigaOS 4 Classic and MorphOS 1.x would later target — and today it is among the most expensive classic Amiga hardware on the used market.","related":["blizzard12xx"],"tags":["accelerator","ppc","powerup"]},{"id":"cyberstormppc","name":"phase5 CyberStormPPC","year":1997,"category":"hw-accel","kind":"component","status":"historic","arch":["68k","ppc"],"weight":4,"by":"phase5 digital products","what":"The A3000/A4000 equivalent: a PowerPC 604e at 150–233 MHz beside a 68040/68060, with Ultra-Wide SCSI and a CyberVisionPPC connector.","why":"The most powerful classic Amiga configuration of the era, and the only way besides emulation to run AmigaOS 4.1 Classic on a real big-box Amiga.","related":["cyberstorm"],"tags":["accelerator","ppc","powerup"]},{"id":"apollo-act","name":"Apollo / ACT accelerators","year":1995,"category":"hw-accel","kind":"component","status":"historic","arch":["68k"],"weight":2,"by":"ACT Elektronik (DE)","what":"The 1990s \"Apollo\" line — 1230/1240/1260, 2030, 3040/3060, 4040/4060 — offering budget alternatives to the Blizzards. Unrelated to today's Apollo Team.","why":"A frequent source of naming confusion in the modern scene, and a reminder how crowded the 1990s accelerator market was.","related":["a1200"],"tags":["accelerator"]},{"id":"classic-accel-others","name":"M-Tec, DKB, CSA & others","year":1992,"category":"hw-accel","kind":"component","status":"historic","arch":["68k"],"weight":1,"by":"various","what":"The rest of the crowded classic field: M-Tec 68020i and E-Matrix 530, DKB Cobra and Wildfire 060, CSA Derringer and Twelve Gauge, Harms Professional 3000, Microbotics VXL-30 and M1230XA, ICD AdSpeed, Supra SupraTurbo, Kupke Golem and DCE Typhoon.","why":"Represented as a family rather than individually — a literal accelerator encyclopedia would run to hundreds of SKUs.","related":["a500","a1200"],"tags":["accelerator"]},{"id":"aca12xx","name":"ACA 12xx family","year":2010,"category":"hw-accel","kind":"component","status":"shipping","arch":["68k"],"weight":4,"by":"Individual Computers (DE)","what":"Individual Computers' A1200 trapdoor line: the ACA1234 (68030 at 25–50 MHz, 128 MB, MapROM), the flagship ACA1240 and ACA1260 (68040 or 68060 with 256 MB), plus the budget ACA1221lc and the ACA1211 RAM/IDE-speeder.","why":"The longest continuously produced modern accelerator family, and the commercial backbone of A1200 upgrading. Note: iComp stopped shipping to the USA in December 2025.","version":"ACA1240/1260 in regular sale since 2025","url":"https://icomp.de","related":["a1200"],"tags":["accelerator","68060"]},{"id":"aca620","name":"ACA620 family","year":2012,"category":"hw-accel","kind":"component","status":"historic","arch":["68k"],"weight":2,"by":"Individual Computers","what":"Individual Computers' accelerator line for the Amiga 600, since discontinued.","why":"It briefly made the A600 a credible upgrade target before Vampire and PiStorm took that role.","related":["a600"],"tags":["accelerator"]},{"id":"aca500","name":"ACA500plus","year":2013,"category":"hw-accel","kind":"component","status":"shipping","arch":["68k"],"weight":4,"by":"Individual Computers","what":"An A500 side-slot expansion: 68000 at 14/42 MHz, 8 MB fast RAM, dual CF slots for boot and auxiliary storage, a Kickstart flashing and menu system, and a slot to piggyback ACA12xx accelerators.","why":"The most complete single upgrade for an unexpanded A500 — CPU, RAM, storage and multiple Kickstarts in one board. In production since 2017.","url":"https://icomp.de","related":["a500"],"tags":["accelerator","storage","kickstart"]},{"id":"furia","name":"Furia EC020","year":2014,"category":"hw-accel","kind":"component","status":"shipping","arch":["68k"],"weight":2,"by":"Furia (PL)","what":"An A600 plug-over accelerator: 68EC020 at 33 or 40 MHz, up to 9.5 MB fast RAM and an optional FPU.","why":"The standard inexpensive A600 speed-up for over a decade, and still sold.","related":["a600"],"tags":["accelerator"]},{"id":"vampirev2","name":"Vampire V2 accelerators","year":2014,"category":"hw-accel","kind":"fpga","status":"historic","arch":["fpga","68k"],"weight":5,"by":"Apollo Computer / Apollo Team","what":"Cyclone III-class FPGA accelerators for the A600 (V600, 2016), A500 (V500, 2017) and A1200 (V1200, 2019), each with the Apollo 68080 core, 128 MB RAM, HDMI out and SAGA RTG.","why":"The boards that made the 68080 real and transformed what a classic Amiga could do. Officially end-of-support since October 2025, with core development frozen as the FPGA filled up.","version":"End-of-support 23 Oct 2025 · final core GOLD 2.18","url":"https://www.apollo-computer.com","related":["a600","a500","a1200"],"tags":["accelerator","68080","saga"]},{"id":"tf5xx","name":"TerribleFire 5xx family","year":2017,"category":"hw-accel","kind":"component","status":"shipping","arch":["68k"],"weight":4,"by":"Stephen Leary (UK) & licensed builders","what":"Open-source Verilog 68030 boards plugging into the 68000 socket of the A500, A1000, A2000 and CDTV — the TF534 and the TF536 with integrated RAM and IDE.","why":"TerribleFire proved a hobbyist could open-source a competitive accelerator design and let anyone build it, reshaping the economics of the scene.","url":"https://github.com/terriblefire","related":["a500","a2000"],"tags":["accelerator","open"]},{"id":"tf12xx","name":"TerribleFire 12xx family","year":2020,"category":"hw-accel","kind":"component","status":"shipping","arch":["68k"],"weight":4,"by":"Stephen Leary & licensed builders","what":"A1200 trapdoor accelerators: the TF1230 (68030) and the TF1260 (68060), the latter a closed design sold through authorised builders and one of the most popular modern 060 boards.","why":"It brought 68060 performance back into affordable reach for A1200 owners.","url":"https://github.com/terriblefire","related":["a1200"],"tags":["accelerator","68060"]},{"id":"tf3xxx","name":"TerribleFire 3xxx/4xxx & CD32","year":2021,"category":"hw-accel","kind":"component","status":"limited","arch":["68k"],"weight":3,"by":"Stephen Leary & builders","what":"Boards for the big boxes and console: the TF330/TF328 CD32 expansion-slot 68030 and RAM boards, the open CD32 riser adding IDE and experimental USB, and the TF4060 68060 CPU-slot board for the A4000.","why":"They made the CD32 upgradeable into a real computer, and gave A4000 owners a modern 060 option.","url":"https://github.com/terriblefire","related":["cd32","a4000","a3000"],"tags":["accelerator","open"],"unverified":true},{"id":"warp","name":"Warp accelerator family","year":2020,"category":"hw-accel","kind":"component","status":"historic","arch":["68k"],"weight":3,"by":"CS-Lab (PL)","what":"High-end 68060 boards: the Warp 1260 for the A1200 (up to ~100 MHz, 256 MB, microSD, RTC, audio codec, FastIDE), plus Warp 560 for the A500 and Warp 4060 for the A3000/A4000.","why":"The fastest 68060 boards of their moment. The line now appears dormant — the product site redirects to CS-Lab's CNC business and no distributor lists them as of 2026.","related":["a1200","a500","a4000"],"tags":["accelerator","68060"]},{"id":"wicher","name":"Wicher boards","year":2016,"category":"hw-accel","kind":"component","status":"shipping","arch":["68k"],"weight":3,"by":"RetroAmi (PL)","what":"A Polish family covering nearly every machine: the Wicher 500i 68030 trapdoor accelerator, Wicher CD32 and CDTV boards, and the 508i, 608 and 1211 RAM/IDE expansions.","why":"It fills the gap between bare RAM expansions and full accelerators, especially for the CD32 and CDTV.","related":["a500","cd32","cdtv","a600"],"tags":["accelerator","storage"]},{"id":"pistorm","name":"PiStorm","year":2020,"category":"hw-accel","kind":"component","status":"shipping","arch":["arm","68k"],"weight":5,"by":"Claude \"captain-amygdala\" & community","what":"A 68000-socket adapter carrying a Raspberry Pi, for the A500, A500+, A1000 and A2000. With the default Musashi emulator it performs like a 100–125 MHz 68030; with Emu68 it far exceeds any real 68060. It also provides RTG via the Pi GPU, virtual SCSI, RAM and networking.","why":"Open source under MIT, it collapsed the cost of a fast Amiga from hundreds to tens — the single most disruptive hardware project of the 2020s.","url":"https://github.com/captain-amygdala/pistorm","related":["a500","a2000","emu68"],"tags":["accelerator","open","rtg"]},{"id":"pistorm32","name":"PiStorm32-Lite","year":2022,"category":"hw-accel","kind":"component","status":"shipping","arch":["arm","68k"],"weight":5,"by":"community","what":"The A1200 trapdoor PiStorm for the Raspberry Pi 4 family — now the mainstream A1200 accelerator. A PiStorm16 variant serves the 16-bit-bus A600.","why":"It made an A1200 faster than any period hardware for the price of a game, and normalised the ARM-plus-real-chipset hybrid.","version":"~£79.73","url":"https://github.com/captain-amygdala/pistorm","related":["pistorm","a1200"],"tags":["accelerator","open","rtg"]},{"id":"framethrower","name":"Framethrower / FT600","year":2023,"category":"hw-gfx","kind":"component","status":"shipping","arch":["arm"],"weight":2,"by":"community","what":"RGB-capture add-ons that pipe native chipset video into the Raspberry Pi so a single HDMI cable carries both native and RTG output.","why":"It solves the PiStorm's one real awkwardness — two video paths, two cables — and makes the hybrid feel like one machine.","version":"FT600 £39.99","url":"https://retroready.one","related":["pistorm32"],"tags":["video","rtg"]},{"id":"firebird","name":"Apollo Firebird V4","year":2021,"category":"hw-accel","kind":"fpga","status":"shipping","arch":["fpga","68k"],"weight":3,"by":"Apollo Computer","what":"The V4-generation Cyclone V board for the Amiga 500, carrying the 68080 and SAGA into original A500 hardware.","why":"It brought the V4 architecture — and its much larger FPGA — to the best-selling Amiga.","version":"€399 ex-VAT","url":"https://www.apollo-computer.com","related":["vampirev2","a500"],"tags":["accelerator","68080","saga"]},{"id":"icedrake","name":"Apollo Icedrake V4","year":2021,"category":"hw-accel","kind":"fpga","status":"shipping","arch":["fpga","68k"],"weight":3,"by":"Apollo Computer","what":"The V4-generation board for the Amiga 1200.","why":"The most capable single upgrade available for an original A1200, and the V4 line's best seller.","version":"€399 ex-VAT · core build 11385","url":"https://www.apollo-computer.com","related":["vampirev2","a1200"],"tags":["accelerator","68080","saga"]},{"id":"manticore","name":"Apollo Manticore & Salamander V4","year":2024,"category":"hw-accel","kind":"fpga","status":"shipping","arch":["fpga","68k"],"weight":2,"by":"Apollo Computer","what":"V4-generation boards for the Amiga 600 (Manticore) and CD32 (Salamander).","why":"They completed the V4 line-up across nearly every classic machine.","version" ll-featured chips, which overclock past 100 MHz — while the grey market is full of re-marked EC/LC060 parts lacking MMU and FPU, sold as full 060s.","why":"A standing buyer warning for TF1260, Warp and ACA1260 purchases, and the structural reason FPGA and ARM alternatives took over.","related":["blizzard12xx"],"tags":["caution"]},{"id":"picasso","name":"Picasso II / IV","year":1993,"category":"hw-gfx","kind":"component","status":"historic","arch":["68k"],"weight":4,"by":"Village Tronic (DE)","what":"The most common classic RTG cards. Picasso II/II+ used Cirrus Logic GD542x on Zorro II; the 1996 Picasso IV added Zorro II/III autosensing, an integrated flicker-fixer and module slots for the Pablo video encoder, Paloma TV tuner and Concierto sound.","why":"For many users the Picasso IV was the single card that turned an Amiga into a usable modern workstation.","related":["a2000","a4000"],"tags":["rtg","zorro"]},{"id":"cybervision","name":"CyberVision 64 / 3D / PPC","year":1995,"category":"hw-gfx","kind":"component","status":"historic","arch":["68k","ppc"],"weight":3,"by":"phase5 digital products","what":"phase5's RTG line: CyberVision 64 (S3 Trio64), CyberVision 64/3D (S3 ViRGE with optional scandoubler and MPEG modules), and the Permedia 2-based CyberVisionPPC and BVisionPPC that attach only to the PPC accelerators.","why":"The cards that carried CyberGraphX, and the only 3D-capable option for PowerUP owners.","related":["cyberstorm","blizzardppc"],"tags":["rtg","zorro","3d"]},{"id":"classicrtg","name":"Retina, Merlin, Piccolo & other RTG","year":1992,"category":"hw-gfx","kind":"component","status":"historic","arch":["68k"],"weight":2,"by":"MacroSystem, X-Pert, Helfrich, GVP","what":"The wider classic RTG field: MacroSystem Retina Z2 and Retina BLT Z3 (and DraCo's Altais), X-Pert Merlin and Domino, Ingenieurbüro Helfrich Piccolo and Piccolo SD64, oMniBus, and GVP's EGS Spectrum.","why":"A crowded market that made retargetable graphics a normal expectation years before the PC world settled on one driver model.","related":["a2000"],"tags":["rtg","zorro"]},{"id":"mediator","name":"Mediator PCI & Prometheus","year":1999,"category":"hw-gfx","kind":"component","status":"shipping","arch":["68k"],"weight":3,"by":"Elbox (PL) / Matay (PL)","what":"PCI busboards for Zorro Amigas — Elbox Mediator (1200 TX and 4000D MK-III still sold) and Matay Prometheus — letting Voodoo 3/4/5, ViRGE and Radeon cards run as RTG under Picasso96. DCE's GRex did the same for PPC owners.","why":"They opened the vast, cheap PC graphics market to Amiga users, and enabled Warp3D-era 3D gaming.","url":"https://www.elbox.com","related":["a1200","a4000"],"tags":["rtg","pci","3d"]},{"id":"indivision","name":"Indivision ECS / AGA","year":2008,"category":"hw-gfx","kind":"component","status":"shipping","arch":["68k"],"weight":4,"by":"Individual Computers","what":"Internal flicker-fixers that tap the video chip socket: Indivision AGA MK3 for the A1200 and A4000 with VGA and digital output up to 1280×1024, and Indivision ECS V3 for OCS/ECS machines.","why":"The standard way to put a real Amiga on a modern monitor without RTG — no external box, no lag, native inside the case.","version":"AGA MK3 & ECS V3 current","url":"https://icomp.de","related":["a1200","a500"],"tags":["video","flickerfixer"]},{"id":"zz9000","name":"MNT ZZ9000","year":2019,"category":"hw-gfx","kind":"component","status":"shipping","arch":["68k","arm"],"weight":4,"by":"MNT Research (Lukas F. Hartmann, DE)","what":"An FPGA-plus-ARM Zorro II/III autosensing card: RTG to 1920×1080, gigabit Ethernet, USB, and an ARM coprocessor that can offload MP3 and video decoding. The ZZ9000AX adds 16/24-bit audio; a ZZ9000CX for native video capture is announced.","why":"The first genuinely new Zorro graphics card in twenty years, and the most capable — open hardware, still receiving firmware updates.","version":"~€390","url":"https://mntre.com","related":["a2000","a3000","a4000"],"tags":["rtg","zorro","ethernet","open"]},{"id":"rgbtohdmi","name":"RGBtoHDMI","year":2019,"category":"hw-gfx","kind":"component","status":"active","arch":["68k"],"weight":4,"by":"c0pperdragon & hoglet67","what":"A Denise-socket digital tap plus Raspberry Pi Zero firmware giving pixel-perfect, zero-lag HDMI from any 12-bit-video Amiga, in internal and external builds.","why":"Open source and inexpensive, it delivers a cleaner picture than any analogue scandoubler by never converting to analogue at all.","url":"https://github.com/c0pperdragon/Amiga-Digital-Video","related":["a500","a1200"],"tags":["video","open","hdmi"]},{"id":"scalers","name":"Scandoublers & external scalers","year":2015,"category":"hw-gfx","kind":"component","status":"shipping","arch":["68k"],"weight":2,"by":"various","what":"The wider video-out field: ScanPlus ECS/AGA internal scandoublers, the external Medusa, generic OSSC and RetroTINK line-multipliers widely used on Amiga RGB SCART, and the open GBS-Control firmware for cheap GBS-8200 upscalers.","why":"Between them they cover every budget from £20 to £700 for the single most common modern Amiga problem: getting a picture.","related":["a500"],"tags":["video"]},{"id":"toccata","name":"Toccata, Prelude & Delfina","year":1994,"category":"hw-audio","kind":"component","status":"historic","arch":["68k"],"weight":2,"by":"MacroSystem, ACT, Petsoff","what":"The classic 16-bit sound cards: MacroSystem's Toccata (Zorro II, 16-bit/48 kHz — the studio standard), ACT's Prelude and clockport Prelude 1200, and Petsoff's DSP56002-based Delfina and Delfina Lite.","why":"They lifted Amiga audio past Paula's 8-bit ceiling and were the reason AHI existed.","related":["a2000","a1200"],"tags":["audio","zorro","ahi"]},{"id":"melody","name":"Melody & MPEG audio cards","year":1996,"category":"hw-audio","kind":"component","status":"historic","arch":["68k"],"weight":1,"by":"Helfrich / Kato","what":"Melody Z2 and Melody 1200: 16-bit cards with hardware MPEG audio decoding.","why":"Early proof that a 68k Amiga could play MP3 without the CPU doing the work — the idea Prisma Megamix later perfected.","related":["a1200"],"tags":["audio","mhi"]},{"id":"prisma","name":"Prisma Megamix","year":2018,"category":"hw-audio","kind":"component","status":"limited","arch":["68k"],"weight":3,"by":"sold via AmigaKit & dealers","what":"A clockport hardware audio decoder built on a VS1063-class codec, playing MP3, FLAC and more with almost no CPU load and mixing with Paula. Supports AHI and MHI.","why":"The poster child for the MHI standard: it lets a stock-speed A1200 act as a music player. Sold in repeated batches.","url":"https://www.amigakit.com","related":["a1200","mhi"],"tags":["audio","clockport","mhi"],"unverified":true},{"id":"zz9000ax","name":"MNT ZZ9000AX","year":2021,"category":"hw-audio","kind":"component","status":"limited","arch":["68k"],"weight":2,"by":"MNT Research","what":"An audio expansion for the ZZ9000: 16/24-bit playback with an AHI driver, offloading MP3 decoding to the card's ARM resources.","why":"It completes the ZZ9000 as a single card handling graphics, network and sound.","url":"https://mntre.com","related":["zz9000"],"tags":["audio","ahi"],"unverified":true},{"id":"amigus","name":"AmiGUS","year":2025,"category":"hw-audio","kind":"component","status":"limited","arch":["68k"],"weight":2,"by":"community","what":"A new FPGA-based Zorro II sound card — streaming DAC plus wavetable, GUS-inspired — with AHI and MHI drivers, in first batches around 2025.","why":"Evidence that even the quietest corner of the hardware scene is still producing new designs.","related":["a2000"],"tags":["audio","zorro","ahi"],"unverified":true},{"id":"classicscsi","name":"Classic SCSI controllers","year":1988,"category":"hw-storage","kind":"component","status":"historic","arch":["68k"],"weight":2,"by":"Commodore & third parties","what":"Commodore's A590 sidecar, A2091 and A4091 Zorro cards and A2090; GVP's HD8+ and Series II; and third-party boards from Supra, ICD, Microbotics HardFrame, Oktagon 2008 and Fastlane Z3.","why":"They gave the Amiga fast, standard mass storage a decade before IDE arrived on the A600.","related":["a500","a2000"],"tags":["storage","scsi"]},{"id":"idecf","name":"IDE-to-CF / SD adapters","year":2000,"category":"hw-storage","kind":"component","status":"shipping","arch":["68k"],"weight":4,"by":"various","what":"Commodity CF2IDE and SD2IDE adapters — plus 44-pin DOM SSDs and mSATA-to-IDE — are the default boot solution for the A600, A1200 and A4000.","why":"Solid-state, silent, instantly backed up by pulling the card: the single cheapest and most transformative classic upgrade.","related":["a600","a1200","a4000"],"tags":["storage"]},{"id":"fastata","name":"Elbox FastATA","year":1999,"category":"hw-storage","kind":"component","status":"shipping","arch":["68k"],"weight":2,"by":"Elbox (PL)","what":"Four-device IDE speeders for the A1200 and A4000 with PIO-5 and UDMA modes, now in a CF/SATA Black Edition.","why":"It removes the crippling slowness of the stock Gayle IDE interface — still in production after 25 years.","version":"FastATA 400 MK-VII current","url":"https://www.elbox.com","related":["a1200","a4000"],"tags":["storage"]},{"id":"gotek","name":"Gotek + FlashFloppy","year":2012,"category":"hw-storage","kind":"component","status":"shipping","arch":["68k"],"weight":4,"by":"Keir Fraser (FlashFloppy)","what":"A cheap USB-stick floppy emulator running Keir Fraser's open-source FlashFloppy firmware, sold pre-flashed by most Amiga dealers. OLED and rotary-encoder mods are common.","why":"It replaces the most failure-prone part of any Amiga with a £20 device, and lets ADF collections run on real hardware.","version":"FlashFloppy v3.44 (Apr 2025)","url":"https://github.com/keirf/flashfloppy","related":["a500"],"tags":["storage","floppy","open"]},{"id":"hxc","name":"HxC2001 floppy emulators","year":2006,"category":"hw-storage","kind":"component","status":"shipping","arch":["68k"],"weight":3,"by":"Jean-François Del Nero (FR)","what":"The original floppy-emulator ecosystem — SD HxC, Slim SD, USB HxC — plus licensed HxC firmware for Gotek hardware and the Pauline forensic floppy tool. Actively maintained since 2006.","why":"It created the HFE format and the whole category Gotek later commoditised.","url":"https://hxc2001.com","related":["a500"],"tags":["storage","floppy"]},{"id":"scsi2sd","name":"SCSI2SD / ZuluSCSI / BlueSCSI","year":2010,"category":"hw-storage","kind":"component","status":"shipping","arch":["68k"],"weight":3,"by":"codesrc / Rabbit Hole / community","what":"SD-card SCSI drive and CD emulators for SCSI-equipped Amigas. The current ZuluSCSI Blaster (RP2350B) reaches 18 MB/s and can emulate a network adapter over Wi-Fi; open-source BlueSCSI v2 offers the same idea.","why":"They keep A590, A2091, A3000, A4091 and GVP systems running now that period SCSI drives are dying, and sneak Ethernet into machines that never had it.","version":"ZuluSCSI Blaster (2025)","url":"https://zuluscsi.com","related":["classicscsi","a3000"],"tags":["storage","scsi","network"]},{"id":"ripple","name":"RIPPLE IDE & lide.device","year":2023,"category":"hw-storage","kind":"component","status":"shipping","arch":["68k"],"weight":3,"by":"Matt Harlum (LIV2)","what":"An open IDE stack: the RIPPLE Zorro II IDE controller for the A2000, A3000 and A4000 with autoboot from Kickstart 1.3, 2 TB support, ATAPI and CD boot — plus the open lide.device driver used by several community IDE cards.","why":"It finally gave the big boxes modern, large, bootable IDE storage, and removed even the 2 TB limit.","version":"RIPPLE Rev A5 (Sep 2025) · lide.device 40.11 (Jan 2026)","url":"https://github.com/LIV2/RIPPLE-IDE","related":["a2000","a3000","a4000"],"tags":["storage","open"]},{"id":"buddha","name":"Buddha IDE","year":2017,"category":"hw-storage","kind":"component","status":"shipping","arch":["68k"],"weight":2,"by":"Individual Computers","what":"Zorro II IDE controllers: the original re-released in 2017 and the redesigned Buddha Plus One from 2023, still receiving firmware updates.","why":"The commercial, supported counterpart to RIPPLE for Zorro machines.","version":"Buddha Plus One · firmware Jul 2026","url":"https://icomp.de","related":["a2000"],"tags":["storage"]},{"id":"sdbox","name":"SDBox & parallel-port storage","year":2020,"category":"hw-storage","kind":"component","status":"limited","arch":["68k"],"weight":1,"by":"community","what":"A parallel-port SD-card reader with an spisd.device driver, for machines with no other expansion available.","why":"It gives even a completely unexpanded A500 a route to modern storage.","related":["a500"],"tags":["storage","open"],"unverified":true},{"id":"xsurf","name":"X-Surf / X-Surf 100","year":1999,"category":"hw-io","kind":"component","status":"shipping","arch":["68k"],"weight":3,"by":"Individual Computers","what":"Zorro II/III autosensing 100 Mbit Ethernet cards, with an option to piggyback a RapidRoad USB module.","why":"The de-facto big-box network card, and still sold — the simplest way to get a classic Amiga online.","url":"https://icomp.de","related":["a2000","a3000","a4000"],"tags":["network","zorro"]},{"id":"plipbox","name":"plipbox","year":2012,"category":"hw-io","kind":"component","status":"active","arch":["68k"],"weight":2,"by":"Christian Vogelgsang","what":"An open-source Arduino parallel-port-to-Ethernet bridge for machines with no expansion slots.","why":"It puts the cheapest possible Amiga on a network using a £5 microcontroller.","url":"https://github.com/cnvogelg/plipbox","related":["a500"],"tags":["network","open"]},{"id":"pcmcia-net","name":"PCMCIA Ethernet & Wi-Fi","year":1999,"category":"hw-io","kind":"component","status":"shipping","arch":["68k"],"weight":3,"by":"various + Neil Cafferkey (drivers)","what":"CF-format and 16-bit NE2000 or 3Com cards on the A600 and A1200 via cnet.device, and Prism2/2.5 Wi-Fi cards driven by Neil Cafferkey's prism2.device — WPA supported, WPA2 limited. Dealers sell pre-configured cards.","why":"The only wireless option for stock A600 and A1200 machines, and the reason the PCMCIA slot still matters.","related":["a600","a1200"],"tags":["network","wifi","pcmcia"]},{"id":"rapidroad","name":"RapidRoad USB","year":2014,"category":"hw-io","kind":"component","status":"shipping","arch":["68k"],"weight":3,"by":"Individual Computers","what":"High-speed USB for the A1200 clockport or as an X-Surf 100 piggyback, running the Poseidon stack.","why":"The most widely available modern USB option for classic Amigas.","url":"https://icomp.de","related":["a1200","poseidon"],"tags":["usb","clockport"]},{"id":"e3b-usb","name":"Deneb, Subway & Algor","year":2003,"category":"hw-io","kind":"component","status":"limited","arch":["68k"],"weight":2,"by":"E3B (DE)","what":"E3B's USB hardware: the Zorro II/III Deneb with USB 2.0 and flash ROM, the clockport Subway for the A1200, and the newer announced Algor. Produced in occasional small batches.","why":"Deneb remains the fastest USB option for Zorro machines, and the one that could boot from USB.","url":"http://www.e3b.de","related":["a2000","a1200","poseidon"],"tags":["usb","zorro"],"unverified":true},{"id":"a314","name":"A314","year":2019,"category":"hw-io","kind":"component","status":"active","arch":["arm","68k"],"weight":3,"by":"Niklas Ekström & community","what":"A Raspberry Pi used as a *coprocessor* rather than a CPU replacement, in trapdoor (A500), A314-600, A314-1000 and clockport variants. A shared-RAM link provides file systems, networking, remote display and audio streaming.","why":"A genuinely different idea from PiStorm: keep the 68000 in charge and let the Pi be a service processor. Open source and still active.","url":"https://github.com/niklasekstrom/a314","related":["a500","a600"],"tags":["network","open","coprocessor"]},{"id":"mouster","name":"mouSTer","year":2019,"category":"hw-io","kind":"component","status":"limited","arch":["68k"],"weight":2,"by":"retrohax.net (PL)","what":"A USB-to-DB9 adapter emulating Amiga and Atari mice, joysticks and wheel modes, with firmware updates. Project update posted June 2026.","why":"It lets a modern optical mouse work on an original Amiga — solving one of the worst daily-use annoyances.","version":"132 zł, currently sold out","url":"https://retrohax.net","related":["a500"],"tags":["input"]},{"id":"tankmouse","name":"Tank mouse & controller remakes","year":2022,"category":"hw-io","kind":"component","status":"shipping","arch":["68k"],"weight":2,"by":"AmigaKit, RetroRadionics & others","what":"Injection-moulded remakes of the classic tank mouse (later wireless and optical versions), optical conversion kits for original mice, CD32-compatible pads, ArcadeR DB9 sticks — and a licensed TAC-2 reissue announced in August 2026.","why":"New-manufacture input devices mean the whole experience, not just the computer, can be restored.","related":["a500","cd32"],"tags":["input"]},{"id":"keyrah","name":"Keyrah & AmiKey","year":2010,"category":"hw-io","kind":"component","status":"shipping","arch":["68k","x86"],"weight":2,"by":"Individual Computers / AmigaKit","what":"Keyrah V3 turns original Amiga and C64 keyboards and joysticks into USB devices for PCs and emulation; AmigaKit's AmiKey does the reverse, attaching USB keyboards to original A600 and A1200 machines.","why":"Two halves of the same idea: the feel of original hardware, wherever the computing actually happens.","url":"https://icomp.de","related":["a500"],"tags":["input"]},{"id":"clockport","name":"The A1200 clockport","year":1992,"category":"hw-io","kind":"concept","status":"active","arch":["68k"],"weight":2,"by":"—","what":"A small, cheap internal expansion header intended for a real-time clock, which the community turned into a universal peripheral bus: RapidRoad, Subway, Prisma Megamix, Delfina Lite, Melody 1200, A314-cp — and four-way expanders when one is not enough.","why":"An accidental standard: the most-used expansion interface on the most-used Amiga, for a purpose Commodore never intended
