.","related":["a1200"],"tags":["clockport","concept"]},{"id":"diagrom","name":"DiagROM","year":2013,"category":"hw-repair","kind":"component","status":"active","arch":["68k"],"weight":3,"by":"John \"Chucky\" Hertell","what":"A ROM-based hardware diagnostic that boots on a machine too broken to run anything else, testing CPU, RAM, chipset and ports and reporting over serial. V2.0 was a major rewrite.","why":"The indispensable first tool of Amiga repair — free, and the reason thousands of dead boards were fixed rather than scrapped.","version":"V2.0 stable, 20 Mar 2026","url":"https://www.diagrom.com","related":["a500"],"tags":["repair","diagnostic","open"]},{"id":"amigatestkit","name":"Amiga Test Kit","year":2015,"category":"hw-repair","kind":"component","status":"active","arch":["68k"],"weight":2,"by":"Keir Fraser","what":"A disk-loadable test suite for memory, chipset, drives, ports and video, including CRT test cards.","why":"The companion to DiagROM for machines that do boot — the standard post-repair verification step.","version":"v1.21","url":"https://github.com/keirf/amiga-stuff","related":["a500"],"tags":["repair","diagnostic","open"]},{"id":"kicksmash","name":"KickSmash32","year":2024,"category":"hw-repair","kind":"component","status":"active","arch":["68k"],"weight":2,"by":"Chris Hooper","what":"An open-source Kickstart flash module for the A1200, A3000, A4000 and A4000TX: eight switchable ROM banks, in-system flashing, and USB-C file services (smash and smashftp).","why":"It makes swapping Kickstart versions a menu choice, and doubles as a file-transfer route needing no network at all.","url":"https://github.com/cdhooper/kicksmash32","related":["a1200","a4000"],"tags":["kickstart","open"]},{"id":"megachip","name":"MegAChip & chip-RAM expansion","year":1992,"category":"hw-repair","kind":"component","status":"shipping","arch":["68k"],"weight":2,"by":"DKB, remade by iComp / LIV2","what":"DKB's classic 2 MB chip-RAM board for the A500 and A2000, remade and sold for years by Individual Computers, plus LIV2's open adapter retrofitting a 2 MB Agnus into 1 MB boards.","why":"Chip RAM is the hardest classic limit to raise, and these are the only ways to raise it.","related":["a500","a2000"],"tags":["memory"]},{"id":"fastram","name":"ZorRAM & fast-memory boards","year":2010,"category":"hw-repair","kind":"component","status":"shipping","arch":["68k"],"weight":2,"by":"AmigaKit, iComp, LIV2, RetroAmi","what":"Autoconfig fast RAM without a CPU upgrade: LIV2's open GottaGoFastRAM (8 MB for the A500, A1000, A2000 and CDTV), trapdoor boards like the A608mini and A1208 V3, ZRAM 8 and AmigaKit's ZORRAM, and iComp's 256 MB BigRamPlus for Zorro III.","why":"RAM is what most 68k software actually wants, and these deliver it far more cheaply than an accelerator.","url":"https://github.com/LIV2/GottaGoFastRAM","related":["a500","a600","a1200","a2000"],"tags":["memory"]},{"id":"chipreplace","name":"Custom-chip replacements","year":2020,"category":"hw-repair","kind":"concept","status":"limited","arch":["68k","fpga"],"weight":2,"by":"community","what":"Drop-in FPGA and CPLD re-implementations of Agnus, Denise, Paula and the 8520 CIA have all been demonstrated — leveraging the open Minimig cores — but none is in volume production as of 2026. Gary substitutes exist; Gayle, Akiko, Ramsey and Super Buster rev 11 have no replacements at all, so repairers still rely on donor boards.","why":"The one remaining gap in Amiga sustainability: every other part can now be remade, but the custom chips are still finite.","related":["minimig","a500"],"tags":["repair","caution"],"unverified":true},{"id":"recap","name":"Recapping & battery removal","year":2015,"category":"hw-repair","kind":"concept","status":"active","arch":["68k"],"weight":3,"by":"—","what":"Every A600, A1200, A4000, CD32 and CDTV needs surface-mount recapping, and every A500+, A2000, A3000 and A4000 needs its Varta or barrel battery removed before it destroys the board. Polymer and MLCC kits are stocked by all major dealers.","why":"Repair item number one, and the single most common reason a stored Amiga no longer works. Treated by the community as mandatory maintenance, not restoration.","related":["a600","a1200"],"tags":["repair","caution"]},{"id":"cases","name":"New cases & keyboards","year":2019,"category":"hw-repair","kind":"component","status":"shipping","arch":["68k"],"weight":3,"by":"A1200.net / Amiga Factory (Philippe Lang)","what":"New injection-moulded A1200 cases in several colours including translucent, new A500 cases, A600 tooling in polling, plus a new mechanical Amiga keyboard with a modular expansion bay and fresh keycap sets in many national layouts.","why":"It closes the loop on complete new-build Amigas: with a ReAmiga board, a new case, a new keyboard and a modern PSU, nothing in the machine need be 30 years old except the custom chips.","url":"https://www.a1200.net","related":["a1200","reamiga1200"],"tags":["case","keyboard"]},{"id":"psu","name":"Modern power supplies","year":2018,"category":"hw-repair","kind":"component","status":"shipping","arch":["68k"],"weight":3,"by":"iComp (CA-PSU), Keelog, Electroware","what":"Modern high-efficiency replacements with correct connectors: iComp's CA-PSU, Keelog's newly manufactured square bricks, Polish-made units, and DIY builds around Mean Well modules using open PCBs.","why":"Original 30-year-old bricks are considered board-killers when their regulation drifts. Replacing the PSU is the cheapest insurance an Amiga owner can buy.","url":"https://icomp.de","related":["a500"],"tags":["power","caution"]},{"id":"amigaexplorer","name":"File-transfer bridges","year":2000,"category":"hw-io","kind":"concept","status":"active","arch":["68k","x86"],"weight":2,"by":"Cloanto & community","what":"Ways to move files without a network: Cloanto's Amiga Explorer over null-modem serial or TCP, plain null-modem with Term or NComm, Greaseweazle and Gotek sneakernet, PCMCIA CF cards, and KickSmash32's USB-C file services.","why":"The unglamorous problem every returning Amiga owner hits first, and the half-dozen answers the community settled on.","url":"https://www.amigaforever.com/ae/","related":["a500"],"tags":["transfer"]},{"id":"os1x","name":"AmigaOS / Workbench 1.x","year":1985,"category":"os","kind":"os","status":"historic","arch":["68k"],"weight":5,"by":"Commodore-Amiga","what":"The launch operating system: pre-emptive multitasking with a windowing GUI on 256 KB, built partly on the TRIPOS heritage in BCPL. 1.3 (1988) added the FastFileSystem with hard-disk autobooting and the recoverable RAM disk.","why":"It did in 1985 what mainstream desktop systems would not manage for years. The blue-and-orange palette was chosen for contrast on a television set.","version":"1.0–1.3 (Kickstart V30–34)","image":"images/os1x.jpg","imageCredit":"Photo: Morn, CC0 (Wikimedia Commons)","related":["a1000"],"tags":["classic","workbench"]},{"id":"amix","name":"Amiga UNIX (AMIX)","year":1991,"category":"os","kind":"os","status":"historic","arch":["68k"],"weight":2,"by":"Commodore","what":"Commodore's full AT&T System V Release 4 port for the A2500UX and A3000UX, with X11 and Open Look.","why":"One of the earliest commercial SVR4 ports anywhere — killed by workstation pricing, thin application support and Commodore's decline.","url":"https://www.amigaunix.com","related":["a3000"],"tags":["unix"]},{"id":"os2x","name":"AmigaOS 2.x","year":1990,"category":"os","kind":"os","status":"historic","arch":["68k"],"weight":4,"by":"Commodore-Amiga","what":"A complete visual and architectural modernisation debuting with the A3000: the 3D-look GUI, the GadTools and BOOPSI widget frameworks, public screens, Commodities, the Installer, and AmigaDOS rewritten from BCPL into C. 2.1 added Locale, AmigaGuide and CrossDOS.","why":"It established the API surface that every later Amiga-like system — AmigaOS 4, MorphOS, AROS — still implements.","version":"2.0–2.1 (Kickstart V36–38)","related":["os1x","a3000"],"tags":["classic","workbench"]},{"id":"os3x","name":"AmigaOS 3.0 / 3.1","year":1992,"category":"os","kind":"os","status":"historic","arch":["68k"],"weight":5,"by":"Commodore-Amiga","what":"Shipped with the AGA machines: datatypes (system-wide file-format plugins), localised Workbench and CD-ROM foundations. 3.1 (1994) was Commodore's last release and was re-issued by Amiga Technologies in 1996.","why":"For nearly 25 years, 3.1 *was* the compatibility standard — the baseline every 68k application, game and pack assumed.","version":"3.1 (Kickstart V40)","image":"images/os3x.jpg","imageCredit":"Screenshot: Chiffre01, CC BY-SA 4.0 (Wikimedia Commons)","related":["os2x","a1200"],"tags":["classic","workbench"]},{"id":"linuxm68k","name":"Linux/m68k on Amiga","year":1993,"category":"os","kind":"os","status":"limited","arch":["68k"],"weight":2,"by":"Debian & kernel community","what":"Linux on 68k Amigas: an official Debian release architecture from 2.0 (1998) through 3.1 (2005), dropped from official Debian with 4.0, and still alive as an unofficial debian-ports architecture with modern kernels.","why":"It still works — on accelerated, PiStorm or emulated machines — making the Amiga one of the longest-supported Linux platforms ever.","url":"https://www.debian.org/ports/m68k/","related":["a3000","a4000"],"tags":["unix","open"]},{"id":"netbsd","name":"NetBSD/amiga","year":1994,"category":"os","kind":"os","status":"active","arch":["68k"],"weight":2,"by":"The NetBSD Foundation","what":"A maintained tier-2 port running on any Amiga with a 68020 or better and an MMU, including the 68060 and DraCo. A minimal NetBSD/amigappc also exists.","why":"Still receiving current releases in 2026 — the most actively maintained Unix for classic Amiga hardware. OpenBSD's Amiga port died in 2002.","version":"NetBSD 11.0","url":"https://www.netbsd.org/ports/amiga/","related":["a3000","a4000","draco"],"tags":["unix","open"]},{"id":"aros","name":"AROS Research Operating System","year":1995,"category":"os","kind":"amigalike","status":"active","arch":["x86","arm","68k","riscv"],"weight":5,"by":"volunteer community","what":"An open-source re-implementation of the AmigaOS 3.1 APIs — like Wine rather than an emulator — running native on bare hardware or hosted under Linux, Windows and macOS, with the Wanderer desktop and the Zune MUI clone. Licensed under the AROS Public License.","why":"The only Amiga-like system that is free, open and multi-architecture. Activity is high: roughly 2,000 commits a year, IPv6, USB 3, an AArch64 Raspberry Pi port, and a RISC-V port with stable nightlies from August 2026.","version":"rolling · ABIv11 20250418 +U3 (Feb 2026)","url":"https://www.aros.org","related":["os3x"],"tags":["open","free"]},{"id":"pos","name":"pOS","year":1997,"category":"os","kind":"amigalike","status":"historic","arch":["68k"],"weight":1,"by":"proDAD (DE)","what":"A portable, API-compatible AmigaOS clone shipped as a 68k beta with demo applications, with PowerPC and x86 ports planned. Abandoned by about 1998.","why":"The first attempt at what AROS eventually achieved — and a casualty of the post-Commodore market collapse.","related":["os3x"],"tags":["closed"]},{"id":"powerup","name":"PowerUP / WarpOS","year":1997,"category":"os","kind":"os","status":"historic","arch":["ppc","68k"],"weight":3,"by":"phase5 / Haage & Partner","what":"The two rival PowerPC kernels for phase5's dual-processor cards: phase5's PowerUP (ppc.library, Ralph Schmidt) and Haage & Partner's WarpUP/WarpOS (Sam Jordan) — incompatible executable formats and context-switching schemes competing on the same boards.","why":"The \"PPC kernel war\" split a tiny market. WarpOS won most commercial games; PowerUP's lineage led directly to MorphOS, whose ABox still runs both formats today.","url":"https://powerup.amigaworld.de","related":["blizzardppc","cyberstormppc"],"tags":["ppc","kernel"]},{"id":"os35","name":"AmigaOS 3.5","year":1999,"category":"os","kind":"os","status":"historic","arch":["68k"],"weight":3,"by":"Haage & Partner (licensed)","what":"A software-only update requiring a 68020, 3.1 ROMs and a hard disk. It added the ReAction GUI toolkit, the GlowIcons set, support for hard disks over 4 GB, a CD filesystem and bundled internet software.","why":"The first sign that AmigaOS development could continue commercially after Commodore — and the release that introduced ReAction, still the official toolkit today.","version":"V44 (software-only)","related":["os3x"],"tags":["classic","reaction"]},{"id":"amigade","name":"Amiga DE / Amiga Anywhere","year":2000,"category":"os","kind":"other","status":"historic","arch":["other"],"weight":2,"by":"Amiga Inc. / Tao Group","what":"Amiga Inc.'s \"digital environment\" built on Tao Group's intent and Elate portable VM: write once, translate binaries at install time to any CPU. An SDK and a player with small commercial games appeared for Windows and PocketPC.","why":"It had no connection to real AmigaOS code, and evaporated when Tao Group collapsed in 2007 — the clearest example of the brand being pointed away from its own technology.","tags":["closed"]},{"id":"os39","name":"AmigaOS 3.9","year":2000,"category":"os","kind":"os","status":"historic","arch":["68k"],"weight":3,"by":"Haage & Partner (licensed)","what":"Added AmiDock, unified archive handling via XAD, a file finder, a media player and an improved Shell, followed by two official \"BoingBag\" update packs.","why":"The end of the Haage & Partner line and, for eighteen years, the most advanced classic AmigaOS available. Still the base of many community distributions.","version":"V45 + BoingBags 1–2","related":["os35"],"tags":["classic","amidock"]},{"id":"morphos1","name":"MorphOS 1.x","year":2000,"category":"os","kind":"amigalike","status":"historic","arch":["ppc"],"weight":4,"by":"MorphOS Team","what":"Begun in 1999 by Ralph Schmidt and colleagues from the phase5 world, first running on PowerUP accelerator cards and then bundled with the Pegasos. Architecture: the proprietary Quark microkernel supervising the ABox, a PPC-native AmigaOS API clone binary-compatible with 68k applications via the Trance JIT and with both PowerUP and WarpOS executables.","why":"It made the \"blue\" PowerPC branch real, and its ABox remains the most compatible Amiga runtime ever built.","url":"https://www.morphos-team.net","related":["powerup","peg1"],"tags":["ppc","quark"]},{"id":"amithlon","name":"Amithlon","year":2001,"category":"os","kind":"oslike","status":"historic","arch":["x86"],"weight":3,"by":"Bernd Meyer / Haage & Partner","what":"An audacious \"AmigaOS on x86\": a stripped Linux kernel booting straight into a highly optimised JIT 68k emulator running an almost unmodified AmigaOS 3.9. On period Athlons it was by far the fastest Amiga ever sold.","why":"It proved the AmigaOS experience was separable from 68k silicon years before anyone else managed it — then died in a three-way licensing dispute in 2002–03.","related":["os39"],"tags":["x86","jit"]},{"id":"amigaosxl","name":"AmigaOS XL / AmigaXL","year":2001,"category":"os","kind":"oslike","status":"historic","arch":["x86"],"weight":2,"by":"Haage & Partner","what":"The other half of the AmigaOS XL box: AmigaOS 3.9 running hosted on QNX 6 on x86, using QNX for hardware drivers.","why":"Technically interesting, commercially stillborn — and a reminder that Amiga Inc. had itself announced QNX as the next-generation foundation in 1998.","related":["os39"],"tags":["x86","qnx"]},{"id":"os40","name":"AmigaOS 4.0","year":2004,"category":"os","kind":"os","status":"historic","arch":["ppc"],"weight":4,"by":"Hyperion Entertainment (BE)","what":"The PowerPC-native continuation of the official line, developed under Hyperion's 2001 contract with Amiga Inc. It introduced the ExecSG kernel — licensed from its authors, the Frieden brothers — and the Petunia JIT that runs 68k applications at native speed.","why":"The first genuinely new official AmigaOS in a decade, and the release that made \"AmigaOS\" a living product name again.","version":"Developer pre-release 2004 · Final Dec 2006","url":"https://www.hyperion-entertainment.com","related":["os39","a1se"],"tags":["ppc","os4","execsg"]},{"id":"aros68k","name":"AROS 68k","year":2007,"category":"os","kind":"amigalike","status":"active","arch":["68k"],"weight":4,"by":"AROS community","what":"A from-source 68k build of AROS providing a free, redistributable replacement Kickstart ROM and Workbench for real Amigas, emulators and FPGA cores.","why":"The only legal no-licence route to a booting Amiga — which is why UAE, MiSTer, Vampire and PiStorm setups all ship it as their default fallback. Compatibility is good but not equal to a real Kickstart.","url":"https://www.aros.org","related":["aros"],"tags":["open","free","kickstart"]},{"id":"morphos2","name":"MorphOS 2.x","year":2008,"category":"os","kind":"amigalike","status":"historic","arch":["ppc"],"weight":4,"by":"MorphOS Team","what":"The commercial standalone release, adding Efika support and a native TCP/IP stack — and then, from 2.4 onward, the celebrated second life on Apple hardware beginning with the Mac mini G4 and eMac.","why":"Supporting used Macs was the decision that saved MorphOS: cheap, plentiful, repairable hardware for a system whose purpose-built boards were rare.","url":"https://www.morphos-team.net","related":["morphos1"],"tags":["ppc","apple"]},{"id":"morphos3","name":"MorphOS 3.x","year":2012,"category":"os","kind":"amigalike","status":"active","arch":["ppc"],"weight":5,"by":"MorphOS Team","what":"The long 3.x line: PowerBook G4 and many more PPC Macs, then in 3.10 (2018) the AmigaOne X5000 and ACube Sam460, followed by steady modernisation through 3.11–3.19.","why":"It turned MorphOS into the most polished Amiga-like desktop in daily use, with genuinely modern applications — above all the Wayfarer browser.","url":"https://www.morphos-team.net","image":"images/morphos3.jpg","imageCredit":"Screenshot: Xorxos, public domain (Wikimedia Commons)","related":["morphos2"],"tags":["ppc","apple"]},{"id":"os41fe","name":"AmigaOS 4.1 Final Edition","year":2014,"category":"os","kind":"os","status":"shipping","arch":["ppc"],"weight":5,"by":"Hyperion Entertainment","what":"The mature AmigaOS 4 line: hardware-compositing GUI, JXFS, memory paging, a unified graphics library and support for over 2 GB of RAM. Update 2 (2020) touched 200+ components; Update 3 (October 2025) brought 60+ new features, ~70 updated components, 135+ fixes, 4K display support and a new USB stack. A refreshed SDK followed in June 2026.","why":"The official AmigaOS as it stands today, on Classic PPC, AmigaOne, Pegasos II, Sam and X5000 hardware, the A1222 Plus, and under QEMU. AmigaOS 4.2 is announced but unreleased.","version":"FE Update 3, 18 Oct 2025","url":"https://www.hyperion-entertainment.com","image":"images/os41fe.jpg","imageCredit":"Screenshot: Blake Patterson, CC BY 2.0 (Wikimedia Commons)","related":["os40"],"tags":["ppc","os4","execsg"]},{"id":"os314","name":"AmigaOS 3.1.4","year":2018,"category":"os","kind":"os","status":"shipping","arch":["68k"],"weight":4,"by":"Hyperion Entertainment","what":"The revival of classic 68k development after 24 years — forked from 3.1 rather than 3.9 for licensing reasons. Support for the whole 680x0 line to the 68060, large hard disks including at boot, a modernised Workbench, and crucially new physical Kickstart ROMs.","why":"It proved there was still a paying market for classic AmigaOS, and it put newly manufactured Kickstart chips back on dealers' shelves.","version":"3.1.4.1 (2019) · Kickstart V46","url":"https://www.hyperion-entertainment.com","related":["os3x"],"tags":["classic","kickstart"]},{"id":"apolloos","name":"ApolloOS","year":2020,"category":"os","kind":"amigalike","status":"active","arch":["68k","fpga"],"weight":3,"by":"Apollo Team","what":"A fork of AROS 68k optimised for the Apollo 68080 and SAGA chipset, with AMMX acceleration, USB and Ethernet support. Ships preinstalled on the CF cards supplied with V4 hardware.","why":"It gives Vampire and A6000 owners a complete, legal, no-licence-required system out of the box — the answer to the ROM problem that dogged earlier Vampire boards.","version":"R9.5","url":"https://apollo-computer.com/apolloos.php","related":["aros68k","v4sa"],"tags":["68080","saga","open"]},{"id":"os32","name":"AmigaOS 3.2","year":2021,"category":"os","kind":"os","status":"shipping","arch":["68k"],"weight":5,"by":"Hyperion Entertainment","what":"Over 100 new features: integrated ReAction, Workbench management of ADF images, a context-sensitive Help system, improved datatypes, a better Shell and Kickstart 3.2 (V47) ROMs for every model. Point releases ran to 3.2.3 in April 2025, with updates free to registered owners; digital download since March 2026.","why":"The current classic AmigaOS, and the most capable 68k system ever released. AmigaOS 3.3 is in development — but Hyperion's 68k licence expires at the end of 2027, after which stewardship passes to Amiga Corporation.","version":"3.2.3 (Apr 2025) · €44.95 digital","url":"https://www.hyperion-entertainment.com","related":["os314"],"tags":["classic","kickstart","reaction"]},{"id":"morphos320","name":"MorphOS 3.20","year":2026,"category":"os","kind":"amigalike","status":"shipping","arch":["ppc"],"weight":5,"by":"MorphOS Team","what":"The current MorphOS: support for the new Mirari T1042 platform with dedicated drivers and thermal management, expanded Radeon support with better HDMI/DVI/DisplayPort handling, the SFS2 filesystem (files over 4 GB, partitions to 2 TB), Ambient improvements and new bundled tools. A matching SDK with GCC 15.2 shipped alongside.","why":"A fully functional free demo that merely slows after 30 minutes has made MorphOS the easiest next-gen system to actually try. Supporting brand-new hardware in 2026 signals continued PowerPC commitment; an x86-64 port remains discussed but unreleased.","version":"30 May 2026 · €79 per machine","url":"https://www.morphos-team.net","image":"images/morphos320.jpg","imageCredit":"Screenshot: MorphOS team, GPL (Wikimedia Commons)","related":["morphos3","mirari"],"tags":["ppc","apple"]},{"id":"emu68","name":"Emu68","year":2020,"category":"os","kind":"other","status":"active","arch":["arm","68k"],"weight":4,"by":"Michal Schulz","what":"A bare-metal 68040-plus-FPU JIT translator for ARM. A Raspberry Pi on a PiStorm board boots directly into a translated 68k environment running real AmigaOS 3.x with no Linux underneath — with 4-way JIT caching, PiStorm16 support and early PowerPC translation work.","why":"Effectively the fastest 68k Amiga ever made, and the software half of PiStorm's disruption. It also exposes the Pi's Wi-Fi to AmigaOS as a SANA-II device.","version":"1.0.7 stable · 1.1 alphas","url":"https://github.com/michalsc/Emu68","related":["pistorm"],"tags":["jit","open"]},{"id":"friendos","name":"FriendOS","year":2016,"category":"os","kind":"other","status":"historic","arch":["web"],"weight":1,"by":"Friend Software Labs (Hogne Titlestad, NO)","what":"A browser-based \"cloud OS\" from an Amiga-scene veteran, open-sourced as FriendUP. The commercial operation appears defunct, though the repositories remain.","why":"The best-known AmigaOS-*inspired* system that is not an Amiga system at all.","tags":["web"],"unverified":true},{"id":"amigados","name":"AmigaDOS","year":1985,"category":"shell","kind":"shell","status":"historic","arch":["68k"],"weight":4,"by":"Commodore-Amiga / MetaComCo","what":"The DOS layer — filesystems, processes, the command set — derived from MetaComCo's TRIPOS and originally written in BCPL. Its BPTR oddities survived until AmigaOS 2.0 rewrote DOS in C; OS 4.0 finally dropped the BCPL legacy.","why":"Assigns, logical device names, and pluggable handlers like RAM:, CON: and PIPE: gave the Amiga a filesystem model that still feels modern.","related":["os1x"],"tags":["dos","classic"]},{"id":"amigashell","name":"CLI / AmigaShell","year":1985,"category":"shell","kind":"shell","status":"historic","arch":["68k"],"weight":3,"by":"Commodore-Amiga","what":"The command-line environment — CLI in 1.x, renamed AmigaShell from 2.0 — with its own console handler, scripting, redirection and full multitasking.","why":"The substrate every shell replacement extends or replaces, and the reason serious Amiga work was never confined to icons.","related":["amigados"],"tags":["dos","classic"]},{"id":"workbench","name":"Workbench","year":1985,"category":"shell","kind":"shell","status":"shipping","arch":["68k"],"weight":5,"by":"Commodore-Amiga, later Hyperion","what":"The desktop and graphical file manager, presenting disks, drawers and tools as icons backed by .info files — scriptable, extensible and famously lean. It can display multiple draggable screens at different resolutions and depths simultaneously.","why":"The interface the whole platform is remembered by. From AmigaOS 3.5 onward \"AmigaOS\" names the system and \"Workbench\" only the desktop.","related":["os1x"],"tags":["desktop","classic"]},{"id":"wshell","name":"WShell","year":1988,"category":"shell","kind":"shell","status":"historic","arch":["68k"],"weight":2,"by":"William S. Hawes","what":"A commercial replacement shell from the author of ARexx and ConMan: command history, aliases, filename completion, scripting conveniences and a better console.","why":"The Amiga's open console and process design encouraged Unix-like shell experimentation remarkably early — WShell in 1988 predates most of what PC users had.","related":["amigashell"],"tags":["shell"]},{"id":"dopus4","name":"Directory Opus 4","year":1990,"category":"shell","kind":"shell","status":"active","arch":["68k"],"weight":4,"by":"Jonathan Potter / GPSoftware","what":"The classic lister-based dual-pane file manager whose configurable buttons and filetypes became the power-user standard. GPSoftware released the source under the GPL in 2000, enabling community builds and a MorphOS port.","why":"So central to Amiga workflow that opening the source kept it alive for another twenty-five years.","related":["workbench"],"tags":["filemanager","open"]},{"id":"zshell","name":"ZShell","year":1990,"category":"shell","kind":"shell","status":"historic","arch":["68k"],"weight":1,"by":"community","what":"A compact third-party shell known for command-line editing, history and a very small memory footprint. Unrelated to Unix zsh.","why":"It exemplifies the many lightweight userland replacements distributed through Aminet and the disk-magazine scene.","related":["amigashell"],"tags":["shell"]},{"id":"vinced","name":"ViNCEd","year":1991,"category":"shell","kind":"shell","status":"active","arch":["68k"],"weight":3,"by":"Thomas \"ThoR\" Richter","what":"A full vi-like console and shell replacement with tab expansion, review buffers and extensive editing — and the default console of AmigaOS 3.9. Still actively maintained after 34 years.","why":"One of the longest continuously developed pieces of Amiga software in existence.","version":"3.109 (Nov 2025)","related":["amigashell"],"tags":["shell","console"]},{"id":"mui","name":"Magic User Interface (MUI)","year":1992,"category":"shell","kind":"toolkit","status":"active","arch":["68k","ppc","x86"],"weight":5,"by":"Stefan Stuntz, now Böckelmann & Maus","what":"The object-oriented GUI toolkit that became the dominant third-party framework on classic Amiga and the *native* toolkit of MorphOS — font-adaptive, user-configurable layouts with per-application preferences.","why":"MUI let users restyle every application at once, decades before theming was normal. Most serious modern Amiga software is a MUI application.","version":"MUI 5.0-20210831 + nightlies","url":"https://muidev.de","related":["workbench"],"tags":["toolkit"]},{"id":"magicwb","name":"MagicWB, NewIcons & GlowIcons","year":1992,"category":"shell","kind":"toolkit","status":"historic","arch":["68k"],"weight":4,"by":"Martin Huttenloher, Nicola Salmoria, Matt Chaput","what":"The three icon aesthetics that defined the Amiga desktop: Huttenloher's 8-colour MagicWB grey 3D look (1993–96), Salmoria's palette-independent NewIcons, and Chaput's 256-colour two-state GlowIcons introduced with AmigaOS 3.5 and still stock today.","why":"MagicWB in particular is the visual base every modern enhancement pack still emulates — an aesthetic set by a shareware author, not a vendor.","related":["workbench"],"tags":["icons","theme"]},{"id":"kingcon","name":"KingCON","year":1993,"category":"shell","kind":"shell","status":"historic","arch":["68k"],"weight":2,"by":"David Larsson","what":"A drop-in CON: and RAW: console replacement with filename tab-completion, a review buffer and menus.","why":"Thirty years on it is still bundled by nearly every enhancement pack — a two-decade-old binary that nobody has needed to replace.","version":"1.3 (1994)","related":["amigashell"],"tags":["shell","console"]},{"id":"patches","name":"MCP, MultiCX & the patch culture","year":1995,"category":"shell","kind":"toolkit","status":"active","arch":["68k"],"weight":3,"by":"ALiENDESiGN, Martin Berndt & others","what":"The commodity and system-patch tradition: MCP (Master Control Program) bundling dozens of patches at once, MultiCX (re-released as giftware in March 2025), MagicMenu (revived to v3.1 in August 2026), ToolsDaemon, ToolManager, FBlit and FText for chip-RAM relief, and BlazeWCP for faster planar Workbench.","why":"A whole culture of tiny, surgical system modifications — the reason two Amigas running the same OS version can feel completely different.","related":["workbench"],"tags":["patch","commodity"]},{"id":"reaction","name":"ClassAct / ReAction","year":1996,"category":"shell","kind":"toolkit","status":"shipping","arch":["68k","ppc"],"weight":3,"by":"Phantom Development, then Haage & Partner / Hyperion","what":"A free BOOPSI class collection that competed with MUI, adopted by Haage & Partner as ReAction for AmigaOS 3.5 and now the official toolkit of both AmigaOS 4.x and AmigaOS 3.2.","why":"The official answer to MUI — and the reason modern AmigaOS has a consistent native look without licensing a third-party toolkit.","related":["os35"],"tags":["toolkit"]},{"id":"magellan","name":"Directory Opus Magellan","year":1996,"category":"shell","kind":"shell","status":"active","arch":["68k","ppc","x86"],"weight":4,"by":"GPSoftware, then community","what":"DOpus 5's radical follow-up, which can *fully replace Workbench*: its listers and desktop take over icons, menus and the desktop itself. Open-sourced under the AROS Public License in December 2012 and ported by the dopus5allamigas project to AmigaOS 3, AmigaOS 4, MorphOS and AROS.","why":"The most complete Workbench replacement ever built, and the default desktop of AmiKit and an option in Icaros.","version":"5.91 (2015), all platforms","url":"https://sourceforge.net/projects/dopus5allamigas/","related":["dopus4"],"tags":["filemanager","desktop","open"]},{"id":"scalos","name":"Scalos","year":1999,"category":"shell","kind":"shell","status":"historic","arch":["68k","ppc"],"weight":3,"by":"Stefan Sommerfeld, then Jens Lachmann","what":"The best-known dedicated Workbench *replacement*: a reimplementation with multithreading, plugins, true-colour icons and MUI-based preferences, for 68k, AmigaOS 4 and MorphOS. Open source, now dormant.","why":"It showed the desktop itself was replaceable component software, not part of the OS — still widely installed despite years without a release.","version":"41.8 RC1 (2012), files to 2023","url":"https://sourceforge.net/projects/scalos/","related":["workbench"],"tags":["desktop","open"]},{"id":"amistart","name":"AmiStart","year":2000,"category":"shell","kind":"shell","status":"active","arch":["68k","ppc","x86"],"weight":2,"by":"community","what":"A configurable start-menu, taskbar and dock bringing familiar menu conventions to classic Workbench and Amiga-like desktops.","why":"A common ingredient in curated distributions, and often the first thing that makes Workbench feel navigable to a newcomer.","related":["workbench"],"tags":["launcher","desktop"]},{"id":"ambient","name":"Ambient","year":2001,"category":"shell","kind":"shell","status":"shipping","arch":["ppc"],"weight":3,"by":"David Gerber, then MorphOS Team","what":"MorphOS's integrated MUI-based desktop, GPL-opened in 2005 and maintained as part of the OS ever since.","why":"It proves an Amiga-like desktop could be rebuilt from scratch and end up feeling more modern than the original, not merely different.","url":"https://www.morphos-team.net","related":["mui","morphos1"],"tags":["desktop","open"]},{"id":"wanderer","name":"Wanderer","year":2001,"category":"shell","kind":"shell","status":"shipping","arch":["x86","arm","68k"],"weight":3,"by":"AROS community","what":"AROS's bundled Workbench clone, built on Zune and shipped with every AROS distribution.","why":"The free-software Workbench — the piece that lets AROS feel like an Amiga rather than merely implement its APIs.","url":"https://www.aros.org","related":["aros","zune"],"tags":["desktop","open"]},{"id":"zune","name":"Zune","year":2001,"category":"shell","kind":"toolkit","status":"shipping","arch":["x86","arm","68k"],"weight":3,"by":"AROS community","what":"AROS's open-source reimplementation of the MUI API, and the basis of Wanderer.","why":"It let the enormous body of MUI software concepts move into a fully free system.","url":"https://www.aros.org","related":["mui","aros"],"tags":["toolkit","open"]},{"id":"ags2","name":"Arcade Game Selector (AGS/AGS2)","year":2005,"category":"shell","kind":"launcher","status":"active","arch":["68k"],"weight":3,"by":"Per \"MagerValp\" Olofsson","what":"A minimal joystick-driven fullscreen menu that boots straight into a game list with screenshots, with OCS and AGA layouts and background image loading.","why":"The launcher that made a real Amiga behave like a console — and the foundation of both AmigaVision's front end and HstWB's game packages.","url":"https://github.com/MagerValp/ArcadeGameSelector","related":["whdload"],"tags":["launcher","games","open"]},{"id":"igame","name":"iGame","year":2010,"category":"shell","kind":"launcher","status":"active","arch":["68k","ppc","x86"],"weight":3,"by":"Emmanuel Vasilakis, now George Sokianos","what":"The most popular on-Amiga WHDLoad front end: a MUI application that scans repositories for slaves and shows screenshots, genres and metadata, with builds for AmigaOS 3, AmigaOS 4 and MorphOS.","why":"The polished, Workbench-native way to browse a few thousand games — and still actively developed.","version":"2.6.1 (May 2026)","url":"https://github.com/MrZammler/iGame","related":["whdload","mui"],"tags":["launcher","games","open"]},{"id":"xbench","name":"X-bEnCh","year":2012,"category":"shell","kind":"launcher","status":"historic","arch":["68k"],"weight":2,"by":"Jim Neray","what":"A WHDLoad launcher and more: it auto-scans drives for slaves and executables, manages manuals, and includes a mini file manager and CLI, with 128-colour OCS/ECS and 272-colour AGA interfaces.","why":"Designed to run on any 68k Amiga, it made curated collections usable on unexpanded machines.","related":["whdload"],"tags":["launcher","games"]},{"id":"tinylauncher","name":"TinyLauncher","year":2017,"category":"shell","kind":"launcher","status":"active","arch":["68k"],"weight":2,"by":"Michael \"GIBS\" Gibs","what":"An ultra-light WHDLoad, demo and module front end with retro styling, joystick and keyboard control, cover art, an integrated mod player and even MiSTer vadjust support.","why":"Built for stock 68000 machines where iGame and MUI are too heavy — and updated more often than almost anything else in this category.","version":"3.6 (Apr 2026)","related":["whdload"],"tags":["launcher","games"]},{"id":"amigaforever","name":"Amiga Forever","year":1997,"category":"distro","kind":"oslike","status":"shipping","arch":["x86"],"weight":5,"by":"Cloanto / Amiga Corporation","what":"The official preservation and emulation suite: preconfigured WinUAE and WinFellow with *licensed* Kickstart ROMs and OS versions, RP9 game packages, prebuilt Workbench environments, galleries and video. The Plus edition covers every ROM and OS from 0.7 to 3.X; companion Essentials apps supply licensed ROMs on Android.","why":"The one legal, one-click route into Amiga emulation — and the ROM source most other emulators and packs point users toward.","version":"Amiga Forever 11 (Jul 2025) · $19.95–$59.95","url":"https://www.amigaforever.com","related":["winuae"],"tags":["legal","roms","turnkey"]},{"id":"classicwb","name":"ClassicWB","year":2003,"category":"distro","kind":"oslike","status":"historic","arch":["68k"],"weight":4,"by":"Bloodwych (EAB)","what":"The reference \"instant retro Workbench\": menu-driven theming across MagicWB, NewIcons and GlowIcons, sensible patches, tools and a WHDLoad-ready structure — in LITE, FULL, ADV, ADVSP, P96 (RTG), UAE, OS3x and minimal 68K editions.","why":"For twenty years the default answer to \"how do I set up a nice Workbench?\" — complete rather than abandoned, and still installable automatically through HstWB.","version":"v28 across most editions","url":"http://classicwb.abime.net","related":["os3x","magicwb"],"tags":["turnkey","workbench"]},{"id":"amigasys","name":"AmigaSYS","year":2004,"category":"distro","kind":"oslike","status":"historic","arch":["68k"],"weight":2,"by":"\"Dary\" (HU)","what":"A Hungarian preconfigured Workbench pack, popular around 2005–2010 as the main AmiKit alternative for WinUAE, E-UAE and real AGA machines. Discontinued; the original site is gone.","why":"One of the two packs that established the whole \"preconfigured Amiga desktop\" genre.","version":"AmigaSYS 4 / 4 AGA (2008)","related":["os39"],"tags":["turnkey","workbench"]},{"id":"amikit","name":"AmiKit","year":2005,"category":"distro","kind":"oslike","status":"shipping","arch":["x86","arm","68k"],"weight":5,"by":"Ján Zahurančík (SK)","what":"The flagship modern retro desktop: over 400 applications on a full OS 3.x environment with the DOpus Magellan desktop, MUI 5, antialiased TrueType fonts, dark mode, high-resolution RTG screens, LiveUpdate — and the signature Rabbit Hole, which launches host Windows, macOS and Linux applications from inside the Amiga desktop. X13 adds start-menu styles, a Mini Launcher and KIT, an AI assistant built on AmigaGPT.","why":"The most polished Amiga desktop anyone has assembled, on Windows, macOS, Linux, Raspberry Pi, USB stick, Vampire and PiStorm. It requires your own AmigaOS and Kickstart files.","version":"AmiKit X13 (2025/26)","url":"https://www.amikit.amiga.sk","related":["os39","magellan"],"tags":["turnkey","workbench"],"unverified":true},{"id":"icaros","name":"Icaros Desktop","year":2007,"category":"distro","kind":"oslike","status":"historic","arch":["x86"],"weight":4,"by":"Paolo Besser (IT)","what":"The flagship AROS x86 (ABIv0) desktop distribution: a full live-and-install system with AmiBridge 68k integration via Janus-UAE, optional DOpus Magellan desktop, media tools and a large software collection.","why":"For over a decade the easiest way to actually *use* AROS. A November 2025 post — \"Until we meet again, Icaros Desktop\" — effectively mothballed the project, pointing users to the AROS World community.","version":"2.3.x · mothballed Nov 2025","url":"https://icarosdesktop.org","related":["aros","janusuae"],"tags":["turnkey","aros"]},{"id":"broadway","name":"AROS Broadway","year":2009,"category":"distro","kind":"oslike","status":"historic","arch":["x86"],"weight":1,"by":"AROS community","what":"An early AROS x86 distribution aimed at a media-friendly desktop. Defunct; last preview 2016.","why":"Part of the first wave of attempts to package AROS for ordinary users.","related":["aros"],"tags":["turnkey","aros"]},{"id":"aspireos","name":"AspireOS","year":2011,"category":"distro","kind":"oslike","status":"historic","arch":["x86"],"weight":1,"by":"Nikolaos Tomatsidis","what":"A lightweight AROS distribution aimed at Acer Aspire One netbooks. Dead — the domain is parked.","why":"It made AROS run genuinely well on real, cheap, portable hardware.","version":"2.2 \"Obitus\" (2018)","related":["aros"],"tags":["turnkey","aros"]},{"id":"aeros","name":"AEROS","year":2012,"category":"distro","kind":"oslike","status":"historic","arch":["x86","arm"],"weight":2,"by":"Pascal Papara","what":"A hybrid AROS-on-Linux distribution for x86 and Raspberry Pi, once sold with AresOne PCs. Dormant — the domain now redirects elsewhere.","why":"It pioneered the pragmatic hybrid model — Linux underneath for drivers, AROS on top for the experience — that AxRuntime later formalised.","related":["aros"],"tags":["turnkey","aros"]},{"id":"betterwb","name":"BetterWB / BestWB","year":2013,"category":"distro","kind":"oslike","status":"historic","arch":["68k"],"weight":3,"by":"Gulliver","what":"Lightweight enhancement packs that work on a plain 68000 with 2 MB: curated fixes, handlers and small upgrades without the bulk of the big packs. BetterWB targets AmigaOS 3.1, BestWB targets 3.1.4.","why":"The choice for people who want a *better* stock Workbench rather than a different one — and the only serious option for unexpanded machines.","version":"BetterWB 4.3 (2018) · BestWB 1.3 (2019)","url":"http://lilliput.amiga-projects.net/BetterWB.htm","related":["os3x","os314"],"tags":["turnkey","workbench"]},{"id":"afaos","name":"AfA OS","year":2010,"category":"distro","kind":"oslike","status":"historic","arch":["68k"],"weight":2,"by":"Bernd Roesch","what":"A daring enhancement layer grafting AROS 68k components onto AmigaOS 3.1 and 3.9: an RTG-friendly Workbench, antialiased TrueType text, larger icons and a faster GUI.","why":"It moved code *from* the open clone *into* the proprietary original — the reverse of the usual direction, and a neat illustration of how blurred the boundaries are.","version":"4.8 (Jun 2019)","related":["aros68k","os39"],"tags":["turnkey","workbench"]},{"id":"amibian","name":"Amibian","year":2016,"category":"distro","kind":"oslike","status":"limited","arch":["arm"],"weight":3,"by":"Gunnar Kristjánsson","what":"A Raspberry Pi image designed to boot in seconds straight into an Amiga emulator and present itself as a dedicated appliance — initially UAE4ARM-based, later Amiberry.","why":"It made \"turn a Pi into an Amiga\" a reproducible path for non-experts, and set the template Pimiga and the Pi editions of AmiKit followed. (The similarly named Amibian.js is an unrelated browser-based project.)","related":["amiberry"],"tags":["turnkey","pi"],"unverified":true},{"id":"coffinos","name":"CoffinOS","year":2017,"category":"distro","kind":"oslike","status":"limited","arch":["68k","fpga"],"weight":3,"by":"community","what":"A performance- and visuals-focused community distribution of a customised AmigaOS 3.x/3.9 environment, strongly associated with Vampire and heavily accelerated machines: large preinstalled software collections, RTG and SAGA-tuned Workbench, games and emulators out of the box.","why":"It demonstrates the appetite for opinionated \"super Amiga\" systems — and it is the standing example of why legal sourcing matters, since builds bundle copyrighted material and hardware vendors publicly distance themselves from it.","related":["os39","vampirev2"],"tags":["turnkey","caution","licensing"]},{"id":"caffeineos","name":"CaffeineOS","year":2019,"category":"distro","kind":"oslike","status":"limited","arch":["68k","fpga"],"weight":2,"by":"community","what":"A curated, performance-focused 68k environment likewise associated with Vampire hardware.","why":"One of several community attempts to package SAGA and 68080 capabilities into a coherent desktop.","related":["os39","vampirev2"],"tags":["turnkey"],"unverified":true},{"id":"flowerpot","name":"Flower Pot","year":2017,"category":"distro","kind":"oslike","status":"historic","arch":["x86","ppc"],"weight":2,"by":"AmiKit project","what":"A guided Windows installer that automated building an AmigaOS 4.1-under-emulation environment — WinUAE with the PowerPC plugin preconfigured — while deliberately requiring the user's own purchased 4.1 ISO.","why":"It lowered the barrier to trying AmigaOS 4 without scarce PowerPC hardware. Its page has since vanished and the project appears dead.","related":["os41fe","winuae"],"tags":["turnkey","os4"],"unverified":true},{"id":"arosone","name":"AROS One","year":2019,"category":"distro","kind":"oslike","status":"active","arch":["x86","68k"],"weight":3,"by":"AMIwORX","what":"Now the most active AROS distribution family, with editions for x86 32-bit ABIv0, 64-bit ABIv11 tracking deadwood's builds, and a 68k edition for real Amigas and emulators.","why":"With Icaros mothballed, AROS One is where the AROS desktop scene has consolidated.","version":"x86 v2.9 (Dec 2025) · 64-bit v1.3 (Feb 2026)","related":["aros"],"tags":["turnkey","aros"]},{"id":"apolloosimg","name":"ApolloOS system image","year":2020,"category":"distro","kind":"oslike","status":"shipping","arch":["68k","fpga"],"weight":3,"by":"Apollo Team","what":"The ready-to-run ApolloOS card image shipped with V4 hardware and distributed for download — a complete AROS 68k desktop tuned for the 68080, with software preinstalled.","why":"The legal, vendor-supported alternative to community Vampire images: nothing copyrighted, nothing to source yourself.","url":"https://apollo-computer.com/apolloos.php","related":["apolloos"],"tags":["turnkey","free"]},{"id":"pimiga","name":"PiMIGA","year":2020,"category":"distro","kind":"oslike","status":"limited","arch":["arm"],"weight":4,"by":"Chris Edwards","what":"A popular Raspberry Pi and x86 \"instant Amiga\" image: Amiberry-based with a full desktop and large WHDLoad libraries, distributed free by torrent. The author and community stress that it should never be paid for.","why":"The most widely used turnkey Amiga image — and a legal grey zone, since builds have historically included Kickstart, OS and game material, which is why mainstream Amiga archives do not host it.","version":"3.0 (Dec 2022)","related":["amiberry"],"tags":["turnkey","pi","caution","licensing"],"unverified":true},{"id":"amigavision","name":"AmigaVision","year":2021,"category":"distro","kind":"oslike","status":"shipping","arch":["fpga","arm","68k","x86"],"weight":5,"by":"David Lindecrantz, now Alex Limi","what":"Formerly MegaAGS: roughly 5,300 hand-tuned game and demo configurations with per-title chipset, CPU and scaling settings, high-resolution screenshots and metadata, integer overscale, dynamic PAL/NTSC pixel aspect, curated lists, 2,955 QR-coded manuals, WHDLoad-based saving and PFS. Open-source build tooling; you supply the software.","why":"The most rigorous preservation-minded environment in the scene, and the only one that targets MiSTer, Analogue Pocket, Raspberry Pi, desktop emulators *and* real A1200, A4000 and CD32 hardware from one build.","version":"2026.04.26","url":"https://amiga.vision","related":["ags2","whdload","mister"],"tags":["turnkey","preservation","open"]},{"id":"hstwb","name":"HstWB Installer","year":2016,"category":"distro","kind":"oslike","status":"active","arch":["x86","arm"],"weight":3,"by":"Henrik Nørfjand Stengaard","what":"An automated image builder: point it at your own AmigaOS files (3.1 through 3.2 or 3.9, identified by checksum) and Kickstarts, and it builds ready HDF or directory setups with optional ClassicWB, BetterWB, EAB WHDLoad packs, iGame, AGS2 and its own launcher.","why":"It turns \"assemble a perfect Amiga install\" from a weekend of manual work into a scripted, repeatable build — MIT-licensed and legally careful by design.","version":"1.6.3 (Jan 2025)","url":"https://github.com/henrikstengaard/hstwb-installer","related":["classicwb","ags2"],"tags":["turnkey","open"]},{"id":"chrysalis","name":"Chrysalis","year":2010,"category":"distro","kind":"oslike","status":"active","arch":["ppc"],"weight":3,"by":"Papiosaur","what":"A one-installer software pack for MorphOS adding curated applications, games, emulators, Ambient configuration, codecs and skins to a fresh installation.","why":"The MorphOS equivalent of AmiKit: it turns a clean install into a fully equipped desktop in one step.","version":"3.19 (Mar 2026)","url":"https://www.morphos-storage.net","related":["morphos3"],"tags":["turnkey","morphos"]},{"id":"enhancer","name":"Enhancer Software","year":2016,"category":"distro","kind":"oslike","status":"shipping","arch":["ppc"],"weight":3,"by":"A-EON / AmigaKit","what":"A commercial component and application pack for AmigaOS 4.1: RadeonHD and RadeonRX drivers, Warp3D Nova, updated datatypes and commands, and applications like MultiViewer, MultiEdit and X-Dock. A free Enhancer Core line is distributed via the AmiSphere platform.","why":"Effectively a second system layered on AmigaOS 4 — and the centre of a long-running dispute with Hyperion over duplicated components and the ExecSG kernel.","version":"v2.2 (2022) + free Core releases","url":"https://www.amigakit.com","related":["os41fe"],"tags":["os4","licensing"]},{"id":"uae","name":"UAE","year":1995,"category":"emu","kind":"emulator","status":"historic","arch":["x86","other"],"weight":5,"by":"Bernd Schmidt","what":"The ancestor of virtually all Amiga emulation, first released in 1995 and originally named the \"Unusable Amiga Emulator\" because at first it could show only a white screen. Later re-expanded to Unix, then Universal Amiga Emulator. GPL.","why":"It established the 68000-plus-OCS emulation model every descendant still carries, and made the Amiga one of the best-preserved platforms in computing.","related":["a500"],"tags":["open"]},{"id":"fellow","name":"Fellow / WinFellow","year":1996,"category":"emu","kind":"emulator","status":"historic","arch":["x86"],"weight":2,"by":"Petter Schau, Torsten Enderling & others","what":"The historic non-UAE alternative: Fellow began as a DOS Amiga emulator famed for speed, and WinFellow is its Windows port focused on OCS and ECS gaming. Dormant since around 2019–21, though Amiga Forever still bundles a build.","why":"For years it was the fast option when UAE was too slow — and proof that more than one codebase could do the job.","url":"https://github.com/petschau/WinFellow","related":["uae"],"tags":["open"]},{"id":"winuae","name":"WinUAE","year":1997,"category":"emu","kind":"emulator","status":"active","arch":["x86"],"weight":5,"by":"Toni Wilen (maintainer since 2001)","what":"The reference Amiga emulator and effectively the R&D lab for the whole ecosystem: cycle-exact OCS/ECS/AGA, 68000–68060 with MMU and FPU, JIT, PowerPC accelerator emulation, CD32 and CDTV with Akiko, Toccata, x86 bridgeboards, dozens of expansion boards, Picasso96 RTG, and a debugger regarded as the best for 68k anywhere. Version 6.0.0 (2025) rewrote the Agnus/Alice and Denise/Lisa emulation almost completely.","why":"The accuracy benchmark every other implementation, including FPGA cores, is measured against. GPL, Windows x86 only.","version":"6.0.3 (3 Mar 2026)","url":"https://www.winuae.net","related":["uae"],"tags":["open","reference"]},{"id":"mame","name":"MAME Amiga systems","year":2000,"category":"emu","kind":"emulator","status":"active","arch":["x86"],"weight":2,"by":"MAME team","what":"MAME's amiga.cpp driver covers the A500, A1000, A2000, A3000, A1200 and CD32, plus the Amiga-based arcade platforms Arcadia Systems, Cubo CD32 and Upscope. The computer drivers are flagged preliminary; the arcade ones are more usable.","why":"It brings Amiga hardware into the single largest systematic preservation project in computing — and preserves the arcade machines nothing else covers.","url":"https://www.mamedev.org","related":["a500","cd32"],"tags":["open","preservation"]},{"id":"euae","name":"E-UAE","year":2003,"category":"emu","kind":"emulator","status":"historic","arch":["x86","ppc"],"weight":3,"by":"Richard Drummond","what":"\"Enhanced UAE\": a merge of the stagnant UAE 0.8.x Unix trunk with WinUAE features, notably the JIT, for Linux, macOS, BeOS and AmigaOS hosts. Last release 2007.","why":"Genealogically crucial — nearly every later portable fork, from PUAE to Janus-UAE, built on it.","related":["uae","winuae"],"tags":["open"]},{"id":"uae4all","name":"UAE4All / UAE4ALL2","year":2004,"category":"emu","kind":"emulator","status":"historic","arch":["arm"],"weight":2,"by":"Chui and others","what":"The speed-over-accuracy fork family, originally targeting the Dreamcast and GP2X and based on a very early UAE.","why":"It put the Amiga on handheld hardware a decade before that was normal, and started the mobile lineage that ends at Amiberry.","related":["uae"],"tags":["open","portable"]},{"id":"janusuae","name":"Janus-UAE","year":2008,"category":"emu","kind":"emulator","status":"historic","arch":["x86"],"weight":2,"by":"Oliver Brunner","what":"An E-UAE fork for AROS, notable for \"coherency mode\": 68k Amiga applications integrated directly into the AROS desktop rather than confined to an emulator window.","why":"It is the engine behind Icaros's AmiBridge, letting an open-source Amiga-like system run the entire classic software library seamlessly.","related":["euae","aros"],"tags":["open","aros"]},{"id":"fsuae","name":"FS-UAE","year":2011,"category":"emu","kind":"emulator","status":"active","arch":["x86","arm"],"weight":4,"by":"Frode Solheim (NO)","what":"A cross-platform emulator wrapping the WinUAE core in a portable SDL/OpenGL shell with a polished fullscreen UI, per-game configuration and — uniquely in the UAE world — built-in netplay. Its Launcher identifies disk images by checksum against the OpenRetro database and auto-configures everything.","why":"The best \"it just works\" desktop Amiga emulator on macOS and Linux, and the deterministic netplay engine behind AmigaLive.","version":"3.2.35 stable (Sep 2025) · 5.0 alpha","url":"https://fs-uae.net","related":["winuae"],"tags":["open","netplay"]},{"id":"puae","name":"PUAE / libretro core","year":2012,"category":"emu","kind":"emulator","status":"active","arch":["x86","arm","other"],"weight":4,"by":"Mustafa Tufan, now libretro team","what":"The Amiga core of RetroArch and most console-style distributions. Despite keeping the PUAE name it has been progressively rebased onto WinUAE sources (currently 5.3.1): A500 through A4000, CD32 and CDTV, every common disk format, WHDLoad .lha direct launch, M3U multi-disk, run-ahead — and a built-in AROS ROM for instant starts.","why":"It is how most people accidentally run an Amiga: inside RetroArch, on a phone, a console, a handheld or a TV box.","url":"https://github.com/libretro/libretro-uae","related":["euae","winuae"],"tags":["open","libretro"]},{"id":"sae","name":"Scripted Amiga Emulator","year":2012,"category":"emu","kind":"emulator","status":"historic","arch":["web"],"weight":3,"by":"Rupert \"naTmeg\" Hausberger","what":"A pure JavaScript and HTML5 re-implementation of UAE and WinUAE code running entirely in the browser, covering OCS and ECS configurations. Dormant.","why":"Historically important far beyond its activity level: the Internet Archive's in-browser Amiga software library runs on it through the Emularity loader.","url":"https://github.com/naTmeg/ScriptedAmigaEmulator","related":["winuae"],"tags":["open","web","preservation"]},{"id":"uae4arm","name":"UAE4ARM","year":2013,"category":"emu","kind":"emulator","status":"historic","arch":["arm"],"weight":3,"by":"TomB and others","what":"The ARM JIT fork with Picasso96 support that was *the* Raspberry Pi and Pandora Amiga emulator before Amiberry superseded it.","why":"It made the £35 computer a credible Amiga, and directly seeded both Amibian and Amiberry.","related":["uae4all"],"tags":["open","pi"]},{"id":"amiberry","name":"Amiberry","year":2016,"category":"emu","kind":"emulator","status":"active","arch":["arm","x86"],"weight":5,"by":"Dimitris \"MiDWaN\" Panokostas","what":"The dominant Amiga emulator outside Windows: WinUAE-grade compatibility plus features WinUAE lacks, above all WHDLoad auto-boot — drop an .lha on it and it builds the whole boot environment automatically. Runs on Linux (ARM, x86-64, RISC-V), macOS including Apple Silicon, Windows, Android with a native touch UI and Android TV, FreeBSD and Haiku. v8.0 moved to SDL3 and a new ImGui interface.","why":"The engine hidden inside a remarkable amount of consumer hardware and turnkey imagery — Pimiga, Amibian, AmiKit for Pi, and reportedly the retail mini-consoles.","version":"8.3.0 (5 Aug 2026)","url":"https://amiberry.com","related":["winuae","uae4arm"],"tags":["open","whdload"]},{"id":"denise","name":"Denise","year":2017,"category":"emu","kind":"emulator","status":"active","arch":["x86"],"weight":3,"by":"PiCiJi","what":"A cycle-accurate multi-system emulator covering the C64 and the Amiga 500, 1000 and 600, with run-ahead (rare in Amiga emulation), CRT shaders, rewind, floppy audio and a debugger. Windows, macOS, Linux and BSD.","why":"One of only two active from-scratch alternatives to the UAE lineage, and the only one offering run-ahead latency reduction.","version":"2.8 (May 2026)","url":"https://sourceforge.net/projects/deniseemu/","tags":["open","accuracy"]},{"id":"qemu","name":"QEMU AmigaNG targets","year":2018,"category":"emu","kind":"emulator","status":"active","arch":["x86","ppc"],"weight":4,"by":"Zoltán Balaton & QEMU project","what":"Mainline QEMU now emulates the PowerPC machines AmigaOS 4 and MorphOS run on: Sam460ex (from QEMU 3.0), Pegasos2 (6.1), the dedicated amigaone machine (8.2) and mac99 PowerMacs. QEMU 11.0.0 (April 2026) improved ati-vga so the AmigaOS 4.1 Radeon driver works.","why":"It makes the next-generation systems genuinely testable without rare, expensive PowerPC hardware. AmigaOS 4.1 installs and runs on all three machines, easiest via the BBoot loader; MorphOS runs on Pegasos2 and mac99.","url":"https://zero.eik.bme.hu/~balaton/qemu/amiga/","related":["peg2","sam460"],"tags":["open","ppc","os4","morphos"]},{"id":"amigalive","name":"AmigaLive","year":2019,"category":"emu","kind":"oslike","status":"active","arch":["x86"],"weight":3,"by":"AmigaLive project","what":"A netplay lobby application for synchronised multiplayer of classic Amiga games, with game lobbies, a Discord community and organised tournaments. Built on FS-UAE's deterministic netplay — not WinUAE, contrary to common belief.","why":"It restored something the Amiga barely had in period: reliable, organised online multiplayer for a 1990s games library.","url":"https://amigalive.com","related":["fsuae"],"tags":["netplay"],"unverified":true},{"id":"vamiga","name":"vAmiga","year":2019,"category":"emu","kind":"emulator","status":"active","arch":["x86","arm"],"weight":4,"by":"Dirk W. Hoffmann","what":"A from-scratch cycle-accurate emulator of the Amiga 500, 1000 and 2000 (OCS and ECS) with a beautiful native macOS interface, run-ahead and an extensive inspector and debugger suite, plus the RetroVault companion for disk tooling.","why":"The most approachable accurate emulator on the Mac, and the codebase behind vAmigaWeb.","version":"4.4 (Apr 2025)","url":"https://dirkwhoffmann.github.io/vAmiga/","tags":["open","accuracy","mac"]},{"id":"vamigaweb","name":"vAmigaWeb","year":2021,"category":"emu","kind":"emulator","status":"active","arch":["web"],"weight":3,"by":"mithrendal, on Hoffmann's core","what":"A WebAssembly port of the vAmiga core, installable as a progressive web app with touch controls — currently the most practical route to an Amiga on an iPhone or iPad.","why":"It puts a cycle-accurate Amiga one URL away, with nothing to install and no app store to satisfy.","url":"https://vamiga.net","related":["vamiga"],"tags":["open","web","portable"]},{"id":"qemuuae","name":"qemu-uae (PPC plugin)","year":2014,"category":"emu","kind":"emulator","status":"historic","arch":["ppc"],"weight":2,"by":"Frode Solheim","what":"Not an emulator but the crucial plugin: a stripped QEMU PowerPC 603e/604e core packaged so that both WinUAE and FS-UAE can emulate BlizzardPPC and CyberStormPPC accelerator CPUs.","why":"It is what allows an emulated A1200 or A4000 to boot AmigaOS 4.1 Classic — the bridge between the classic and next-generation branches.","url":"https://github.com/FrodeSolheim/qemu-uae","related":["winuae","blizzardppc"],"tags":["open","ppc"]},{"id":"rtg","name":"RTG — Retargetable Graphics","year":1993,"category":"tech","kind":"concept","status":"active","arch":["68k","ppc","x86"],"weight":5,"by":"—","what":"The concept that made a classic Amiga usable on a modern monitor: a driver layer between graphics.library and the hardware, so Workbench and applications render in high-resolution chunky modes on graphics cards, FPGA cores or virtual emulated boards instead of directly through OCS, ECS or AGA planar modes.","why":"The single most important modernisation of the platform. It is also why \"AmigaOS-compatible\" does not imply custom-chip compatibility: DraCo, AmigaOne, Sam and X5000 machines rely on RTG and system APIs rather than recreating a chipset.","related":["os2x"],"tags":["graphics","concept"]},{"id":"cybergraphx","name":"CyberGraphX","year":1995,"category":"tech","kind":"component","status":"shipping","arch":["68k","ppc"],"weight":3,"by":"Frank Mariak & Thomas Sontowski","what":"One of the two historic RTG systems, tied to phase5's CyberVision cards, which introduced the CGX API that many applications and games still call. No longer developed standalone — but MorphOS's graphics subsystem is its direct descendant.","why":"It popularised retargetable screens first, and its author became a MorphOS core developer, carrying the design forward.","related":["rtg","cybervision"],"tags":["graphics","rtg"]},{"id":"p96","name":"P96 (Picasso96)","year":1996,"category":"tech","kind":"component","status":"shipping","arch":["68k"],"weight":4,"by":"Kneer & Abt, now Individual Computers","what":"The de-facto RTG standard on classic Amigas: a modular driver system supporting Cirrus, S3, Voodoo, Matrox, Permedia2, CyberVision, Picasso IV, ZZ9000, Vampire SAGA and the UAE virtual card. Freeware originally, bought and commercially maintained by iComp since 2017, with Hyperion co-owning the PowerPC branch.","why":"It won the classic market by offering a cleaner driver model, emulating its rival's API, and staying free — and it is still actively gaining support for hardware built in the 2020s.","version":"V3.6.x (2025–26)","url":"https://wiki.icomp.de/wiki/P96","related":["rtg"],"tags":["graphics","rtg"]},{"id":"warp3d","name":"Warp3D","year":1998,"category":"tech","kind":"component","status":"historic","arch":["68k","ppc"],"weight":3,"by":"Hyperion Entertainment","what":"The original Amiga 3D driver API for ViRGE, Permedia2 and Voodoo cards — fixed-function, and still the target of many classic games.","why":"It gave the Amiga hardware-accelerated 3D at the same moment the PC world was standardising on OpenGL and Direct3D.","related":["rtg"],"tags":["3d","graphics"]},{"id":"warp3dnova","name":"Warp3D Nova & ogles2","year":2016,"category":"tech","kind":"component","status":"shipping","arch":["ppc"],"weight":3,"by":"Hans de Ruiter / Daniel Müßener","what":"The modern shader-based 3D stack for AmigaOS 4: Warp3D Nova (GLSL-style shaders and vertex buffers) with Daniel Müßener's ogles2.library implementing OpenGL ES 2.0 on top, plus GL4ES bringing desktop OpenGL to that.","why":"The workhorse behind modern AmigaOS 4 game ports — it is what let Quake 2 and Irrlicht-based software arrive on the platform in 2024.","url":"https://www.a-eon.com","related":["warp3d","os41fe"],"tags":["3d","graphics","os4"]},{"id":"tinygl","name":"TinyGL & MiniGL","year":2000,"category":"tech","kind":"component","status":"shipping","arch":["ppc"],"weight":2,"by":"MorphOS Team / Hyperion","what":"The OpenGL implementations of the next-generation systems: MorphOS's built-in TinyGL, substantially rewritten by Mark Olsen and further updated in MorphOS 3.20, and AmigaOS 4's older MiniGL subset layered on classic Warp3D.","why":"They are why cross-platform 3D software can be ported to these systems at all.","related":["warp3d","morphos3"],"tags":["3d","graphics"]},{"id":"wazp3d","name":"Wazp3D","year":2008,"category":"tech","kind":"component","status":"limited","arch":["68k","fpga"],"weight":2,"by":"Thierry Pierron","what":"A software, CPU-only implementation of the Warp3D API, letting classic Warp3D games run with no 3D card at all. A Vampire fork drives the SAGA and Maggie hardware.","why":"It rescued a whole generation of 3D games for users who never owned the specific cards they required.","related":["warp3d"],"tags":["3d","graphics"]},{"id":"saga","name":"SAGA chipset","year":2016,"category":"tech","kind":"component","status":"shipping","arch":["fpga"],"weight":4,"by":"Apollo Team","what":"The FPGA chipset accompanying the Apollo 68080: video (Isabel), audio (Arne), DMA (Anni), up to 12 MB chip RAM, 16 large sprites, AGA-compatible modes plus SuperAGA extensions, RTG over HDMI, and the Maggie 3D unit.","why":"The most consequential *revisionist* project in the scene: rather than only reproducing Commodore silicon, it extends it — which is why \"compatible\" now spans faithful recreation through deliberate augmentation.","url":"https://www.apollo-computer.com","related":["vampirev2","rtg"],"tags":["graphics","68080","fpga"]},{"id":"ammx","name":"AMMX & the Apollo 68080","year":2016,"category":"tech","kind":"concept","status":"shipping","arch":["fpga","68k"],"weight":4,"by":"Gunnar von Boehn / Apollo Team","what":"A superscalar 68k-compatible FPGA CPU with 64-bit extensions and the AMMX SIMD instruction set, claiming performance well beyond any real 68060. The core is closed source.","why":"It divides the community: unsanctioned ISA extensions draw fragmentation criticism, and the closed core draws objections from the open-FPGA world — but it is also the only project actively growing the 68k architecture rather than preserving it.","url":"https://www.apollo-core.com","related":["saga"],"tags":["cpu","68080","fpga"]},{"id":"ahi","name":"AHI — Audio Hardware Interface","year":1996,"category":"tech","kind":"component","status":"shipping","arch":["68k","ppc","x86"],"weight":4,"by":"Martin Blom","what":"The retargetable audio standard: applications open ahi.device and audio routes to Paula or to any sound card through driver plug-ins. The classic 68k standard remains v4.18; the v6 rewrite is what AmigaOS 4, MorphOS and AROS integrate.","why":"RTG's counterpart for sound — and the reason a single application can address Paula, a Toccata, a Prisma Megamix or a ZZ9000AX without knowing anything about them.","related":["toccata"],"tags":["audio","concept"]},{"id":"mhi","name":"MHI — MPEG Hardware Interface","year":2000,"category":"tech","kind":"component","status":"active","arch":["68k"],"weight":2,"by":"community","what":"A small standard API for hardware MPEG and MP3 decoders, so a 68k Amiga can play compressed audio with near-zero CPU load. Still in use: mhimasplayer for MAS-Player dongles, and MASWaver (2026) streaming web radio to MHI hardware.","why":"The pragmatic answer to Paula's limits — offload rather than emulate.","related":["ahi","prisma"],"tags":["audio"]},{"id":"bsdsocket","name":"bsdsocket.library","year":1993,"category":"tech","kind":"concept","status":"active","arch":["68k","ppc","x86"],"weight":3,"by":"AmiTCP originally","what":"The Amiga's de-facto socket ABI: every TCP/IP stack exports the same BSD-style shared library, so any network application runs on any stack.","why":"A community-established standard, not a vendor one — and the reason thirty years of Amiga internet software still works on current systems.","related":["amitcp"],"tags":["network","concept"]},{"id":"amitcp","name":"AmiTCP & Genesis","year":1993,"category":"tech","kind":"component","status":"historic","arch":["68k"],"weight":2,"by":"university project, later NSDi","what":"The original 1993 stack that defined bsdsocket, later commercialised, with its lineage continuing in Genesis — the stack bundled with AmigaOS 3.5 and 3.9.","why":"It put the Amiga on the internet before most home computers had any TCP/IP at all.","tags":["network"]},{"id":"miami","name":"Miami / MiamiDX","year":1996,"category":"tech","kind":"component","status":"historic","arch":["68k"],"weight":2,"by":"Holger Kruse","what":"The user-friendly commercial stacks of the late 1990s. Registration servers are long gone and development is dead, but installations are still encountered.","why":"For many users Miami was how the Amiga got online — a GUI over TCP/IP when the alternative was configuration files.","related":["bsdsocket"],"tags":["network"]},{"id":"roadshow","name":"Roadshow","year":2006,"category":"tech","kind":"component","status":"shipping","arch":["68k","ppc"],"weight":3,"by":"Olaf Barthel / APC&TCP","what":"The modern commercial TCP/IP stack for 68k (OS 2.04 and later): fast, SANA-II, with a built-in firewall, DHCP and shell diagnostics, sold with a time-limited demo. AmigaOS 4's built-in stack is Roadshow-based and was updated again in Update 3.","why":"The current answer for classic networking, and the stack the official OS itself adopted.","version":"1.15 (2022)","url":"https://roadshow.apc-tcp.de/index-en.php","related":["bsdsocket"],"tags":["network"]},{"id":"amissl","name":"AmiSSL","year":2000,"category":"tech","kind":"component","status":"active","arch":["68k","ppc","x86"],"weight":4,"by":"Jens Maus, Oliver Roberts & others","what":"The shared OpenSSL port that every Amiga internet application depends on, released several times a year across 68k, AmigaOS 4, MorphOS and AROS.","why":"Without it the modern web would simply be unreachable from any Amiga. Keeping a 68k TLS stack current with upstream OpenSSL is one of the least glamorous and most essential jobs in the scene.","version":"5.27 (Apr 2026), OpenSSL 3.6.2","url":"https://github.com/jens-maus/amissl","related":["bsdsocket"],"tags":["network","security"]},{"id":"poseidon","name":"Poseidon USB stack","year":2002,"category":"tech","kind":"component","status":"shipping","arch":["68k","ppc"],"weight":4,"by":"Chris Hodges","what":"The USB stack for classic hardware — with Trident as its preferences GUI — supporting HID, mass storage, audio, network and printer classes across Deneb, RapidRoad, Subway and Algor hardware. Sources were opened, forming the basis of the AROS port; MorphOS bundles an integrated version and ApolloOS uses it for V4 USB.","why":"One person's stack became the platform standard, and then the shared foundation of three other operating systems.","url":"http://www.platon42.de","related":["rapidroad"],"tags":["usb"]},{"id":"sirion","name":"Sirion & ANAIS","year":2008,"category":"tech","kind":"component","status":"shipping","arch":["ppc"],"weight":2,"by":"Hyperion / AmigaKit","what":"AmigaOS 4's own USB stack, Sirion, notably improved in Update 3 (October 2025) and joined by a USB Audio Class driver in August 2026 — plus ANAIS, a newer stack developed by AmigaKit for its Enhancer ecosystem.","why":"Two competing USB stacks on one OS is a neat illustration of the parallel AmigaOS 4 development ecosystems.","related":["os41fe"],"tags":["usb","os4"],"unverified":true},{"id":"pfs3","name":"PFS3 / PFS3-AIO","year":2018,"category":"tech","kind":"component","status":"shipping","arch":["68k"],"weight":4,"by":"originally Michiel Pelt, rebuilt by Toni Wilen","what":"The Professional File System III, open-sourced and rebuilt by Toni Wilen as a single \"all-in-one\" binary working from OS 1.x to 3.x on any 68000 or better, with TD64, NSD and SCSI-direct support and large partitions — much faster and far more crash-resistant than FFS.","why":"The community standard filesystem: AmigaVision, HstWB and most modern CF installs use it by default.","version":"pfs3aio 3.1 (2018)","url":"https://aminet.net/package/disk/misc/pfs3aio","related":["os3x"],"tags":["filesystem","open"]},{"id":"sfs","name":"SFS / SFS2","year":2000,"category":"tech","kind":"component","status":"shipping","arch":["68k","ppc"],"weight":2,"by":"John Hendrikx, later community","what":"SmartFilesystem, with safer write behaviour, popular on AmigaOS 4 and MorphOS. Its 64-bit SFS2 variant gained first-class support in MorphOS 3.20, handling files over 4 GB and partitions to 2 TB.","why":"The next-generation systems' native filesystem answer to FFS's limits.","related":["os3x"],"tags":["filesystem"]},{"id":"filesysbox","name":"filesysbox.library","year":2013,"category":"tech","kind":"component","status":"active","arch":["68k","ppc","x86"],"weight":3,"by":"Leif Salomonsson, now Fredrik Wikström","what":"A FUSE-compatible filesystem layer that lets Linux FUSE filesystems run as Amiga handlers — the enabler behind exFAT, NTFS-3G and smb2fs on 68k, AmigaOS 4 and AROS.","why":"A single clever abstraction that suddenly gave the Amiga access to every modern filesystem, without porting each one from scratch.","version":"54.9 (Feb 2026)","url":"https://github.com/salass00/filesysbox","related":["pfs3"],"tags":["filesystem","open"]},{"id":"modernfs","name":"FAT95, exFAT & NTFS support","year":2000,"category":"tech","kind":"component","status":"active","arch":["68k","ppc","x86"],"weight":3,"by":"Torsten Jäger, Fredrik Wikström, Tobias Karlsson","what":"The stack that lets an Amiga read modern media: Torsten Jäger's free FAT95 for FAT12/16/32, exFAT-aos3 ported from the AmigaOS 4 implementation, and NTFS-3G with full read/write via filesysbox.","why":"It means a card written on a PC or Mac just works — the mundane compatibility that makes daily use practical.","version":"fat95 build 20260614 · exFAT-aos3 53.4 (Aug 2026) · ntfs3g 53.5 (Mar 2026)","related":["filesysbox"],"tags":["filesystem"]},{"id":"smbfs","name":"smbfs & smb2fs","year":2019,"category":"tech","kind":"component","status":"active","arch":["68k","ppc","x86"],"weight":2,"by":"Olaf Barthel / Fredrik Wikström","what":"SMB filesystem clients: Olaf Barthel's classic smbfs, whose 2.x rewrite added SMB2 support, and Wikström's newer smb2fs built on filesysbox and libsmb2.","why":"The practical route to cloud storage on an Amiga — mount a NAS share and let something else sync it.","version":"smb2fs 53.10 (Jun 2025)","url":"https://github.com/obarthel/amiga-smbfs","related":["filesysbox","roadshow"],"tags":["network","filesystem"]},{"id":"ibrowse","name":"IBrowse","year":1996,"category":"soft","kind":"app","status":"shipping","arch":["68k","ppc"],"weight":4,"by":"Oliver Roberts","what":"The long-lived native MUI browser for AmigaOS 3.0 through 3.2, AmigaOS 4.1 and MorphOS. Version 3.0a added OpenSSL 3 and TLS 1.3 via AmiSSL, better JavaScript and tabs. Its engine remains HTML 4.01-era.","why":"Thirty years of continuous commercial development by one person — and still the browser most classic Amiga users reach for.","version":"3.0a (Dec 2023)","url":"https://www.ibrowse-dev.net","related":["mui","amissl"],"tags":["browser"]},{"id":"aweb","name":"AWeb & Voyager","year":1996,"category":"soft","kind":"app","status":"historic","arch":["68k"],"weight":2,"by":"Yvon Rozijn / VaporWare","what":"The other two classic browsers: AWeb II, later open-sourced after being bundled with AmigaOS 3.5, and VaporWare's Voyager. Both dormant.","why":"Three competing native browsers on a platform this size says a lot about 1990s Amiga optimism.","related":["os35"],"tags":["browser"]},{"id":"owb","name":"Odyssey Web Browser","year":2009,"category":"soft","kind":"app","status":"active","arch":["ppc","x86"],"weight":3,"by":"Fabien Coeurjoly, AROS build by deadwood","what":"A WebKit browser for MorphOS, the platform's mainstay until Wayfarer, with its final MorphOS release in 2015. It was ported to AmigaOS 4 and to AROS, where deadwood still maintains and modernises it.","why":"The first genuinely modern rendering engine on any Amiga-like system — and still the standard browser on AROS.","related":["morphos2"],"tags":["browser","open"]},{"id":"netsurf","name":"NetSurf","year":2011,"category":"soft","kind":"app","status":"active","arch":["68k","ppc"],"weight":3,"by":"NetSurf project, Amiga port by Chris Young","what":"A small open-source engine with real CSS support, with AmigaOS 4 builds and 68k AGA and RTG builds.","why":"The pragmatic middle ground: modern enough CSS to render many current sites, light enough to run on a 68k machine.","version":"3.11 (OS4 Dec 2023 · 68k beta Jan 2024)","url":"https://www.netsurf-browser.org","tags":["browser","open"]},{"id":"wayfarer","name":"Wayfarer","year":2019,"category":"soft","kind":"app","status":"active","arch":["ppc"],"weight":5,"by":"Jacek \"jacadcaps\" Piszczek","what":"A WebKit browser for MorphOS tracking an up-to-date WebKitGTK tree, with a JIT and WebAssembly support — described as the only current big-endian 32-bit PowerPC browser anywhere.","why":"The single most impressive piece of modern Amiga-family software: it makes a twenty-year-old PowerPC Mac a genuinely usable machine for the current web, and it is the strongest practical argument for MorphOS.","version":"11.9 (2026), Dec-2025 WebKit tree","url":"https://wayfarer.icu","related":["morphos3"],"tags":["browser"]},{"id":"amifox","name":"AmiFox","year":2023,"category":"soft","kind":"app","status":"active","arch":["68k","ppc","x86"],"weight":3,"by":"ALB42 (Marcus Sackrow)","what":"A 68k browser that offloads rendering to a server-side headless Chrome and streams the result back as images with clickable regions.","why":"A sideways solution to an impossible problem: the modern web on an unexpanded A500, by not rendering it locally at all.","url":"https://blog.alb42.de","tags":["browser","open"]},{"id":"amitube","name":"AmiTube & BoingTube","year":2021,"category":"soft","kind":"app","status":"active","arch":["68k","ppc","x86"],"weight":2,"by":"ALB42 / community","what":"YouTube clients for classic Amigas: AmiTube searches and downloads via a conversion server that transcodes to CDXL or MPEG, updated through February 2026, joined by the newer BoingTube in January 2026.","why":"Server-side transcoding is the same trick as AmiFox, applied to video — and it works on stock hardware.","url":"https://blog.alb42.de","related":["amifox"],"tags":["video","open"]},{"id":"amigagpt","name":"AmigaGPT","year":2023,"category":"soft","kind":"app","status":"active","arch":["68k","ppc"],"weight":3,"by":"Cameron Armstrong (sacredbanana)","what":"A native ChatGPT client for AmigaOS 3.1 and later, AmigaOS 4 and MorphOS, with chat, image generation, speech output and support for custom OpenAI-compatible servers.","why":"A 1985 architecture talking to a 2026 language model over TLS — and now embedded in AmiKit X13 as its built-in assistant.","version":"2.17.0 (Dec 2025)","url":"https://github.com/sacredbanana/AmigaGPT","related":["amissl"],"tags":["ai","open"]},{"id":"yam","name":"YAM & SimpleMail","year":1996,"category":"soft","kind":"app","status":"active","arch":["68k","ppc","x86"],"weight":3,"by":"Jens Maus & team / Sebastian Bauer","what":"The classic open-source MUI mail clients: YAM (Yet Another Mailer) with POP3, SMTP, TLS, PGP and filters, still producing 2.10 nightly builds, and the lighter SimpleMail. Both run on 68k, AmigaOS 4, MorphOS and AROS.","why":"Thirty years of continuous free-software email on a platform with no commercial incentive to bother.","url":"https://yam.ch","related":["mui","amissl"],"tags":["email","open"]},{"id":"iris","name":"Iris","year":2019,"category":"soft","kind":"app","status":"active","arch":["ppc"],"weight":3,"by":"Jacek Piszczek","what":"A modern MorphOS mail client with real IMAP, OAuth2 for Gmail and Office 365, and HTML mail rendered through WebKit.","why":"OAuth2 support means MorphOS users can still reach mainstream mail providers that have locked out older clients.","version":"1.52–1.53 (2026)","related":["morphos3","wayfarer"],"tags":["email"]},{"id":"amigaamp","name":"AmigaAMP","year":1998,"category":"soft","kind":"app","status":"active","arch":["68k","ppc"],"weight":3,"by":"Thomas Wenzel","what":"The Amiga's WinAmp: MP3 and FLAC playback with skins, AHI output, MHI hardware offload, and S
